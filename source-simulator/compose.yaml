# Keep the established NAB Compose project name so the stateful PostgreSQL and
# Kafka volumes survive this repository reorganisation.
name: nab

services:
  postgres:
    image: postgres:16-alpine
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nab_sources}
      POSTGRES_USER: ${POSTGRES_USER:-nab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nab_app} -d ${POSTGRES_DB:-nab_sources}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': > /dev/tcp/127.0.0.1/9092'"]
      interval: 30s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75

  bootstrap-loader:
    build: ./bootstrap-loader
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nab_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nab_sources}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_BUCKET: ${S3_BUCKET:-g3-assignment}
      BOOTSTRAP_PREFIX: ${BOOTSTRAP_PREFIX:-g3/bootstrap/nab}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: "no"
    mem_limit: 384m
    cpus: 0.50

  kafka-connect:
    image: quay.io/debezium/connect:3.3.2.Final
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: nab-kafka-connect
      CONFIG_STORAGE_TOPIC: _nab_connect_configs
      OFFSET_STORAGE_TOPIC: _nab_connect_offsets
      STATUS_STORAGE_TOPIC: _nab_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bootstrap-loader:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8083:8083
    restart: unless-stopped
    mem_limit: 896m
    cpus: 0.75

  cdc-connector-init:
    build: ./cdc-connector-init
    environment:
      CONNECT_URL: http://kafka-connect:8083
      POSTGRES_DB: ${POSTGRES_DB:-nab_sources}
      POSTGRES_USER: ${POSTGRES_USER:-nab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      kafka-connect:
        condition: service_started
    restart: "no"
    mem_limit: 256m
    cpus: 0.25

  activity-generator:
    build: ./activity-generator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nab_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nab_sources}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_BUCKET: ${S3_BUCKET:-g3-assignment}
      SOURCE_BATCH_PREFIX: ${SOURCE_BATCH_PREFIX:-g3/source/nab/batch}
      SOURCE_ACTIVITY_INTERVAL_SECONDS: ${SOURCE_ACTIVITY_INTERVAL_SECONDS:-300}
      SOURCE_FILE_EVERY_CYCLES: ${SOURCE_FILE_EVERY_CYCLES:-12}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
    depends_on:
      cdc-connector-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  landing-exporter:
    build: ./landing-exporter
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LANDING_ROOT: /landing
      SOURCE_BATCH_PREFIX: ${SOURCE_BATCH_PREFIX:-g3/source/nab/batch}
      MICROBATCH_INTERVAL_SECONDS: ${MICROBATCH_INTERVAL_SECONDS:-300}
      S3_BUCKET: ${S3_BUCKET:-g3-assignment}
      S3_PREFIX: ${S3_PREFIX:-g3/0-ai-trust/bronze/landing}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
    volumes:
      - landing_data:/landing
    depends_on:
      kafka:
        condition: service_healthy
      cdc-connector-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50

  credit-monitor:
    build: ./credit-monitor
    environment:
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      CREDIT_ALERT_TOPIC_ARN: ${CREDIT_ALERT_TOPIC_ARN:?Set CREDIT_ALERT_TOPIC_ARN in .env}
      AWS_CREDIT_ALERT_THRESHOLD_USD: ${AWS_CREDIT_ALERT_THRESHOLD_USD:-80}
      AWS_CREDIT_CHECK_INTERVAL_SECONDS: ${AWS_CREDIT_CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - credit_monitor_state:/state
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

volumes:
  postgres_data:
  kafka_data:
  landing_data:
  credit_monitor_state:
