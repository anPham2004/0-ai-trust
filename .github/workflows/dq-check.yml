name: Live Silver DQ Check

# Runs the assert_true() DQ suite (tests/integration/silver) against the
# already-synced, already-running Silver pipeline right after develop is
# synced to the Databricks Git Folder — this is what makes category-2 "DQ
# runs as part of every pipeline run" an enforced, CI-visible gate instead of
# a README instruction nobody runs. Silver's own refresh cycle is 15 minutes,
# so a DQ regression may not be visible until the next refresh completes;
# this workflow reports what the live tables show at the time it runs, not a
# guarantee that the very latest commit has already been reprocessed.

on:
  workflow_run:
    workflows: ["Sync to Databricks"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  live-dq:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify live DQ credentials are configured
        env:
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          for var in DATABRICKS_SERVER_HOSTNAME DATABRICKS_HTTP_PATH DATABRICKS_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "::error::$var repository secret is not set; live_dq tests would silently skip instead of running."
              exit 1
            fi
          done

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - uses: databricks/setup-cli@main

      - name: Verify pipeline is running and Silver is fresh
        env:
          DATABRICKS_HOST: https://${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          PIPELINE_ID: 7c670140-0765-4e53-baf9-d55762835a15
          REPO_ID: 1237804683921450
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$EXPECTED_COMMIT" ]; then
            repo_json="$(databricks repos get "$REPO_ID" -o json)"
            repo_commit="$(echo "$repo_json" | jq -r '.head_commit_id // .head_commit // empty')"
            if [ "$repo_commit" != "$EXPECTED_COMMIT" ]; then
              echo "::error::Databricks Git Folder is at ${repo_commit:-unknown}, expected $EXPECTED_COMMIT. Silver checks are blocked until sync catches up."
              exit 1
            fi
          fi
          pipeline_json="$(databricks pipelines get "$PIPELINE_ID" -o json)"
          pipeline_state="$(echo "$pipeline_json" | jq -r '.state')"
          latest_update_state="$(echo "$pipeline_json" | jq -r '.latest_updates[0].state')"
          if [ "$pipeline_state" != "RUNNING" ] || [ "$latest_update_state" != "RUNNING" ]; then
            echo "::error::Pipeline state is $pipeline_state and latest update state is $latest_update_state. Live DQ would otherwise test stale data."
            exit 1
          fi
          python scripts/ci/check_live_silver_freshness.py

      - name: Run live Silver DQ checks
        env:
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python -m pytest tests -v -m live_dq
