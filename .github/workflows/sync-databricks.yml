name: Sync to Databricks

on:
  push:
    branches: [develop]

jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository and data contracts
        run: |
          python -m pip install pytest pyyaml datacontract-cli==1.0.14
          find contracts/silver contracts/source/database contracts/source/event contracts/source/file \
            -type f -name '*.yml' -print0 \
            | xargs -0 -n1 -P4 datacontract lint
          python -m pytest tests -q

      - uses: databricks/setup-cli@main

      - name: Pull latest develop into Databricks Git Folder
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks repos update 1237804683921450 --branch develop
