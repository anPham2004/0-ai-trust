bundle:
  name: 0-ai-trust

include:
  - resources/*.yml

variables:
  catalog:
    default: 0-ai-trust
  landing_path:
    default: /Volumes/0-ai-trust/bronze/landing/raw

targets:
  dev:
    default: true
    # This is the single shared Free Edition deployment. Feature branches use
    # Git folders and notebook smoke tests; only reviewed main is deployed.
    mode: production
    workspace:
      host: https://dbc-00affa79-1317.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
