product: app_status_change_history
version: 1.0.0
contract_status: ACTIVE
owner: application-domain
producer: lending-events-platform
canonical_key: change_id
history_mode: APPEND_ONLY
critical_data_elements: [change_id, application_id, old_status, new_status, changed_at]
lineage_l1: event_status_change_history -> silver.app_status_change_history
schema: {change_id: STRING, application_id: STRING, global_id: STRING, old_status: STRING, new_status: STRING, changed_at: TIMESTAMP, reason: STRING}
rules:
  hard:
    - {id: status_change_keys_required, expression: "change_id IS NOT NULL AND application_id IS NOT NULL AND global_id IS NOT NULL"}
    - {id: status_change_values_required, expression: "old_status IS NOT NULL AND new_status IS NOT NULL AND changed_at IS NOT NULL"}
    - {id: status_change_not_noop, expression: "old_status <> new_status"}
  warn: []
tolerances: {hard_failure_rate: 0.0, warning_failure_rate: 0.05}
quality_dimensions: {completeness: [status_change_keys_required], validity: [status_change_values_required], consistency: [status_change_not_noop], timeliness: []}
