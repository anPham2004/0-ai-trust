product: arr_banking_arrangement
version: 1.0.0
contract_status: ACTIVE
owner: arrangement-domain
producer: banking-core-platform
canonical_key: account_id
critical_data_elements: [account_id, global_id, account_type, is_active]
lineage_l1: cdc_banking_accounts + cdc_banking_balances -> silver.arr_banking_arrangement
schema: {global_id: STRING, account_id: STRING, organisation_id: STRING, is_business_arrangement: BOOLEAN, account_type: STRING, is_active: BOOLEAN, is_owner: BOOLEAN, open_date: DATE, current_balance_masked: STRING, available_balance_masked: STRING, currency: STRING}
rules:
  hard:
    - {id: banking_arrangement_key_required, expression: "account_id IS NOT NULL AND global_id IS NOT NULL"}
    - {id: banking_arrangement_type_required, expression: "account_type IS NOT NULL"}
  warn:
    - {id: banking_balance_missing, expression: "current_balance_masked IS NOT NULL"}
tolerances: {hard_failure_rate: 0.0, warning_failure_rate: 0.05}
quality_dimensions: {completeness: [banking_arrangement_key_required], validity: [banking_arrangement_type_required], consistency: [banking_balance_missing], timeliness: []}
