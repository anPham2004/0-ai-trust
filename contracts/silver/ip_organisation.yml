product: ip_organisation
version: 1.0.0
contract_status: ACTIVE
owner: involved-party-domain
producer: organisation-master-platform
canonical_key: organisation_id
critical_data_elements: [organisation_id, global_id, business_name, organisation_type]
lineage_l1: cdc_organisations -> silver.ip_organisation
schema: {global_id: STRING, organisation_id: STRING, business_name: STRING, legal_name: STRING, short_name: STRING, organisation_type: STRING, industry_code: STRING, industry_code_version: STRING, registered_country: STRING, is_acnc_registered: BOOLEAN, agent_role: STRING, abn_masked: STRING, acn_masked: STRING, establishment_date: DATE, last_updated_at: TIMESTAMP}
rules:
  hard:
    - {id: organisation_key_required, expression: "organisation_id IS NOT NULL AND global_id IS NOT NULL"}
    - {id: organisation_name_required, expression: "business_name IS NOT NULL"}
    - {id: organisation_type_required, expression: "organisation_type IS NOT NULL"}
  warn:
    - {id: organisation_country_missing, expression: "registered_country IS NOT NULL"}
tolerances: {hard_failure_rate: 0.0, warning_failure_rate: 0.05}
quality_dimensions: {completeness: [organisation_key_required, organisation_name_required], validity: [organisation_type_required], consistency: [], timeliness: []}
