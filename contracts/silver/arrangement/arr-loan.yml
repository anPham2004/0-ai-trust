product: arr_loan
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: banking-domain
producer: banking-platform
consumers: [banker-assist, lending-operations]
description: >
  Loan account servicing details from CDC. Covers personal and business loans
  with masked financial amounts.

canonical_key: loan_id
customer_key: global_id
keys:
  primary_key: [loan_id]
  alternate_keys: []
critical_data_elements: [loan_id, global_id, loan_type, status]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.loan_accounts
    fields: [global_id, loanId, accountId, loanType, status,
             interestRate, repaymentFrequency, termMonths, startDate,
             maturityDate, originalAmount, currentBalance]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  lending-servicing DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: loan_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: account_id
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to arr_banking_arrangement"
  - name: loan_type
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: interest_type
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
    description: "FIXED/VARIABLE, derived from interestRate"
    allowed_values: [FIXED, VARIABLE]
  - name: repayment_frequency
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: term_months
    type: INT
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: counter
  - name: start_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: maturity_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: original_amount_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    masking: range_bucket
  - name: current_balance_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    masking: range_bucket
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: LOAN_ID_NULL
      expression: "loan_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: LOAN_TYPE_NULL
      expression: "loan_type IS NOT NULL"
      description: "Loan type required"
    - id: STATUS_NULL
      expression: "status IS NOT NULL"
      description: "Loan status required"
    - id: MATURITY_DATE_ORDER
      expression: "maturity_date IS NULL OR start_date IS NULL OR maturity_date >= start_date"
      description: "Maturity must follow start date"
    - id: LOAN_ID_UUID_FORMAT
      expression: "loan_id IS NULL OR loan_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "loan_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: ACCOUNT_ID_UUID_FORMAT
      expression: "account_id IS NULL OR account_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "account_id must be valid UUID format when present"
  warn:
    - id: TERM_MONTHS_RANGE
      expression: "term_months IS NULL OR (term_months > 0 AND term_months <= 600)"
      description: "Loan term within reasonable range"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [LOAN_ID_NULL, GLOBAL_ID_NULL, LOAN_TYPE_NULL, STATUS_NULL]
  validity: [MATURITY_DATE_ORDER, LOAN_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT, ACCOUNT_ID_UUID_FORMAT]

ai_policy:
  allowed: [loan_summary, repayment_schedule_overview]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment,
               display_exact_balance]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  freshness_days: 30
  max_term_months: 600
