product: arr_mortgage
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: banking-domain
producer: banking-platform
consumers: [banker-assist, lending-operations]
description: >
  Mortgage account details from CDC. Covers personal and business mortgages
  with LVR and masked loan amounts.

canonical_key: mortgage_id
customer_key: global_id
keys:
  primary_key: [mortgage_id]
  alternate_keys: []
critical_data_elements: [mortgage_id, global_id, interest_type]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.mortgage_accounts
    fields: [global_id, mortgageId, accountId, interestType,
             repaymentFrequency, loanTerm, startDate, lvrPercent, loanAmount]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  lending-servicing DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: mortgage_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: account_id
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to arr_banking_arrangement"
  - name: interest_type
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: repayment_frequency
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: loan_term
    type: INT
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: counter
  - name: start_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: lvr_percent
    type: STRING
    required: false
    nullable: true
    classification: CONFIDENTIAL
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    description: "Banker-only"
  - name: loan_amount_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    masking: range_bucket
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: MORTGAGE_ID_NULL
      expression: "mortgage_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: MORTGAGE_ID_UUID_FORMAT
      expression: "mortgage_id IS NULL OR mortgage_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "mortgage_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: ACCOUNT_ID_UUID_FORMAT
      expression: "account_id IS NULL OR account_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "account_id must be valid UUID format when present"
  warn:
    - id: LVR_RANGE
      expression: "lvr_percent IS NULL OR (CAST(lvr_percent AS DOUBLE) >= 0 AND CAST(lvr_percent AS DOUBLE) <= 100)"
      description: "LVR should be 0-100%"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [MORTGAGE_ID_NULL, GLOBAL_ID_NULL]
  validity: [MORTGAGE_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT, ACCOUNT_ID_UUID_FORMAT]

ai_policy:
  allowed: [mortgage_summary, repayment_overview]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment,
               display_exact_balance, display_lvr]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  freshness_days: 30
