product: arr_credit_card
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: banking-domain
producer: banking-platform
consumers: [banker-assist, lending-operations]
description: >
  Credit card arrangement from CDC. Covers personal and business cards
  with masked card number and credit limit.

canonical_key: credit_card_id
customer_key: global_id
keys:
  primary_key: [credit_card_id]
  alternate_keys: []
critical_data_elements: [credit_card_id, global_id, card_type, status]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.credit_cards
    fields: [global_id, creditCardId, organisationId, cardType, status,
             rewardProgram, issuedDate, cardNumber, creditLimit]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  banking-core DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: credit_card_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: organisation_id
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "NULL = personal, populated = business"
  - name: is_business_arrangement
    type: BOOLEAN
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Derived: organisationId IS NOT NULL"
  - name: card_type
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: reward_program
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: issued_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: card_number_masked
    type: STRING
    required: true
    nullable: false
    classification: RESTRICTED
    is_pii: true
    pii_type: DIRECT_IDENTIFIER
    logical_type: identifier
    masking: partial_mask
    description: "**** **** **** XXXX"
  - name: credit_limit_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    masking: range_bucket
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: CREDIT_CARD_ID_NULL
      expression: "credit_card_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: CARD_TYPE_NULL
      expression: "card_type IS NOT NULL"
      description: "Card type required"
    - id: STATUS_NULL
      expression: "status IS NOT NULL"
      description: "Card status required"
    - id: CARD_NUMBER_MASKED_NULL
      expression: "card_number_masked IS NOT NULL"
      description: "Masked card number required"
    - id: CREDIT_CARD_ID_UUID_FORMAT
      expression: "credit_card_id IS NULL OR credit_card_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "credit_card_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: ORGANISATION_ID_UUID_FORMAT
      expression: "organisation_id IS NULL OR organisation_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "organisation_id must be valid UUID format when present"
  warn: []

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [CREDIT_CARD_ID_NULL, GLOBAL_ID_NULL, CARD_TYPE_NULL, STATUS_NULL,
                 CARD_NUMBER_MASKED_NULL]
  validity: [CREDIT_CARD_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT, ORGANISATION_ID_UUID_FORMAT]

ai_policy:
  allowed: [card_summary, reward_program_lookup]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment,
               display_full_card_number, display_exact_credit_limit]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  freshness_days: 30
