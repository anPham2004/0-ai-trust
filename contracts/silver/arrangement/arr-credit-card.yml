kind: DataContract
apiVersion: v3.1.0
id: silver.arrangement.arr_credit_card
version: 1.0.0
name: arr_credit_card
status: draft
domain: BANKING
description:
  purpose: |
    Credit card arrangement from CDC. Covers personal and business cards with masked card number and credit limit.
servers:
- server: silver-delta-lake
  type: databricks
  catalog: 0-ai-trust
  schema: silver
  description: Silver Delta Lake table for arr_credit_card
  environment: prod
schema:
- name: arr_credit_card
  logicalType: object
  physicalType: table
  quality:
  - id: CREDIT_CARD_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: credit_card_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Customer FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: CARD_TYPE_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: card_type IS NOT NULL
    severity: error
    dimension: completeness
    description: Card type required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: STATUS_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: status IS NOT NULL
    severity: error
    dimension: completeness
    description: Card status required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: CARD_NUMBER_MASKED_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: card_number_masked IS NOT NULL
    severity: error
    dimension: completeness
    description: Masked card number required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: CREDIT_CARD_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: credit_card_id IS NULL OR credit_card_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: credit_card_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: global_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ORGANISATION_ID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: organisation_id IS NULL OR organisation_id RLIKE '^ORG-[0-9]{5}$'
    severity: error
    dimension: conformity
    description: organisation_id must match the organisation business-key format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  properties:
  - name: global_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: credit_card_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: organisation_id
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: is_business_arrangement
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: card_type
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: reward_program
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: issued_date
    logicalType: date
    physicalType: DATE
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: date
  - name: card_number_masked
    logicalType: string
    physicalType: STRING
    required: true
    classification: RESTRICTED
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: DIRECT_IDENTIFIER
        handling: partial_mask
    - property: g3:domainType
      value: identifier
  - name: credit_limit_masked
    logicalType: string
    physicalType: STRING
    classification: RESTRICTED
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: range_bucket
    - property: g3:domainType
      value: amount
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Alert threshold for quarantined row proportion
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_credit_cards
    source_dataset: public.credit_cards
    fields:
    - global_id
    - creditCardId
    - organisationId
    - cardType
    - status
    - rewardProgram
    - issuedDate
    - cardNumber
    - creditLimit
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:freshnessSla
  value: 24 hours
- property: g3:lineage
  value:
    l1: |
      banking-core DB -> Debezium -> Kafka CDC topics -> landing-exporter -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
    l2_required: true
- property: g3:knownSourceLimitations
  value:
  - CDC eventual consistency — records may arrive out of order within partition
- property: g3:lifecycle
  value:
    owner: banking-domain
    producer: banking-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: credit_card_id
    customer_key: global_id
    critical_data_elements:
    - credit_card_id
    - global_id
    - card_type
    - status
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - CREDIT_CARD_ID_NULL
    - GLOBAL_ID_NULL
    - CARD_TYPE_NULL
    - STATUS_NULL
    - CARD_NUMBER_MASKED_NULL
    validity:
    - CREDIT_CARD_ID_UUID_FORMAT
    - GLOBAL_ID_UUID_FORMAT
    - ORGANISATION_ID_FORMAT
- property: g3:aiPolicy
  value:
    allowed:
    - card_summary
    - reward_program_lookup
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
    - display_full_card_number
    - display_exact_credit_limit
- property: g3:zeroTrust
  value:
    quality_evidence_location: pipeline_event_log_and_quarantine
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:parameters
  value:
    freshness_days: 30
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
