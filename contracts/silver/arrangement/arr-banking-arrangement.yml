product: arr_banking_arrangement
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: banking-domain
producer: banking-platform
consumers: [banker-assist, lending-operations]
description: >
  Banking account arrangement with balance snapshot from CDC.
  Joined from banking_accounts + banking_balances bronze CDC payloads.

canonical_key: account_id
customer_key: global_id
keys:
  primary_key: [account_id]
  alternate_keys: []
critical_data_elements: [account_id, global_id, account_type, is_active]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.banking_accounts
    fields: [global_id, accountId, organisationId, accountType, isActive,
             isOwner, openDate]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.banking_balances
    fields: [accountId, currentBalance, availableBalance, currency]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  banking-core DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: account_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: organisation_id
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "NULL = personal, populated = business"
  - name: is_business_arrangement
    type: BOOLEAN
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Derived: organisationId IS NOT NULL"
  - name: account_type
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: is_active
    type: BOOLEAN
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
  - name: is_owner
    type: BOOLEAN
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
  - name: open_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: current_balance_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    masking: range_bucket
    description: "Never exact, range bucket only"
  - name: available_balance_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    masking: range_bucket
  - name: currency
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: code
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: ACCOUNT_ID_NULL
      expression: "account_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: ACCOUNT_TYPE_NULL
      expression: "account_type IS NOT NULL"
      description: "Account type required"
    - id: ACCOUNT_ID_UUID_FORMAT
      expression: "account_id IS NULL OR account_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "account_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: ORGANISATION_ID_UUID_FORMAT
      expression: "organisation_id IS NULL OR organisation_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "organisation_id must be valid UUID format when present"
  warn:
    - id: BALANCE_NEGATIVE
      expression: "current_balance_masked IS NULL OR current_balance_masked != 'NEGATIVE'"
      description: "Flag negative balance buckets"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [ACCOUNT_ID_NULL, GLOBAL_ID_NULL, ACCOUNT_TYPE_NULL]
  validity: [ACCOUNT_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT, ORGANISATION_ID_UUID_FORMAT]

ai_policy:
  allowed: [account_summary, balance_range_display]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment,
               display_exact_balance]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  freshness_days: 30
