product: app_application_event
version: 1.0.0
contract_status: ACTIVE
owner: application-domain
producer: lending-events-platform
canonical_key: event_id
critical_data_elements: [event_id, application_id, lifecycle_transition, event_timestamp]
lineage_l1: event_loan_application_events -> silver.app_application_event
schema: {event_id: STRING, application_id: STRING, global_id: STRING, concept_name: STRING, lifecycle_transition: STRING, event_timestamp: TIMESTAMP, event_origin: STRING, action: STRING}
rules:
  hard:
    - {id: application_event_keys_required, expression: "event_id IS NOT NULL AND application_id IS NOT NULL AND global_id IS NOT NULL"}
    - {id: application_event_values_required, expression: "lifecycle_transition IS NOT NULL AND event_timestamp IS NOT NULL"}
  warn: []
tolerances: {hard_failure_rate: 0.0, warning_failure_rate: 0.05}
quality_dimensions: {completeness: [application_event_keys_required], validity: [application_event_values_required], consistency: [], timeliness: []}
