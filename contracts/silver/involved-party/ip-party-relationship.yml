kind: DataContract
apiVersion: v3.1.0
id: silver.involved_party.ip_party_relationship
version: 1.0.0
name: ip_party_relationship
status: draft
domain: CUSTOMER
description:
  purpose: |
    Organisation-to-person relationships from CDC. Links individuals to organisations with role and authority level.
servers:
- server: silver-delta-lake
  type: databricks
  description: Silver Delta Lake table for ip_party_relationship
  environment: prod
schema:
- name: ip_party_relationship
  logicalType: object
  physicalType: table
  quality:
  - id: RELATIONSHIP_ID_NULL
    type: sql
    query: relationship_id IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_NULL
    type: sql
    query: global_id IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Person FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ORGANISATION_ID_NULL
    type: sql
    query: organisation_id IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Organisation FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: PARTY_ROLE_INVALID
    type: sql
    query: party_role IN ('DIRECTOR','AUTHORISED_REPRESENTATIVE','BENEFICIAL_OWNER','SIGNATORY','GUARANTOR','SECRETARY')
    mustBe: 0
    severity: error
    dimension: conformity
    description: Must be a known party role
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: AUTHORITY_LEVEL_INVALID
    type: sql
    query: authority_level IN ('FULL','LIMITED','VIEW_ONLY')
    mustBe: 0
    severity: error
    dimension: conformity
    description: Must be a known authority level
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: RELATIONSHIP_ID_UUID_FORMAT
    type: sql
    query: relationship_id IS NULL OR relationship_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    mustBe: 0
    severity: error
    dimension: conformity
    description: relationship_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_UUID_FORMAT
    type: sql
    query: global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    mustBe: 0
    severity: error
    dimension: conformity
    description: global_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ORGANISATION_ID_UUID_FORMAT
    type: sql
    query: organisation_id IS NULL OR organisation_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    mustBe: 0
    severity: error
    dimension: conformity
    description: organisation_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: END_DATE_ORDER
    type: sql
    query: end_date IS NULL OR end_date >= start_date
    mustBe: 0
    severity: warning
    dimension: conformity
    description: End date must be after start date
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: relationship_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: global_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: organisation_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: party_role
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - DIRECTOR
        - AUTHORISED_REPRESENTATIVE
        - BENEFICIAL_OWNER
        - SIGNATORY
        - GUARANTOR
        - SECRETARY
  - name: authority_level
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - FULL
        - LIMITED
        - VIEW_ONLY
  - name: is_active
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: start_date
    logicalType: date
    physicalType: DATE
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: date
  - name: end_date
    logicalType: date
    physicalType: DATE
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: date
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: dq_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - PASSED
        - FAILED
        - WARNING
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Max proportion of hard-rule failures before pipeline halts
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.organisation_party_relationships
    fields:
    - relationshipId
    - global_id
    - organisationId
    - partyRole
    - authorityLevel
    - isActive
    - startDate
    - endDate
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:freshnessSla
  value: 24 hours
- property: g3:lineage
  value:
    l1: |
      customer-master DB -> Debezium -> Kafka CDC topics -> landing-exporter -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
    l2_required: true
- property: g3:knownSourceLimitations
  value:
  - CDC eventual consistency — records may arrive out of order within partition
- property: g3:lifecycle
  value:
    owner: customer-domain
    producer: customer-master-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: relationship_id
    customer_key: global_id
    critical_data_elements:
    - relationship_id
    - global_id
    - organisation_id
    - party_role
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - RELATIONSHIP_ID_NULL
    - GLOBAL_ID_NULL
    - ORGANISATION_ID_NULL
    validity:
    - PARTY_ROLE_INVALID
    - AUTHORITY_LEVEL_INVALID
    - RELATIONSHIP_ID_UUID_FORMAT
    - GLOBAL_ID_UUID_FORMAT
    - ORGANISATION_ID_UUID_FORMAT
    - END_DATE_ORDER
- property: g3:aiPolicy
  value:
    allowed:
    - relationship_lookup
    - authority_check
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
- property: g3:zeroTrust
  value:
    quality_status_required: true
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:parameters
  value:
    allowed_party_roles:
    - DIRECTOR
    - AUTHORISED_REPRESENTATIVE
    - BENEFICIAL_OWNER
    - SIGNATORY
    - GUARANTOR
    - SECRETARY
    allowed_authority_levels:
    - FULL
    - LIMITED
    - VIEW_ONLY
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
