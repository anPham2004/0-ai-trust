product: ip_party_relationship
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: customer-domain
producer: customer-master-platform
consumers: [banker-assist, lending-operations]
description: >
  Organisation-to-person relationships from CDC. Links individuals to organisations
  with role and authority level.

canonical_key: relationship_id
customer_key: global_id
keys:
  primary_key: [relationship_id]
  alternate_keys: []
critical_data_elements: [relationship_id, global_id, organisation_id, party_role]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.organisation_party_relationships
    fields: [relationshipId, global_id, organisationId, partyRole, authorityLevel,
             isActive, startDate, endDate]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  customer-master DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: relationship_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual (the person)"
  - name: organisation_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_organisation"
  - name: party_role
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [DIRECTOR, AUTHORISED_REPRESENTATIVE, BENEFICIAL_OWNER,
                     SIGNATORY, GUARANTOR, SECRETARY]
  - name: authority_level
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [FULL, LIMITED, VIEW_ONLY]
  - name: is_active
    type: BOOLEAN
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
  - name: start_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: end_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
    description: "Null if still active"
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: RELATIONSHIP_ID_NULL
      expression: "relationship_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Person FK must exist"
    - id: ORGANISATION_ID_NULL
      expression: "organisation_id IS NOT NULL"
      description: "Organisation FK must exist"
    - id: PARTY_ROLE_INVALID
      expression: "party_role IN ('DIRECTOR','AUTHORISED_REPRESENTATIVE','BENEFICIAL_OWNER','SIGNATORY','GUARANTOR','SECRETARY')"
      description: "Must be a known party role"
    - id: AUTHORITY_LEVEL_INVALID
      expression: "authority_level IN ('FULL','LIMITED','VIEW_ONLY')"
      description: "Must be a known authority level"
    - id: RELATIONSHIP_ID_UUID_FORMAT
      expression: "relationship_id IS NULL OR relationship_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "relationship_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: ORGANISATION_ID_UUID_FORMAT
      expression: "organisation_id IS NULL OR organisation_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "organisation_id must be valid UUID format when present"
  warn:
    - id: END_DATE_ORDER
      expression: "end_date IS NULL OR end_date >= start_date"
      description: "End date must be after start date"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [RELATIONSHIP_ID_NULL, GLOBAL_ID_NULL, ORGANISATION_ID_NULL]
  validity: [PARTY_ROLE_INVALID, AUTHORITY_LEVEL_INVALID, RELATIONSHIP_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT, ORGANISATION_ID_UUID_FORMAT]

ai_policy:
  allowed: [relationship_lookup, authority_check]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  allowed_party_roles: [DIRECTOR, AUTHORISED_REPRESENTATIVE, BENEFICIAL_OWNER,
                        SIGNATORY, GUARANTOR, SECRETARY]
  allowed_authority_levels: [FULL, LIMITED, VIEW_ONLY]
