kind: DataContract
apiVersion: v3.1.0
id: silver.involved_party.ip_org_relationship
version: 1.0.0
name: ip_org_relationship
status: draft
domain: CUSTOMER
description:
  purpose: |
    Organisation-to-organisation relationships from CDC. Parent/subsidiary, trust, partnership, franchise, and joint venture structures.
servers:
- server: silver-delta-lake
  type: databricks
  catalog: 0-ai-trust
  schema: silver
  description: Silver Delta Lake table for ip_org_relationship
  environment: prod
schema:
- name: ip_org_relationship
  logicalType: object
  physicalType: table
  quality:
  - id: RELATIONSHIP_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: relationship_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SOURCE_ORG_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: source_org_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Source organisation FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: TARGET_ORG_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: target_org_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Target organisation FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: RELATIONSHIP_TYPE_INVALID
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: relationship_type IN ('PARENT_SUBSIDIARY','TRUST_TRUSTEE','PARTNERSHIP','FRANCHISE','JOINT_VENTURE')
    severity: error
    dimension: conformity
    description: Must be a known relationship type
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SELF_RELATIONSHIP
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: source_org_id != target_org_id
    severity: error
    dimension: conformity
    description: Organisation cannot relate to itself
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: RELATIONSHIP_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: relationship_id IS NULL OR relationship_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: relationship_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SOURCE_ORG_ID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: source_org_id IS NULL OR source_org_id RLIKE '^ORG-[0-9]{5}$'
    severity: error
    dimension: conformity
    description: source_org_id must match the organisation business-key format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: TARGET_ORG_ID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: target_org_id IS NULL OR target_org_id RLIKE '^ORG-[0-9]{5}$'
    severity: error
    dimension: conformity
    description: target_org_id must match the organisation business-key format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  properties:
  - name: relationship_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_org_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: target_org_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: relationship_type
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - PARENT_SUBSIDIARY
        - TRUST_TRUSTEE
        - PARTNERSHIP
        - FRANCHISE
        - JOINT_VENTURE
  - name: is_active
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: start_date
    logicalType: date
    physicalType: DATE
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: date
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Alert threshold for quarantined row proportion
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_organisation_relationships
    source_dataset: public.organisation_relationships
    fields:
    - relationshipId
    - sourceOrgId
    - targetOrgId
    - relationshipType
    - isActive
    - startDate
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:freshnessSla
  value: 24 hours
- property: g3:lineage
  value:
    l1: |
      customer-master DB -> Debezium -> Kafka CDC topics -> landing-exporter -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
    l2_required: true
- property: g3:knownSourceLimitations
  value:
  - CDC eventual consistency — records may arrive out of order within partition
- property: g3:lifecycle
  value:
    owner: customer-domain
    producer: customer-master-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: relationship_id
    critical_data_elements:
    - relationship_id
    - source_org_id
    - target_org_id
    - relationship_type
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - RELATIONSHIP_ID_NULL
    - SOURCE_ORG_ID_NULL
    - TARGET_ORG_ID_NULL
    validity:
    - RELATIONSHIP_TYPE_INVALID
    - SELF_RELATIONSHIP
    - RELATIONSHIP_ID_UUID_FORMAT
    - SOURCE_ORG_ID_FORMAT
    - TARGET_ORG_ID_FORMAT
- property: g3:aiPolicy
  value:
    allowed:
    - relationship_lookup
    - corporate_structure_summary
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
- property: g3:zeroTrust
  value:
    quality_evidence_location: pipeline_event_log_and_quarantine
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:parameters
  value:
    allowed_relationship_types:
    - PARENT_SUBSIDIARY
    - TRUST_TRUSTEE
    - PARTNERSHIP
    - FRANCHISE
    - JOINT_VENTURE
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
