product: ip_organisation
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: customer-domain
producer: customer-master-platform
consumers: [banker-assist, lending-operations]
description: >
  Organisation entity from CDC. Business customers, trusts, partnerships.

canonical_key: organisation_id
customer_key: global_id
keys:
  primary_key: [organisation_id]
  alternate_keys: []
critical_data_elements: [organisation_id, global_id, business_name, organisation_type]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.organisations
    fields: [global_id, organisationId, businessName, legalName, shortName,
             organisationType, industryCode, industryCodeVersion, registeredCountry,
             isACNCRegistered, agentRole, abn, acn, establishmentDate, lastUpdateTime]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  customer-master DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: organisation_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: business_name
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
    description: "Publicly registered with ASIC"
  - name: legal_name
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
    description: "Publicly registered with ASIC"
  - name: short_name
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: organisation_type
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: industry_code
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: code
  - name: industry_code_version
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: code
  - name: registered_country
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: code
    description: "Always AUS"
  - name: is_acnc_registered
    type: BOOLEAN
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Charity flag"
  - name: agent_role
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PRINCIPLE, DIRECTOR, OWNER]
  - name: abn_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: DIRECT_IDENTIFIER
    logical_type: identifier
    masking: partial_mask
    description: "Last 3 digits visible"
  - name: acn_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: DIRECT_IDENTIFIER
    logical_type: identifier
    masking: partial_mask
    description: "Last 3 digits visible"
  - name: establishment_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: last_updated_at
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: ORGANISATION_ID_NULL
      expression: "organisation_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer link must exist"
    - id: BUSINESS_NAME_NULL
      expression: "business_name IS NOT NULL"
      description: "Business name required"
    - id: ORG_TYPE_NULL
      expression: "organisation_type IS NOT NULL"
      description: "Organisation type required"
    - id: ORGANISATION_ID_UUID_FORMAT
      expression: "organisation_id IS NULL OR organisation_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "organisation_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: BUSINESS_NAME_NOT_BLANK
      expression: "business_name IS NULL OR length(trim(business_name)) > 0"
      description: "business_name must not be empty or whitespace-only when present"
  warn:
    - id: ORG_SNAPSHOT_STALE
      expression: "last_updated_at >= date_sub(current_date(), 30)"
      description: "Record updated within 30 days"
    - id: ABN_FORMAT_CHECK
      expression: "abn_masked IS NULL OR length(abn_masked) >= 3"
      description: "ABN masked value present"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [ORGANISATION_ID_NULL, GLOBAL_ID_NULL, BUSINESS_NAME_NULL, ORG_TYPE_NULL, BUSINESS_NAME_NOT_BLANK]
  validity: [ORGANISATION_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT]
  timeliness: [ORG_SNAPSHOT_STALE]

ai_policy:
  allowed: [organisation_summary, relationship_lookup]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  freshness_days: 30
