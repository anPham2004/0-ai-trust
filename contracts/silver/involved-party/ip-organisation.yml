kind: DataContract
apiVersion: v3.1.0
id: silver.involved_party.ip_organisation
version: 1.0.0
name: ip_organisation
status: draft
domain: CUSTOMER
description:
  purpose: |
    Organisation entity from CDC. Business customers, trusts, partnerships.
servers:
- server: silver-delta-lake
  type: databricks
  catalog: 0-ai-trust
  schema: silver
  description: Silver Delta Lake table for ip_organisation
  environment: prod
schema:
- name: ip_organisation
  logicalType: object
  physicalType: table
  quality:
  - id: ORGANISATION_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: organisation_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Customer link must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: BUSINESS_NAME_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: business_name IS NOT NULL
    severity: error
    dimension: completeness
    description: Business name required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ORG_TYPE_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: organisation_type IS NOT NULL
    severity: error
    dimension: completeness
    description: Organisation type required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ORGANISATION_ID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: organisation_id IS NULL OR organisation_id RLIKE '^ORG-[0-9]{5}$'
    severity: error
    dimension: conformity
    description: organisation_id must match the organisation business-key format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: global_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: BUSINESS_NAME_NOT_BLANK
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: business_name IS NULL OR length(trim(business_name)) > 0
    severity: error
    dimension: completeness
    description: business_name must not be empty or whitespace-only when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ORG_SNAPSHOT_STALE
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: last_updated_at >= date_sub(current_date(), 30)
    severity: warning
    dimension: timeliness
    description: Record updated within 30 days
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ABN_FORMAT_CHECK
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: abn_masked IS NULL OR length(abn_masked) >= 3
    severity: warning
    dimension: conformity
    description: ABN masked value present
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: organisation_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: business_name
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: legal_name
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: short_name
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: organisation_type
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: industry_code
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: code
  - name: industry_code_version
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: code
  - name: registered_country
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: code
  - name: is_acnc_registered
    logicalType: boolean
    physicalType: BOOLEAN
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: agent_role
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - PRINCIPLE
        - DIRECTOR
        - OWNER
  - name: abn_masked
    logicalType: string
    physicalType: STRING
    classification: RESTRICTED
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: DIRECT_IDENTIFIER
        handling: partial_mask
    - property: g3:domainType
      value: identifier
  - name: acn_masked
    logicalType: string
    physicalType: STRING
    classification: RESTRICTED
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: DIRECT_IDENTIFIER
        handling: partial_mask
    - property: g3:domainType
      value: identifier
  - name: establishment_date
    logicalType: date
    physicalType: DATE
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: date
  - name: last_updated_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Alert threshold for quarantined row proportion
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_organisations
    source_dataset: public.organisations
    fields:
    - global_id
    - organisationId
    - businessName
    - legalName
    - shortName
    - organisationType
    - industryCode
    - industryCodeVersion
    - registeredCountry
    - isACNCRegistered
    - agentRole
    - abn
    - acn
    - establishmentDate
    - lastUpdateTime
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:freshnessSla
  value: 24 hours
- property: g3:lineage
  value:
    l1: |
      customer-master DB -> Debezium -> Kafka CDC topics -> landing-exporter -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
    l2_required: true
- property: g3:knownSourceLimitations
  value:
  - CDC eventual consistency — records may arrive out of order within partition
- property: g3:lifecycle
  value:
    owner: customer-domain
    producer: customer-master-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: organisation_id
    customer_key: global_id
    critical_data_elements:
    - organisation_id
    - global_id
    - business_name
    - organisation_type
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - ORGANISATION_ID_NULL
    - GLOBAL_ID_NULL
    - BUSINESS_NAME_NULL
    - ORG_TYPE_NULL
    - BUSINESS_NAME_NOT_BLANK
    validity:
    - ORGANISATION_ID_FORMAT
    - GLOBAL_ID_UUID_FORMAT
    - ABN_FORMAT_CHECK
    timeliness:
    - ORG_SNAPSHOT_STALE
- property: g3:aiPolicy
  value:
    allowed:
    - organisation_summary
    - relationship_lookup
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
- property: g3:zeroTrust
  value:
    quality_evidence_location: pipeline_event_log_and_quarantine
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:parameters
  value:
    freshness_days: 30
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
