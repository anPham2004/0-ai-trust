product: app_status_change
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: lending-domain
producer: loan-origination-platform
consumers: [banker-assist, lending-operations]
description: >
  Application status change history from Kafka events. Records each
  status transition with reason.

canonical_key: change_id
customer_key: global_id
keys:
  primary_key: [change_id]
  alternate_keys: []
critical_data_elements: [change_id, application_id, old_status, new_status]
lifecycle_stage: Monitor

sources:
  - type: EVENT
    ingestion_mechanism: APACHE_KAFKA
    bronze_sink: kafka_events
    source_dataset: status_change_history
    fields: [changeId, applicationId, global_id, oldStatus, newStatus,
             changedAt, reason]

freshness_sla: 24 hours
lineage_l1: >
  loan-origination events -> Kafka -> landing-exporter
  -> S3 bronze/landing/event/ -> Auto Loader -> bronze.kafka_events -> Silver
lineage_l2_required: true
known_source_limitations: []

output_schema:
  - name: change_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: application_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to app_application"
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: old_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: new_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: changed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: reason
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: description
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: CHANGE_ID_NULL
      expression: "change_id IS NOT NULL"
      description: "Primary key must exist"
    - id: APPLICATION_ID_NULL
      expression: "application_id IS NOT NULL"
      description: "Application FK must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: OLD_STATUS_NULL
      expression: "old_status IS NOT NULL"
      description: "Previous status required"
    - id: NEW_STATUS_NULL
      expression: "new_status IS NOT NULL"
      description: "New status required"
    - id: CHANGED_AT_NULL
      expression: "changed_at IS NOT NULL"
      description: "Change timestamp required"
    - id: STATUS_SAME
      expression: "old_status != new_status"
      description: "Status must actually change"
    - id: CHANGE_ID_UUID_FORMAT
      expression: "change_id IS NULL OR change_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "change_id must be valid UUID format when present"
    - id: APPLICATION_ID_UUID_FORMAT
      expression: "application_id IS NULL OR application_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "application_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: OLD_STATUS_NOT_BLANK
      expression: "old_status IS NULL OR length(trim(old_status)) > 0"
      description: "old_status must not be empty or whitespace-only when present"
    - id: NEW_STATUS_NOT_BLANK
      expression: "new_status IS NULL OR length(trim(new_status)) > 0"
      description: "new_status must not be empty or whitespace-only when present"
  warn: []

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [CHANGE_ID_NULL, APPLICATION_ID_NULL, GLOBAL_ID_NULL,
                 OLD_STATUS_NULL, NEW_STATUS_NULL, CHANGED_AT_NULL,
                 OLD_STATUS_NOT_BLANK, NEW_STATUS_NOT_BLANK]
  validity: [STATUS_SAME, CHANGE_ID_UUID_FORMAT, APPLICATION_ID_UUID_FORMAT,
             GLOBAL_ID_UUID_FORMAT]

ai_policy:
  allowed: [status_history_summary, transition_lookup]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  allowed_status_transitions:
    - Assessment->Cancelled
    - Assessment->Conditionally_Approved
    - Assessment->Credit_Check
    - Assessment->Withdrawn
    - Conditionally_Approved->Document_Verification
    - Credit_Check->Approved
    - Credit_Check->Denied
    - Document_Verification->Assessment
    - Submitted->Document_Verification
