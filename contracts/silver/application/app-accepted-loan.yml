product: app_accepted_loan
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: lending-domain
producer: loan-origination-platform
consumers: [banker-assist, lending-operations]
description: >
  Accepted loan records from S3 file source. Historical approved loans
  with grade and masked amounts.

canonical_key: loan_id
customer_key: global_id
keys:
  primary_key: [loan_id]
  alternate_keys: []
critical_data_elements: [loan_id, global_id, loan_status]
lifecycle_stage: Monitor

sources:
  - type: FILE
    ingestion_mechanism: S3_MICROBATCH
    bronze_sink: file_arrivals
    source_dataset: accepted_loans
    fields: [global_id, loanId, loanStatus, purpose, term, grade,
             issuedAt, loanAmount]

freshness_sla: 24 hours
lineage_l1: >
  lending-history files -> S3 bronze/landing/file/
  -> Auto Loader -> bronze.file_arrivals -> Silver
lineage_l2_required: true
known_source_limitations:
  - "FILE source with 152 columns; only 8 modelled — remaining columns excluded from Silver"

output_schema:
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: loan_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: loan_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: purpose
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: term
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: counter
  - name: grade
    type: STRING
    required: false
    nullable: true
    classification: CONFIDENTIAL
    is_pii: false
    logical_type: category
    description: "Banker-only"
  - name: issued_at
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: loan_amount_masked
    type: STRING
    required: false
    nullable: true
    classification: RESTRICTED
    is_pii: true
    pii_type: FINANCIAL_INFORMATION
    logical_type: amount
    masking: range_bucket
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: LOAN_ID_NULL
      expression: "loan_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: LOAN_STATUS_NULL
      expression: "loan_status IS NOT NULL"
      description: "Loan status required"
    - id: LOAN_ID_UUID_FORMAT
      expression: "loan_id IS NULL OR loan_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "loan_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
  warn: []

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [LOAN_ID_NULL, GLOBAL_ID_NULL, LOAN_STATUS_NULL]
  validity: [LOAN_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT]

ai_policy:
  allowed: [loan_history_summary]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment,
               display_exact_amount, display_grade]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters: {}
