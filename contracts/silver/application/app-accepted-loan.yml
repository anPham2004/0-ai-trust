kind: DataContract
apiVersion: v3.1.0
id: silver.application.app_accepted_loan
version: 1.0.0
name: app_accepted_loan
status: draft
domain: LENDING
description:
  purpose: |
    Accepted loan records from S3 file source. Historical approved loans with grade and masked amounts.
servers:
- server: silver-delta-lake
  type: databricks
  catalog: 0-ai-trust
  schema: silver
  description: Silver Delta Lake table for app_accepted_loan
  environment: prod
schema:
- name: app_accepted_loan
  logicalType: object
  physicalType: table
  quality:
  - id: LOAN_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: loan_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Customer FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LOAN_STATUS_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: loan_status IS NOT NULL
    severity: error
    dimension: completeness
    description: Loan status required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LOAN_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: loan_id IS NULL OR loan_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: loan_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: global_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  properties:
  - name: global_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: loan_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: loan_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: purpose
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: term
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: counter
  - name: grade
    logicalType: string
    physicalType: STRING
    classification: CONFIDENTIAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: issued_at
    logicalType: date
    physicalType: DATE
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: date
  - name: loan_amount_masked
    logicalType: string
    physicalType: STRING
    classification: RESTRICTED
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: range_bucket
    - property: g3:domainType
      value: amount
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Alert threshold for quarantined row proportion
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: FILE
    ingestion_mechanism: S3_MICROBATCH
    bronze_sink: file_accepted_loans
    source_dataset: accepted_loans
    fields:
    - global_id
    - loanId
    - loanStatus
    - purpose
    - term
    - grade
    - issuedAt
    - loanAmount
- property: g3:freshnessSla
  value: 24 hours
- property: g3:lineage
  value:
    l1: |
      lending-history files -> S3 bronze/landing/file/ -> Auto Loader -> bronze.file_arrivals -> Silver
    l2_required: true
- property: g3:knownSourceLimitations
  value:
  - FILE source with 152 columns; only 8 modelled — remaining columns excluded from Silver
- property: g3:lifecycle
  value:
    owner: lending-domain
    producer: loan-origination-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: loan_id
    customer_key: global_id
    critical_data_elements:
    - loan_id
    - global_id
    - loan_status
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - LOAN_ID_NULL
    - GLOBAL_ID_NULL
    - LOAN_STATUS_NULL
    validity:
    - LOAN_ID_UUID_FORMAT
    - GLOBAL_ID_UUID_FORMAT
- property: g3:aiPolicy
  value:
    allowed:
    - loan_history_summary
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
    - display_exact_amount
    - display_grade
- property: g3:zeroTrust
  value:
    quality_evidence_location: pipeline_event_log_and_quarantine
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
