product: app_stage_history
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: lending-domain
producer: loan-origination-platform
consumers: [banker-assist, lending-operations]
description: >
  Application stage transition history from Kafka events. Tracks each stage
  an application passes through with SLA tracking and team assignment.

canonical_key: history_id
customer_key: global_id
keys:
  primary_key: [history_id]
  alternate_keys: []
critical_data_elements: [history_id, application_id, global_id, stage, entered_at]
lifecycle_stage: Monitor

sources:
  - type: EVENT
    ingestion_mechanism: APACHE_KAFKA
    bronze_sink: kafka_events
    source_dataset: application_stage_history
    fields: [historyId, applicationId, global_id, stage, enteredAt, exitedAt,
             assignedTeam, slaDeadline, pendingActionParty]

freshness_sla: 24 hours
lineage_l1: >
  loan-origination events -> Kafka -> landing-exporter
  -> S3 bronze/landing/event/ -> Auto Loader -> bronze.kafka_events -> Silver
lineage_l2_required: true
known_source_limitations: []

output_schema:
  - name: history_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: application_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to app_application"
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: stage
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: entered_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: exited_at
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: duration_days
    type: INT
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: counter
    description: "Derived: exited_at - entered_at"
  - name: is_current_stage
    type: BOOLEAN
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Derived: exitedAt IS NULL"
  - name: assigned_team
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: sla_deadline
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: is_sla_breached
    type: BOOLEAN
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Derived: now() > slaDeadline"
  - name: pending_action_party
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [CUSTOMER, ORGANISATION, AUTHORISED_REPRESENTATIVE, DIRECTOR,
                     GUARANTOR, THIRD_PARTY, INTERNAL_TEAM]
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: HISTORY_ID_NULL
      expression: "history_id IS NOT NULL"
      description: "Primary key must exist"
    - id: APPLICATION_ID_NULL
      expression: "application_id IS NOT NULL"
      description: "Application FK must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: STAGE_NULL
      expression: "stage IS NOT NULL"
      description: "Stage name required"
    - id: ENTERED_AT_NULL
      expression: "entered_at IS NOT NULL"
      description: "Entry timestamp required"
    - id: STAGE_DATE_ORDER
      expression: "exited_at IS NULL OR exited_at >= entered_at"
      description: "Exit must follow entry"
    - id: HISTORY_ID_UUID_FORMAT
      expression: "history_id IS NULL OR history_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "history_id must be valid UUID format when present"
    - id: APPLICATION_ID_UUID_FORMAT
      expression: "application_id IS NULL OR application_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "application_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: STAGE_NOT_BLANK
      expression: "stage IS NULL OR length(trim(stage)) > 0"
      description: "stage must not be empty or whitespace-only when present"
  warn:
    - id: SLA_OVERDUE
      expression: "sla_deadline IS NULL OR is_sla_breached = false"
      description: "Flag SLA breaches"
    - id: PENDING_ACTION_PARTY_INVALID
      expression: "pending_action_party IS NULL OR pending_action_party IN ('CUSTOMER','ORGANISATION','AUTHORISED_REPRESENTATIVE','DIRECTOR','GUARANTOR','THIRD_PARTY','INTERNAL_TEAM')"
      description: "Must be a known action party"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [HISTORY_ID_NULL, APPLICATION_ID_NULL, GLOBAL_ID_NULL, STAGE_NULL,
                 ENTERED_AT_NULL, STAGE_NOT_BLANK]
  validity: [STAGE_DATE_ORDER, HISTORY_ID_UUID_FORMAT, APPLICATION_ID_UUID_FORMAT,
             GLOBAL_ID_UUID_FORMAT]
  timeliness: [SLA_OVERDUE]

ai_policy:
  allowed: [stage_summary, sla_status_check, next_step_guidance]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  allowed_pending_action_parties: [CUSTOMER, ORGANISATION, AUTHORISED_REPRESENTATIVE,
                                   DIRECTOR, GUARANTOR, THIRD_PARTY, INTERNAL_TEAM]
