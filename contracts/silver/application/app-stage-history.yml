kind: DataContract
apiVersion: v3.1.0
id: silver.application.app_stage_history
version: 1.0.0
name: app_stage_history
status: draft
domain: LENDING
description:
  purpose: |
    Application stage transition history from Kafka events. Tracks each stage an application passes through with SLA tracking and team assignment.
servers:
- server: silver-delta-lake
  type: databricks
  description: Silver Delta Lake table for app_stage_history
  environment: prod
schema:
- name: app_stage_history
  logicalType: object
  physicalType: table
  quality:
  - id: HISTORY_ID_NULL
    type: sql
    query: history_id IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: APPLICATION_ID_NULL
    type: sql
    query: application_id IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Application FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_NULL
    type: sql
    query: global_id IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Customer FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: STAGE_NULL
    type: sql
    query: stage IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Stage name required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ENTERED_AT_NULL
    type: sql
    query: entered_at IS NOT NULL
    mustBe: 0
    severity: error
    dimension: completeness
    description: Entry timestamp required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: STAGE_DATE_ORDER
    type: sql
    query: exited_at IS NULL OR exited_at >= entered_at
    mustBe: 0
    severity: error
    dimension: conformity
    description: Exit must follow entry
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: HISTORY_ID_UUID_FORMAT
    type: sql
    query: history_id IS NULL OR history_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    mustBe: 0
    severity: error
    dimension: conformity
    description: history_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: APPLICATION_ID_UUID_FORMAT
    type: sql
    query: application_id IS NULL OR application_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    mustBe: 0
    severity: error
    dimension: conformity
    description: application_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_UUID_FORMAT
    type: sql
    query: global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    mustBe: 0
    severity: error
    dimension: conformity
    description: global_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: STAGE_NOT_BLANK
    type: sql
    query: stage IS NULL OR length(trim(stage)) > 0
    mustBe: 0
    severity: error
    dimension: conformity
    description: stage must not be empty or whitespace-only when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SLA_OVERDUE
    type: sql
    query: sla_deadline IS NULL OR is_sla_breached = false
    mustBe: 0
    severity: warning
    dimension: conformity
    description: Flag SLA breaches
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: PENDING_ACTION_PARTY_INVALID
    type: sql
    query: pending_action_party IS NULL OR pending_action_party IN ('CUSTOMER','ORGANISATION','AUTHORISED_REPRESENTATIVE','DIRECTOR','GUARANTOR','THIRD_PARTY','INTERNAL_TEAM')
    mustBe: 0
    severity: warning
    dimension: conformity
    description: Must be a known action party
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: history_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: application_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: global_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: stage
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: entered_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: exited_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: duration_days
    logicalType: integer
    physicalType: INT
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: counter
  - name: is_current_stage
    logicalType: boolean
    physicalType: BOOLEAN
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: assigned_team
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: sla_deadline
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: is_sla_breached
    logicalType: boolean
    physicalType: BOOLEAN
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: pending_action_party
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - CUSTOMER
        - ORGANISATION
        - AUTHORISED_REPRESENTATIVE
        - DIRECTOR
        - GUARANTOR
        - THIRD_PARTY
        - INTERNAL_TEAM
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: dq_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - PASSED
        - FAILED
        - WARNING
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Max proportion of hard-rule failures before pipeline halts
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: EVENT
    ingestion_mechanism: APACHE_KAFKA
    bronze_sink: kafka_events
    source_dataset: application_stage_history
    fields:
    - historyId
    - applicationId
    - global_id
    - stage
    - enteredAt
    - exitedAt
    - assignedTeam
    - slaDeadline
    - pendingActionParty
- property: g3:freshnessSla
  value: 24 hours
- property: g3:lineage
  value:
    l1: |
      loan-origination events -> Kafka -> landing-exporter -> S3 bronze/landing/event/ -> Auto Loader -> bronze.kafka_events -> Silver
    l2_required: true
- property: g3:lifecycle
  value:
    owner: lending-domain
    producer: loan-origination-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: history_id
    customer_key: global_id
    critical_data_elements:
    - history_id
    - application_id
    - global_id
    - stage
    - entered_at
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - HISTORY_ID_NULL
    - APPLICATION_ID_NULL
    - GLOBAL_ID_NULL
    - STAGE_NULL
    - ENTERED_AT_NULL
    - STAGE_NOT_BLANK
    validity:
    - STAGE_DATE_ORDER
    - HISTORY_ID_UUID_FORMAT
    - APPLICATION_ID_UUID_FORMAT
    - GLOBAL_ID_UUID_FORMAT
    - PENDING_ACTION_PARTY_INVALID
    timeliness:
    - SLA_OVERDUE
- property: g3:aiPolicy
  value:
    allowed:
    - stage_summary
    - sla_status_check
    - next_step_guidance
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
- property: g3:zeroTrust
  value:
    quality_status_required: true
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:parameters
  value:
    allowed_pending_action_parties:
    - CUSTOMER
    - ORGANISATION
    - AUTHORISED_REPRESENTATIVE
    - DIRECTOR
    - GUARANTOR
    - THIRD_PARTY
    - INTERNAL_TEAM
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
