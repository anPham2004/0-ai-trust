product: app_lifecycle_event
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: lending-domain
producer: loan-origination-platform
consumers: [banker-assist, lending-operations]
description: >
  Loan application lifecycle events from Kafka. Records process events
  such as submissions, approvals, and system transitions.

canonical_key: event_id
customer_key: global_id
keys:
  primary_key: [event_id]
  alternate_keys: []
critical_data_elements: [event_id, application_id, lifecycle_transition, event_timestamp]
lifecycle_stage: Monitor

sources:
  - type: EVENT
    ingestion_mechanism: APACHE_KAFKA
    bronze_sink: kafka_events
    source_dataset: loan_application_events
    fields: [eventId, applicationId, global_id, conceptName,
             lifecycleTransition, timestamp, eventOrigin, action]

freshness_sla: 24 hours
lineage_l1: >
  loan-origination events -> Kafka -> landing-exporter
  -> S3 bronze/landing/event/ -> Auto Loader -> bronze.kafka_events -> Silver
lineage_l2_required: true
known_source_limitations: []

output_schema:
  - name: event_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: application_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to app_application"
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: concept_name
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: description
  - name: lifecycle_transition
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: event_timestamp
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: event_origin
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [SYSTEM, CUSTOMER, BANKER]
  - name: action
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: description
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: EVENT_ID_NULL
      expression: "event_id IS NOT NULL"
      description: "Primary key must exist"
    - id: APPLICATION_ID_NULL
      expression: "application_id IS NOT NULL"
      description: "Application FK must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: LIFECYCLE_TRANSITION_NULL
      expression: "lifecycle_transition IS NOT NULL"
      description: "Transition type required"
    - id: EVENT_TIMESTAMP_NULL
      expression: "event_timestamp IS NOT NULL"
      description: "Event timestamp required"
    - id: EVENT_ID_UUID_FORMAT
      expression: "event_id IS NULL OR event_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "event_id must be valid UUID format when present"
    - id: APPLICATION_ID_UUID_FORMAT
      expression: "application_id IS NULL OR application_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "application_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
  warn:
    - id: EVENT_ORIGIN_INVALID
      expression: "event_origin IS NULL OR event_origin IN ('SYSTEM','CUSTOMER','BANKER')"
      description: "Must be a known event origin"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [EVENT_ID_NULL, APPLICATION_ID_NULL, GLOBAL_ID_NULL,
                 LIFECYCLE_TRANSITION_NULL, EVENT_TIMESTAMP_NULL]
  validity: [EVENT_ID_UUID_FORMAT, APPLICATION_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT]

ai_policy:
  allowed: [lifecycle_summary, event_timeline]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  allowed_event_origins: [SYSTEM, CUSTOMER, BANKER]
