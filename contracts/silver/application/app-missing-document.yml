kind: DataContract
apiVersion: v3.1.0
id: silver.application.app_missing_document
version: 1.0.0
name: app_missing_document
status: draft
domain: LENDING
description:
  purpose: |
    Missing document tracking for loan applications from CDC. Tracks document requests, reminders, and resolution status.
servers:
- server: silver-delta-lake
  type: databricks
  catalog: 0-ai-trust
  schema: silver
  description: Silver Delta Lake table for app_missing_document
  environment: prod
schema:
- name: app_missing_document
  logicalType: object
  physicalType: table
  quality:
  - id: DOCUMENT_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: document_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: APPLICATION_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: application_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Application FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Customer FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: DOCUMENT_TYPE_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: document_type IS NOT NULL
    severity: error
    dimension: completeness
    description: Document type required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: DOCUMENT_STATUS_INVALID
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: status IN ('PENDING','RECEIVED','REJECTED')
    severity: error
    dimension: conformity
    description: Must be a known document status
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: DOCUMENT_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: document_id IS NULL OR document_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: document_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: APPLICATION_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: application_id IS NULL OR application_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: application_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: global_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: RECEIVED_DATE_ORDER
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: received_at IS NULL OR requested_at IS NULL OR received_at >= requested_at
    severity: warning
    dimension: conformity
    description: Received date must follow request date
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: DOCUMENT_EXPIRED
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: expiry_date IS NULL OR expiry_date >= current_date()
    severity: warning
    dimension: timeliness
    description: Flag expired documents
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: document_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: application_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: global_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: document_type
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - PENDING
        - RECEIVED
        - REJECTED
  - name: is_invalid_or_expired
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: requested_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: received_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: expiry_date
    logicalType: date
    physicalType: DATE
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: date
  - name: reminders_sent
    logicalType: integer
    physicalType: INT
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: counter
  - name: last_reminder_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: rejection_reason
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: description
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Alert threshold for quarantined row proportion
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_missing_documents
    source_dataset: public.missing_documents
    fields:
    - documentId
    - applicationId
    - global_id
    - documentType
    - status
    - requestedAt
    - receivedAt
    - expiryDate
    - remindersSent
    - lastReminderAt
    - rejectionReason
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:freshnessSla
  value: 24 hours
- property: g3:dependencies
  value:
    grace_period: 24 hours
    foreign_keys:
    - id: DOCUMENT_APPLICATION_EXISTS
      columns: [application_id]
      parent_contract: app_application
      parent_columns: [application_id]
- property: g3:lineage
  value:
    l1: |
      loan-origination DB -> Debezium -> Kafka CDC topics -> landing-exporter -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
    l2_required: true
- property: g3:knownSourceLimitations
  value:
  - CDC eventual consistency — records may arrive out of order within partition
- property: g3:lifecycle
  value:
    owner: lending-domain
    producer: loan-origination-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: document_id
    customer_key: global_id
    critical_data_elements:
    - document_id
    - application_id
    - document_type
    - status
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - DOCUMENT_ID_NULL
    - APPLICATION_ID_NULL
    - GLOBAL_ID_NULL
    - DOCUMENT_TYPE_NULL
    validity:
    - DOCUMENT_STATUS_INVALID
    - DOCUMENT_ID_UUID_FORMAT
    - APPLICATION_ID_UUID_FORMAT
    - GLOBAL_ID_UUID_FORMAT
    - RECEIVED_DATE_ORDER
    timeliness:
    - DOCUMENT_EXPIRED
- property: g3:aiPolicy
  value:
    allowed:
    - missing_document_summary
    - document_status_check
    - reminder_guidance
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
- property: g3:zeroTrust
  value:
    quality_evidence_location: pipeline_event_log_and_quarantine
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:parameters
  value:
    allowed_document_statuses:
    - PENDING
    - RECEIVED
    - REJECTED
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
