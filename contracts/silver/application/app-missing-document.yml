product: app_missing_document
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: lending-domain
producer: loan-origination-platform
consumers: [banker-assist, lending-operations]
description: >
  Missing document tracking for loan applications from CDC. Tracks document
  requests, reminders, and resolution status.

canonical_key: document_id
customer_key: global_id
keys:
  primary_key: [document_id]
  alternate_keys: []
critical_data_elements: [document_id, application_id, document_type, status]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.missing_documents
    fields: [documentId, applicationId, global_id, documentType, status,
             requestedAt, receivedAt, expiryDate, remindersSent,
             lastReminderAt, rejectionReason]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  loan-origination DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: document_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: application_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to app_application"
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: document_type
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PENDING, RECEIVED, REJECTED]
  - name: is_invalid_or_expired
    type: BOOLEAN
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Derived: status = REJECTED OR expiryDate < now()"
  - name: requested_at
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: received_at
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: expiry_date
    type: DATE
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: date
  - name: reminders_sent
    type: INT
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: counter
  - name: last_reminder_at
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: rejection_reason
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: description
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: DOCUMENT_ID_NULL
      expression: "document_id IS NOT NULL"
      description: "Primary key must exist"
    - id: APPLICATION_ID_NULL
      expression: "application_id IS NOT NULL"
      description: "Application FK must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: DOCUMENT_TYPE_NULL
      expression: "document_type IS NOT NULL"
      description: "Document type required"
    - id: DOCUMENT_STATUS_INVALID
      expression: "status IN ('PENDING','RECEIVED','REJECTED')"
      description: "Must be a known document status"
    - id: DOCUMENT_ID_UUID_FORMAT
      expression: "document_id IS NULL OR document_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "document_id must be valid UUID format when present"
    - id: APPLICATION_ID_UUID_FORMAT
      expression: "application_id IS NULL OR application_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "application_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
  warn:
    - id: RECEIVED_DATE_ORDER
      expression: "received_at IS NULL OR requested_at IS NULL OR received_at >= requested_at"
      description: "Received date must follow request date"
    - id: DOCUMENT_EXPIRED
      expression: "expiry_date IS NULL OR expiry_date >= current_date()"
      description: "Flag expired documents"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [DOCUMENT_ID_NULL, APPLICATION_ID_NULL, GLOBAL_ID_NULL,
                 DOCUMENT_TYPE_NULL]
  validity: [DOCUMENT_STATUS_INVALID, DOCUMENT_ID_UUID_FORMAT, APPLICATION_ID_UUID_FORMAT,
             GLOBAL_ID_UUID_FORMAT]

ai_policy:
  allowed: [missing_document_summary, document_status_check, reminder_guidance]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  allowed_document_statuses: [PENDING, RECEIVED, REJECTED]
