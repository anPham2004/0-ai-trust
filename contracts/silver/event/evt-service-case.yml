product: evt_service_case
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: service-domain
producer: customer-service-platform
consumers: [banker-assist, lending-operations]
description: >
  Service case records from CDC. Covers customer and business support cases
  with SLA tracking, priority, and resolution.

canonical_key: case_id
customer_key: global_id
keys:
  primary_key: [case_id]
  alternate_keys: []
critical_data_elements: [case_id, global_id, case_type, status, created_at]
lifecycle_stage: Monitor

sources:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_changes
    source_dataset: public.service_cases
    fields: [caseId, global_id, organisationId, applicationId, slaDeadline,
             caseType, subject, status, priority, assignedTeam, createdAt,
             resolvedAt, resolutionSummary]
    cdc:
      supported_operations: [SNAPSHOT, INSERT, UPDATE, DELETE]
      ordering_metadata: [source_lsn, kafka_partition, kafka_offset]

freshness_sla: 24 hours
lineage_l1: >
  customer-service DB -> Debezium -> Kafka CDC topics -> landing-exporter
  -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
lineage_l2_required: true
known_source_limitations:
  - "CDC eventual consistency — records may arrive out of order within partition"

output_schema:
  - name: case_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: organisation_id
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: application_id
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "Link case to application"
  - name: sla_deadline
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: is_sla_breached
    type: BOOLEAN
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Derived: now() > slaDeadline AND status IN ('open','in_progress')"
  - name: is_business_case
    type: BOOLEAN
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: boolean_flag
    description: "Derived: organisationId IS NOT NULL"
  - name: case_type
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: subject
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: priority
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: assigned_team
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: category
  - name: created_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: resolved_at
    type: TIMESTAMP
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: resolution_summary
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: description
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: CASE_ID_NULL
      expression: "case_id IS NOT NULL"
      description: "Primary key must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: CASE_TYPE_NULL
      expression: "case_type IS NOT NULL"
      description: "Case type required"
    - id: STATUS_NULL
      expression: "status IS NOT NULL"
      description: "Case status required"
    - id: CREATED_AT_NULL
      expression: "created_at IS NOT NULL"
      description: "Creation timestamp required"
    - id: RESOLVED_DATE_ORDER
      expression: "resolved_at IS NULL OR resolved_at >= created_at"
      description: "Resolution must follow creation"
    - id: CASE_ID_UUID_FORMAT
      expression: "case_id IS NULL OR case_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "case_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
    - id: ORGANISATION_ID_UUID_FORMAT
      expression: "organisation_id IS NULL OR organisation_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "organisation_id must be valid UUID format when present"
    - id: SUBJECT_NOT_BLANK
      expression: "subject IS NULL OR length(trim(subject)) > 0"
      description: "subject must not be empty or whitespace-only when present"
  warn:
    - id: SLA_BREACHED
      expression: "is_sla_breached IS NULL OR is_sla_breached = false"
      description: "Flag SLA breaches"
    - id: CASE_STALE
      expression: "created_at >= date_sub(current_date(), 90)"
      description: "Case created within 90 days"

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [CASE_ID_NULL, GLOBAL_ID_NULL, CASE_TYPE_NULL, STATUS_NULL,
                 CREATED_AT_NULL, SUBJECT_NOT_BLANK]
  validity: [RESOLVED_DATE_ORDER, CASE_ID_UUID_FORMAT, GLOBAL_ID_UUID_FORMAT,
             ORGANISATION_ID_UUID_FORMAT]
  timeliness: [SLA_BREACHED, CASE_STALE]

ai_policy:
  allowed: [case_summary, status_check, resolution_summary]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  freshness_days: 90
