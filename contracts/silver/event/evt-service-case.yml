kind: DataContract
apiVersion: v3.1.0
id: silver.event.evt_service_case
version: 1.0.0
name: evt_service_case
status: draft
domain: SERVICE
description:
  purpose: |
    Service case records from CDC. Covers customer and business support cases with SLA tracking, priority, and resolution.
servers:
- server: silver-delta-lake
  type: databricks
  catalog: 0-ai-trust
  schema: silver
  description: Silver Delta Lake table for evt_service_case
  environment: prod
schema:
- name: evt_service_case
  logicalType: object
  physicalType: table
  quality:
  - id: CASE_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: case_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Primary key must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NOT NULL
    severity: error
    dimension: completeness
    description: Customer FK must exist
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: CASE_TYPE_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: case_type IS NOT NULL
    severity: error
    dimension: completeness
    description: Case type required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: STATUS_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: status IS NOT NULL
    severity: error
    dimension: completeness
    description: Case status required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: CREATED_AT_NULL
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: created_at IS NOT NULL
    severity: error
    dimension: completeness
    description: Creation timestamp required
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: RESOLVED_DATE_ORDER
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: resolved_at IS NULL OR resolved_at >= created_at
    severity: error
    dimension: conformity
    description: Resolution must follow creation
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: CASE_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: case_id IS NULL OR case_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: case_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: GLOBAL_ID_UUID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    severity: error
    dimension: conformity
    description: global_id must be valid UUID format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ORGANISATION_ID_FORMAT
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: organisation_id IS NULL OR organisation_id RLIKE '^ORG-[0-9]{5}$'
    severity: error
    dimension: conformity
    description: organisation_id must match the organisation business-key format when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SUBJECT_NOT_BLANK
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: subject IS NULL OR length(trim(subject)) > 0
    severity: error
    dimension: completeness
    description: subject must not be empty or whitespace-only when present
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SLA_BREACHED
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: is_sla_breached IS NULL OR is_sla_breached = false
    severity: warning
    dimension: timeliness
    description: Flag SLA breaches
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: CASE_STALE
    type: custom
    engine: databricks-lakeflow
    implementation:
      expression: created_at >= date_sub(current_date(), 90)
    severity: warning
    dimension: timeliness
    description: Case created within 90 days
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: case_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: global_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: organisation_id
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: application_id
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: sla_deadline
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: is_sla_breached
    logicalType: boolean
    physicalType: BOOLEAN
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: is_business_case
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: boolean_flag
  - name: case_type
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: subject
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: priority
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: assigned_team
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
  - name: created_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: resolved_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: resolution_summary
    logicalType: string
    physicalType: STRING
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: description
  - name: pipeline_run_id
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: uuid
  - name: source_table
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: identifier
  - name: processed_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: timestamp
  - name: masking_status
    logicalType: string
    physicalType: STRING
    required: true
    classification: INTERNAL
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
    - property: g3:domainType
      value: category
    - property: g3:accepted
      value:
        values:
        - MASKED
        - CLEAN
slaProperties:
- property: hardFailureRate
  value: 0.01
  description: Alert threshold for quarantined row proportion
- property: freshnessBreachRate
  value: 0.05
  description: Max proportion of freshness breaches before alert
customProperties:
- property: g3:sources
  value:
  - type: DATABASE
    ingestion_mechanism: DEBEZIUM_CDC
    bronze_sink: cdc_service_cases
    source_dataset: public.service_cases
    fields:
    - caseId
    - global_id
    - organisationId
    - applicationId
    - slaDeadline
    - caseType
    - subject
    - status
    - priority
    - assignedTeam
    - createdAt
    - resolvedAt
    - resolutionSummary
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:freshnessSla
  value: 24 hours
- property: g3:lineage
  value:
    l1: |
      customer-service DB -> Debezium -> Kafka CDC topics -> landing-exporter -> S3 bronze/landing/cdc/ -> Auto Loader -> bronze.cdc_changes -> Silver
    l2_required: true
- property: g3:knownSourceLimitations
  value:
  - CDC eventual consistency — records may arrive out of order within partition
- property: g3:lifecycle
  value:
    owner: service-domain
    producer: customer-service-platform
    consumers:
    - banker-assist
    - lending-operations
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    canonical_key: case_id
    customer_key: global_id
    critical_data_elements:
    - case_id
    - global_id
    - case_type
    - status
    - created_at
    lifecycle_stage: Monitor
- property: g3:qualityDimensions
  value:
    completeness:
    - CASE_ID_NULL
    - GLOBAL_ID_NULL
    - CASE_TYPE_NULL
    - STATUS_NULL
    - CREATED_AT_NULL
    - SUBJECT_NOT_BLANK
    validity:
    - RESOLVED_DATE_ORDER
    - CASE_ID_UUID_FORMAT
    - GLOBAL_ID_UUID_FORMAT
    - ORGANISATION_ID_FORMAT
    timeliness:
    - SLA_BREACHED
    - CASE_STALE
- property: g3:aiPolicy
  value:
    allowed:
    - case_summary
    - status_check
    - resolution_summary
    prohibited:
    - display_raw_pii
    - credit_decision
    - risk_scoring
    - fraud_assessment
- property: g3:zeroTrust
  value:
    quality_evidence_location: pipeline_event_log_and_quarantine
    source_reference_required: true
    quarantined_excluded: true
    stale_flagged: true
- property: g3:parameters
  value:
    freshness_days: 90
- property: g3:notes
  value:
  - |
    This contract describes the Silver output table. PII is masked, hashed, or redacted before landing in Silver. Quality rules are executable Spark SQL expressions that can be compiled via F.expr().
