product: evt_case_event
version: 1.1.0
contract_status: DRAFT
approver: TBD
effective_from: null
owner: service-domain
producer: customer-service-platform
consumers: [banker-assist, lending-operations]
description: >
  Service case lifecycle events from Kafka. Records case activities
  such as notes, status changes, escalations, and document attachments.

canonical_key: event_id
customer_key: global_id
keys:
  primary_key: [event_id]
  alternate_keys: []
critical_data_elements: [event_id, case_id, event_type, event_timestamp]
lifecycle_stage: Monitor

sources:
  - type: EVENT
    ingestion_mechanism: APACHE_KAFKA
    bronze_sink: kafka_events
    source_dataset: service_case_events
    fields: [eventId, caseId, global_id, eventType, eventTimestamp,
             description]

freshness_sla: 24 hours
lineage_l1: >
  customer-service events -> Kafka -> landing-exporter
  -> S3 bronze/landing/event/ -> Auto Loader -> bronze.kafka_events -> Silver
lineage_l2_required: true
known_source_limitations: []

output_schema:
  - name: event_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "PK"
  - name: case_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to evt_service_case"
  - name: global_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
    description: "FK to ip_individual"
  - name: event_type
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [NOTE_ADDED, STATUS_CHANGED, ASSIGNED, ESCALATED,
                     DOCUMENT_ATTACHED, CUSTOMER_CONTACTED]
  - name: event_timestamp
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: description
    type: STRING
    required: false
    nullable: true
    classification: INTERNAL
    is_pii: false
    logical_type: description
  - name: pipeline_run_id
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: uuid
  - name: source_table
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: identifier
  - name: processed_at
    type: TIMESTAMP
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: timestamp
  - name: dq_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [PASSED, FAILED, WARNING]
  - name: masking_status
    type: STRING
    required: true
    nullable: false
    classification: INTERNAL
    is_pii: false
    logical_type: category
    allowed_values: [MASKED, CLEAN]

rules:
  hard:
    - id: EVENT_ID_NULL
      expression: "event_id IS NOT NULL"
      description: "Primary key must exist"
    - id: CASE_ID_NULL
      expression: "case_id IS NOT NULL"
      description: "Case FK must exist"
    - id: GLOBAL_ID_NULL
      expression: "global_id IS NOT NULL"
      description: "Customer FK must exist"
    - id: EVENT_TYPE_INVALID
      expression: "event_type IN ('NOTE_ADDED','STATUS_CHANGED','ASSIGNED','ESCALATED','DOCUMENT_ATTACHED','CUSTOMER_CONTACTED')"
      description: "Must be a known event type"
    - id: EVENT_TIMESTAMP_NULL
      expression: "event_timestamp IS NOT NULL"
      description: "Event timestamp required"
    - id: EVENT_ID_UUID_FORMAT
      expression: "event_id IS NULL OR event_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "event_id must be valid UUID format when present"
    - id: CASE_ID_UUID_FORMAT
      expression: "case_id IS NULL OR case_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "case_id must be valid UUID format when present"
    - id: GLOBAL_ID_UUID_FORMAT
      expression: "global_id IS NULL OR global_id RLIKE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
      description: "global_id must be valid UUID format when present"
  warn: []

tolerances:
  hard_failure_rate: 0.01
  freshness_breach_rate: 0.05

quality_dimensions:
  completeness: [EVENT_ID_NULL, CASE_ID_NULL, GLOBAL_ID_NULL, EVENT_TIMESTAMP_NULL]
  validity: [EVENT_TYPE_INVALID, EVENT_ID_UUID_FORMAT, CASE_ID_UUID_FORMAT,
             GLOBAL_ID_UUID_FORMAT]

ai_policy:
  allowed: [case_event_timeline, activity_summary]
  prohibited: [display_raw_pii, credit_decision, risk_scoring, fraud_assessment]

zero_trust:
  quality_status_required: true
  source_reference_required: true
  quarantined_excluded: true
  stale_flagged: true

parameters:
  allowed_event_types: [NOTE_ADDED, STATUS_CHANGED, ASSIGNED, ESCALATED,
                        DOCUMENT_ATTACHED, CUSTOMER_CONTACTED]
