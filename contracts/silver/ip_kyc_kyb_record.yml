product: ip_kyc_kyb_record
version: 1.0.0
contract_status: ACTIVE
owner: involved-party-domain
producer: customer-master-platform
canonical_key: kyc_id
history_mode: SCD_TYPE_2
critical_data_elements: [kyc_id, global_id, record_type, verification_status]
lineage_l1: cdc_kyc_records -> silver.ip_kyc_kyb_record
schema: {global_id: STRING, kyc_id: STRING, organisation_id: STRING, record_type: STRING, verification_status: STRING, verification_date: DATE, verification_method: STRING, risk_rating: STRING, pep_status: BOOLEAN, sanctions_check: STRING, last_review_date: DATE, next_review_date: DATE, document_types: STRING, abn_verified: BOOLEAN, asic_check_status: STRING, beneficial_ownership_verified: BOOLEAN}
rules:
  hard:
    - {id: kyc_key_required, expression: "kyc_id IS NOT NULL AND global_id IS NOT NULL"}
    - {id: kyc_record_type_valid, expression: "record_type IN ('KYC', 'KYB')"}
    - {id: kyc_status_valid, expression: "verification_status IN ('VERIFIED', 'PENDING', 'FAILED', 'EXPIRED')"}
  warn:
    - {id: kyc_review_dates_valid, expression: "next_review_date IS NULL OR last_review_date IS NULL OR next_review_date >= last_review_date"}
tolerances: {hard_failure_rate: 0.0, warning_failure_rate: 0.05}
quality_dimensions: {completeness: [kyc_key_required], validity: [kyc_record_type_valid, kyc_status_valid], consistency: [kyc_review_dates_valid], timeliness: []}
