product: ai_ready_context
version: 2.0.0
owner: banker-assist-domain
producer: gold-context-workstream
contract_status: ACTIVE
physical_layer:
  type: LAKEFLOW_MATERIALIZED_VIEWS
  storage: UNITY_CATALOG_MANAGED_S3
  refresh_mode: CONTINUOUS_PIPELINE_MICROBATCH
  refresh_target: 15 minutes
outputs:
  dimensions:
    - dim_customer
    - dim_organisation
    - dim_date
    - dim_stage_action_policy
  service:
    - fact_service_activity
    - fact_service_case_current
  arrangement:
    - fact_arrangement_current
  party_and_verification:
    - bridge_organisation_party_role
    - bridge_organisation_relationship
    - bridge_application_party_authority
    - fact_verification_current
  application:
    - fact_application_current
    - fact_application_document
    - fact_application_timeline_event
  ai_ready_context:
    - fact_subject_context_snapshot
zero_trust:
  prohibited_raw_fields:
    - email
    - phone_number
    - tfn
    - card_number
    - raw_payload
  restricted_fields:
    - risk_rating
    - pep_status
    - sanctions_check
  required_context_fields:
    - dq_status
    - masking_status
    - warning_codes
known_limitations:
  - Application authority is derived from organisation-level roles and is not an application-specific mandate.
  - Mortgage activity and maturity are inferred because the source has no explicit lifecycle status.
  - Organisation communication preferences are unavailable in the supplied source data.
  - Approved stage-action wording has not been supplied; the policy dimension returns POLICY_NOT_CONFIGURED without invented instructions.
  - Metric Views and user-specific entitlements are publication concerns and are not physical Gold pipeline datasets.
