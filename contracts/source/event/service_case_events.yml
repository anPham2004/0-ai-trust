kind: DataContract
apiVersion: v3.1.0
id: source.event.service_case_events
version: 1.0.0
name: service_case_events
status: draft
domain: CUSTOMER_SERVICE
description:
  purpose: |
    Append-only activity events for customer service cases. Each record captures an event type, business timestamp, performing agent, and source-generated description for one customer service case.
servers:
- server: source-kafka
  type: kafka
  description: Kafka event stream for service_case_events
  environment: prod
schema:
- name: service_case_events
  logicalType: object
  physicalType: table
  physicalName: service_case_events
  relationships:
  - type: foreignKey
    from:
    - service_case_events.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - service_case_events.caseId
    to:
    - service_cases.caseId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: SCE_EVENT_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: |
      eventId must uniquely identify a business event. Repeated eventId values are treated as transport duplicates rather than new case activities.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - eventId
  - id: SCE_CASE_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A case event should identify its service case. The physical schema currently permits caseId to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - caseId
  - id: SCE_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A case event should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: SCE_CASE_CUSTOMER_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: service_cases
        source_columns:
        - caseId
        - global_id
        reference_columns:
        - caseId
        - global_id
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      caseId and global_id must refer to the same service case record.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCE_CORE_EVENT_FIELDS_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - eventTimestamp
      - performedBy
    severity: warning
    dimension: completeness
    description: |
      A usable service-case event should contain its business timestamp and performing agent. The physical schema currently permits null values.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCE_EVENT_NOT_BEFORE_CASE_CREATION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_TIMESTAMP_COMPARISON
      parameters:
        reference_dataset: service_cases
        source_key:
          caseId: caseId
        source_timestamp_column: eventTimestamp
        operator: GREATER_THAN_OR_EQUAL
        reference_timestamp_column: createdAt
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      eventTimestamp cannot be earlier than the parent case's createdAt timestamp.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCE_CHRONOLOGICAL_ORDER_PER_CASE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: MONOTONIC_EVENT_TIME_PER_GROUP
      parameters:
        group_columns:
        - caseId
        timestamp_column: eventTimestamp
        tiebreaker_columns:
        - eventId
        allow_equal_timestamps: true
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: warning
    dimension: timeliness
    description: |
      Events for the same case should be chronologically orderable by business timestamp and eventId.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCE_MAX_ONE_IDENTICAL_EVENT_AT_TIME
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: UNIQUE_WITHIN_GROUP
      parameters:
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
      columns:
      - caseId
      - eventType
      - eventTimestamp
      - performedBy
      - description
    severity: warning
    dimension: consistency
    description: |
      Identical case activities at the same timestamp may indicate duplicate event production even when eventId values differ.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCE_EVENT_TYPE_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CATEGORICAL_DISTRIBUTION_TOLERANCE
      parameters:
        column: eventType
        expected_ratios:
          NOTE_ADDED: 0.3
          STATUS_CHANGED: 0.25
          ASSIGNED: 0.15
          ESCALATED: 0.1
          DOCUMENT_ATTACHED: 0.1
          CUSTOMER_CONTACTED: 0.1
        absolute_tolerance: 0.1
        comparison_scope: COMPLETE_SNAPSHOT
    severity: warning
    dimension: consistency
    description: |
      Event-type proportions should remain reasonably close to the configured mock-data distribution in a complete snapshot.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCE_AGENT_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONCENTRATION_DISTRIBUTION_MONITORING
      parameters:
        column: performedBy
        expected_shape: PARETO
        generator_expression: pow(rand, 2)
        comparison_scope: COMPLETE_SNAPSHOT
        exact_thresholds_status: TBD_FROM_GENERATOR_CONFIG
    severity: warning
    dimension: consistency
    description: |
      The generator intentionally concentrates event volume among top agents. Exact concentration thresholds must be confirmed from generated evidence.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCE_DESCRIPTION_TEMPLATE_MAPPING_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_MAPPING_PENDING
      parameters:
        selector_column: eventType
        target_column: description
        documented_examples:
          NOTE_ADDED: Internal note recorded by agent
          STATUS_CHANGED: Case status updated
        status: TBD_FROM_GENERATOR_CONFIG
    severity: warning
    dimension: consistency
    description: |
      The source states that description is template-based by eventType but does not publish the complete template catalogue. Exact template validation must be copied from the generator rather than inferred.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCE_CASE_STATUS_ALIGNMENT_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CROSS_EVENT_PARENT_STATE_ALIGNMENT
      parameters:
        event_type_column: eventType
        status_event_value: STATUS_CHANGED
        parent_dataset: service_cases
        parent_key: caseId
        parent_status_column: status
        status_payload_fields_present: false
        status: NOT_ENFORCEABLE_FROM_CURRENT_SCHEMA
    severity: warning
    dimension: consistency
    description: |
      STATUS_CHANGED events do not contain oldStatus or newStatus fields, so the event cannot be reconciled to the parent case status from this source schema alone.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: SCE_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCE_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: eventId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - afc901a8-95d9-43ef-af49-7910cf5e7da5
    quality:
    - id: SCE_EVENT_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: eventId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCE_EVENT_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: eventId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: service_case_event_identifier
  - name: caseId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - aa1718d4-623d-4da0-a3d9-b1f2df832cd8
    quality:
    - id: SCE_CASE_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: caseId must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCE_CASE_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: service_cases
          reference_column: caseId
      severity: error
      dimension: consistency
      description: |
        caseId must exist in service_cases.caseId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: service_case_identifier
  - name: eventType
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - STATUS_CHANGED
    quality:
    - id: SCE_EVENT_TYPE_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: eventType must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCE_EVENT_TYPE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - NOTE_ADDED
        - STATUS_CHANGED
        - ASSIGNED
        - ESCALATED
        - DOCUMENT_ATTACHED
        - CUSTOMER_CONTACTED
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        eventType must be one of the six documented service case activities.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: service_case_event_type
    - property: g3:accepted
      value:
        values:
        - NOTE_ADDED
        - STATUS_CHANGED
        - ASSIGNED
        - ESCALATED
        - DOCUMENT_ATTACHED
        - CUSTOMER_CONTACTED
  - name: eventTimestamp
    logicalType: timestamp
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-05-13T11:20:00Z'
    quality:
    - id: SCE_EVENT_TIMESTAMP_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        eventTimestamp must be parseable as a timestamp when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_SERVICE_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: timestamp
  - name: performedBy
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^AGENT-\d{4}$
    examples:
    - AGENT-0017
    quality:
    - id: SCE_PERFORMED_BY_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^AGENT-\d{4}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        performedBy must follow the AGENT-0000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCE_PERFORMED_BY_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: REGEX_NUMERIC_COMPONENT_RANGE_IF_PRESENT
        parameters:
          regex: ^AGENT-(\d{4})$
          capture_group: 1
          min: 0
          max: 49
      severity: error
      dimension: conformity
      description: |
        performedBy must identify a documented source agent from AGENT-0000 through AGENT-0049.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: EMPLOYEE_IDENTIFIER
        handling: REDACT_FROM_CUSTOMER_AI
    - property: g3:domainType
      value: internal_service_agent_identifier
    - property: g3:accepted
      value:
        numeric_suffix_min: 0
        numeric_suffix_max: 49
  - name: description
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
    examples:
    - Case status updated
    quality:
    - id: SCE_DESCRIPTION_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: description must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCE_DESCRIPTION_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK
      severity: error
      dimension: conformity
      description: description must not be empty or whitespace-only.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_SERVICE_FREE_TEXT
        handling: REDACT_OR_BANKER_ONLY
    - property: g3:domainType
      value: service_case_event_description
    - property: g3:accepted
      value:
        template_catalogue_status: TBD_FROM_GENERATOR_CONFIG
        documented_examples:
        - Internal note recorded by agent
        - Case status updated
customProperties:
- property: g3:source
  value:
    category: EVENT
    system_type: BUSINESS_EVENT_STREAM
    authoritative: true
    event_name: service_case_events
    topic_name: TBD
    append_only: true
- property: g3:ingestion
  value:
    mechanism: KAFKA_EVENT
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/event/service_case_events/
      immutable: true
    bronze_target: bronze.kafka_events
    deduplicated_bronze_target: bronze.kafka_events_deduplicated
    event_envelope:
      retained_metadata:
      - topic
      - key
      - partition
      - offset
      - timestamp
      - event_type
      - raw_payload
    append_only_policy:
      allowed_operations:
      - APPEND
      prohibited_operations:
      - UPDATE_EXISTING_EVENT
      - DELETE_HISTORICAL_EVENT
      description: |
        Transport-level duplicates may be deduplicated, but valid case activity events must remain immutable and append-only.
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 2400
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/service_case_events
- property: g3:eventDeduplicationKey
  value:
  - eventId
- property: g3:eventQualityRules
  value:
  - id: SCE_KAFKA_POSITION_UNIQUE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: UNIQUE_EVENT_ENVELOPE_POSITION
      columns:
      - topic
      - partition
      - offset
    severity: error
    dimension: uniqueness
    description: |
      A Kafka topic, partition, and offset combination must identify one landed transport record.
    customProperties:
    - property: g3:action
      value: DEDUPLICATE_TRANSPORT_COPY
  - id: SCE_EVENT_KEY_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ENVELOPE_FIELD_NOT_NULL
    severity: warning
    dimension: completeness
    description: |
      The Kafka event key should be present for deterministic partitioning and replay.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCE_EVENT_TIMESTAMP_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ENVELOPE_FIELD_NOT_NULL
    severity: warning
    dimension: completeness
    description: |
      The Kafka envelope should retain the broker event timestamp.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
- property: g3:derivedQualityChecks
  value:
  - rule_id: SCE_CUSTOMER_SAFE_EVENT_LABEL
    type: GOVERNED_EVENT_TRANSLATION
    source_field: eventType
    output_field: customer_safe_event_label
    proposed_mapping:
      STATUS_CHANGED: Case status updated
      ASSIGNED: Case assigned for review
      ESCALATED: Case escalated for additional review
      DOCUMENT_ATTACHED: A document was added to the case
      CUSTOMER_CONTACTED: Customer contact was recorded
    excluded_values:
    - NOTE_ADDED
    approval_status: TBD_GOVERNANCE_REVIEW
    description: |
      Customer-facing context may use approved high-level event labels. Internal note events must not be exposed.
  - rule_id: SCE_DESCRIPTION_REDACTION
    type: PRIVACY_TRANSFORMATION
    source_field: description
    output_field: description_redacted
    description: |
      Raw event descriptions must be removed or transformed into approved customer-safe summaries before Customer.AI consumption.
  - rule_id: SCE_AGENT_REDACTION
    type: PRIVACY_TRANSFORMATION
    source_field: performedBy
    output_field: performed_by_redacted
    description: |
      Internal service-agent identifiers must be excluded from customer-facing AI context.
  - rule_id: SCE_LATEST_CASE_EVENT
    type: LATEST_EVENT_VALUE
    group_column: caseId
    order_by:
    - eventTimestamp
    - eventId
    source_fields:
    - eventType
    - eventTimestamp
    output_fields:
    - latest_event_type
    - latest_event_timestamp
    comparison_scope: COMPLETE_SNAPSHOT
    description: |
      Silver may derive the latest validated case activity for support-history and handover summaries.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all seven fields defined for service_case_events.
  - |
    service_case_events is an EVENT source and must remain append-only. Transport duplicates may be removed, but valid historical activities must never be updated or deleted.
  - |
    The source documents six event types and their population ratios. Those ratios are implemented only as complete-snapshot monitoring warnings.
  - |
    The complete eventType-to-description template catalogue is not published. The contract validates non-empty descriptions and records exact template mapping as TBD rather than inventing additional templates.
  - |
    NOTE_ADDED descriptions represent internal notes and must never be exposed to Customer.AI. The assignment's supported customer questions allow a safe case-history summary, but explicitly restrict internal banker notes.
  - |
    performedBy is an internal employee identifier and must be redacted from customer-facing outputs.
  - |
    STATUS_CHANGED events do not include oldStatus or newStatus, so this dataset alone cannot explain the exact status transition or verify it against the current parent case status.
  - The Kafka topic name, event-key convention, full description-template catalogue, and exact Pareto concentration thresholds
    remain TBD.
