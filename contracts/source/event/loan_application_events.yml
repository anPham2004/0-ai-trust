kind: DataContract
apiVersion: v3.1.0
id: source.event.loan_application_events
version: 1.0.0
name: loan_application_events
status: draft
domain: LENDING_ORIGINATION
description:
  purpose: |
    Append-only BPI process-mining events for loan applications. The source contains twenty-four concept names across Application, Offer, and Workflow event origins, together with lifecycle transitions, responsible resources, actions, timestamps, and optional offer attributes.
servers:
- server: source-kafka
  type: kafka
  host: kafka:9092
  topic: nab.application.events
  format: json
  description: Kafka event stream for loan_application_events
  environment: prod
schema:
- name: loan_application_events
  logicalType: object
  physicalType: table
  physicalName: loan_application_events
  relationships:
  - type: foreignKey
    from:
    - loan_application_events.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - loan_application_events.applicationId
    to:
    - loan_applications.applicationId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: LAE_EVENT_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: |
      eventId must uniquely identify a business event. Repeated eventId values are treated as transport duplicates rather than new process events.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - eventId
  - id: LAE_APPLICATION_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A process event should identify its loan application. The physical schema currently permits applicationId to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - applicationId
  - id: LAE_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A process event should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: LAE_APPLICATION_CUSTOMER_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: loan_applications
        source_columns:
        - applicationId
        - global_id
        reference_columns:
        - applicationId
        - global_id
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      applicationId and global_id must refer to the same loan application.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAE_TIMESTAMP_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A usable process event should contain its business timestamp. The physical schema currently permits timestamp to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - timestamp
  - id: LAE_TIMESTAMP_NOT_BEFORE_SUBMISSION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_TIMESTAMP_COMPARISON
      parameters:
        reference_dataset: loan_applications
        source_key:
          applicationId: applicationId
        source_timestamp_column: timestamp
        operator: GREATER_THAN_OR_EQUAL
        reference_timestamp_column: submittedAt
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      Event timestamp should not normally be earlier than the parent application's submittedAt timestamp.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_EVENT_ORIGIN_FROM_CONCEPT_PREFIX
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: PREFIX_TO_VALUE_MAPPING
      parameters:
        source_column: conceptName
        target_column: eventOrigin
        mappings:
          A_: Application
          O_: Offer
          W_: Workflow
    severity: error
    dimension: consistency
    description: |
      eventOrigin must be derived from the conceptName prefix.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAE_OFFER_FIELDS_NULL_OUTSIDE_OFFER_EVENTS
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_ALL_NULL_UNLESS_PREFIX
      parameters:
        selector_column: conceptName
        allowed_prefix: O_
        target_columns:
        - offerId
        - offeredAmount
        - firstWithdrawalAmount
        - numberOfTerms
        - monthlyCost
        - creditScore
        - accepted
        - selected
    severity: error
    dimension: consistency
    description: |
      Offer-specific fields must be null when conceptName does not begin with O_.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAE_OFFER_ID_PRESENT_FOR_OFFER_EVENTS
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NOT_NULL_BY_PREFIX
      parameters:
        selector_column: conceptName
        prefix: O_
        target_column: offerId
    severity: warning
    dimension: consistency
    description: |
      An Offer event should identify its offer through offerId.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_FIRST_WITHDRAWAL_NOT_ABOVE_OFFER
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: NUMERIC_COLUMN_COMPARISON
      parameters:
        left_column: firstWithdrawalAmount
        operator: LESS_THAN_OR_EQUAL
        right_column: offeredAmount
        parse_as: DECIMAL
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      firstWithdrawalAmount should not normally exceed offeredAmount.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_SELECTED_ACCEPTED_CONSISTENCY
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_ACCEPTED_VALUES
      parameters:
        source_column: selected
        mappings:
          'True':
          - 'True'
        target_column: accepted
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      A selected offer should normally also be accepted. The source only states that selected is correlated with accepted, so this check remains a warning.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_PARENT_TOTAL_EVENT_COUNT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: PARENT_DECLARED_CHILD_COUNT_MATCH
      parameters:
        parent_dataset: loan_applications
        parent_key: applicationId
        parent_count_column: totalEvents
        child_key: applicationId
        parse_parent_count_as: INTEGER
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      In a complete snapshot, the number of events for each application should match loan_applications.totalEvents.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_APPLICATION_EVENT_SEQUENCE_ORDER
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: MONOTONIC_EVENT_TIME_PER_GROUP
      parameters:
        group_columns:
        - applicationId
        timestamp_column: timestamp
        tiebreaker_columns:
        - eventId
        allow_equal_timestamps: true
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: warning
    dimension: timeliness
    description: |
      Events for the same application should be orderable by business timestamp and eventId without requiring updates to historical records.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_BUSINESS_HOURS_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: TIMESTAMP_HOUR_POPULATION_RATIO
      parameters:
        column: timestamp
        timezone: SOURCE_TIMEZONE_TBD
        start_hour_inclusive: 9
        end_hour_exclusive: 17
        expected_ratio: 0.75
        absolute_tolerance: 0.12
        comparison_scope: COMPLETE_SNAPSHOT
    severity: warning
    dimension: timeliness
    description: |
      Approximately seventy-five percent of source events occur during business hours. This is a distribution-monitoring rule, not a record-level validity requirement.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_EXACT_CONCEPT_CATALOGUE_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_CATALOGUE_PENDING
      parameters:
        column: conceptName
        documented_count: 24
        source: GENERATOR_SCRIPT
        status: TBD_FROM_GENERATOR_SCRIPT
    severity: warning
    dimension: conformity
    description: |
      The exact twenty-four concept names must be extracted from the generator script before the contract is promoted to APPROVED.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_SILVER_EVENT_ORIGIN_ALIGNMENT_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DOCUMENTED_CROSS_LAYER_ALIGNMENT
      parameters:
        source_values:
        - Application
        - Offer
        - Workflow
        silver_documented_values:
        - SYSTEM
        - CUSTOMER
        - BANKER
        status: TBD_CROSS_LAYER_ALIGNMENT
    severity: warning
    dimension: consistency
    description: |
      The source defines eventOrigin from A_, O_, and W_ prefixes, while the Silver document notes SYSTEM, CUSTOMER, and BANKER. The team must resolve this mismatch before enforcing the Silver mapping.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: LAE_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: eventId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 4f85ecde-688d-4e29-a99f-55b915ce374b
    quality:
    - id: LAE_EVENT_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: eventId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_EVENT_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: eventId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: loan_application_event_identifier
  - name: applicationId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^Application_\d{9}$
    examples:
    - Application_000000042
    quality:
    - id: LAE_APPLICATION_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^Application_\d{9}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        applicationId must follow the Application_000000000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_APPLICATION_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: loan_applications
          reference_column: applicationId
      severity: error
      dimension: consistency
      description: |
        applicationId must exist in loan_applications.applicationId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: loan_application_identifier
  - name: conceptName
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - A_Submitted
    quality:
    - id: LAE_CONCEPT_NAME_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: conceptName must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_CONCEPT_NAME_PREFIX
      type: library
      metric: invalidValues
      arguments:
        pattern: ^(A_|O_|W_).+$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        conceptName must begin with A_, O_, or W_.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: bpi_process_concept_name
    - property: g3:accepted
      value:
        prefix_values:
        - A_
        - O_
        - W_
        documented_value_count: 24
        exact_value_catalogue_status: TBD_FROM_GENERATOR_SCRIPT
        documented_examples:
        - A_Create Application
        - A_Submitted
        - A_Accepted
        - A_Denied
  - name: lifecycleTransition
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - complete
    quality:
    - id: LAE_LIFECYCLE_TRANSITION_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - complete
        - start
        - schedule
        - suspend
        - resume
        - withdraw
        - ate_abort
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        lifecycleTransition must be one of the documented source values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: process_lifecycle_transition
    - property: g3:accepted
      value:
        values:
        - complete
        - start
        - schedule
        - suspend
        - resume
        - withdraw
        - ate_abort
  - name: timestamp
    logicalType: timestamp
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-03-12T10:45:00Z'
    quality:
    - id: LAE_TIMESTAMP_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: timestamp must be parseable when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: APPLICATION_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: timestamp
  - name: orgResource
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^User_\d{1,3}$
    examples:
    - User_17
    quality:
    - id: LAE_ORG_RESOURCE_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^User_\d{1,3}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        orgResource must follow the User_<number> pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_ORG_RESOURCE_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: REGEX_NUMERIC_COMPONENT_RANGE_IF_PRESENT
        parameters:
          regex: ^User_(\d{1,3})$
          capture_group: 1
          min: 1
          max: 100
      severity: error
      dimension: conformity
      description: |
        orgResource must identify a documented process resource from User_1 through User_100.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: EMPLOYEE_OR_PROCESS_RESOURCE_IDENTIFIER
        handling: REDACT_FROM_CUSTOMER_AI
    - property: g3:domainType
      value: process_resource_identifier
    - property: g3:accepted
      value:
        documented_range: User_1 through User_100
  - name: action
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - statechange
    quality:
    - id: LAE_ACTION_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Created
        - statechange
        - Obtained
        - Released
        - Deleted
      mustBe: 0
      severity: error
      dimension: conformity
      description: action must be one of the documented source values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: process_event_action
    - property: g3:accepted
      value:
        values:
        - Created
        - statechange
        - Obtained
        - Released
        - Deleted
  - name: eventOrigin
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - Application
    quality:
    - id: LAE_EVENT_ORIGIN_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Application
        - Offer
        - Workflow
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        eventOrigin must be Application, Offer, or Workflow.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: process_event_origin
    - property: g3:accepted
      value:
        values:
        - Application
        - Offer
        - Workflow
  - name: offerId
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^Offer_\d{9}$
    examples:
    - Offer_000000042
    quality:
    - id: LAE_OFFER_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^Offer_\d{9}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        offerId must follow the Offer_000000000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_OFFER_IDENTIFIER
        handling: TOKENISE_OR_REDACT
    - property: g3:domainType
      value: offer_identifier
  - name: offeredAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '30000.00'
    quality:
    - id: LAE_OFFERED_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        offeredAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_OFFERED_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: offeredAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_OFFER_FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: firstWithdrawalAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '25000.00'
    quality:
    - id: LAE_FIRST_WITHDRAWAL_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        firstWithdrawalAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_FIRST_WITHDRAWAL_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: |
        firstWithdrawalAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_OFFER_FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: numberOfTerms
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    examples:
    - '60.0'
    quality:
    - id: LAE_NUMBER_OF_TERMS_ENUM_IF_PRESENT
      type: library
      metric: invalidValues
      arguments:
        values:
        - '12.0'
        - '24.0'
        - '36.0'
        - '48.0'
        - '60.0'
        - '72.0'
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        numberOfTerms must be one of the documented term values when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: term_months_decimal_string
    - property: g3:accepted
      value:
        values:
        - '12.0'
        - '24.0'
        - '36.0'
        - '48.0'
        - '60.0'
        - '72.0'
  - name: monthlyCost
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '415.70'
    quality:
    - id: LAE_MONTHLY_COST_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        monthlyCost must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_MONTHLY_COST_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: monthlyCost must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_OFFER_FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: creditScore
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '750'
    quality:
    - id: LAE_CREDIT_SCORE_INTEGER
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_INTEGER_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        creditScore must be parseable as an integer when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAE_CREDIT_SCORE_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 0
          max: 1000
          parse_as: INTEGER
      severity: error
      dimension: conformity
      description: creditScore must be between zero and one thousand.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_RISK_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: credit_score
  - name: accepted
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - 'True'
    quality:
    - id: LAE_ACCEPTED_BOOLEAN_STRING
      type: library
      metric: invalidValues
      arguments:
        values:
        - 'True'
        - 'False'
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        accepted must be True or False when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_DECISION_INFORMATION
        handling: BANKER_ONLY_OR_RESTRICT
    - property: g3:domainType
      value: nullable_boolean_string
    - property: g3:accepted
      value:
        values:
        - 'True'
        - 'False'
  - name: selected
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - 'True'
    quality:
    - id: LAE_SELECTED_BOOLEAN_STRING
      type: library
      metric: invalidValues
      arguments:
        values:
        - 'True'
        - 'False'
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        selected must be True or False when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_OFFER_SELECTION_INFORMATION
        handling: BANKER_ONLY_OR_RESTRICT
    - property: g3:domainType
      value: nullable_boolean_string
    - property: g3:accepted
      value:
        values:
        - 'True'
        - 'False'
customProperties:
- property: g3:source
  value:
    category: EVENT
    system_type: BUSINESS_EVENT_STREAM
    authoritative: true
    event_name: loan_application_events
    topic_name: TBD
    append_only: true
- property: g3:ingestion
  value:
    mechanism: KAFKA_EVENT
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/event/loan_application_events/
      immutable: true
    bronze_target: bronze.event_loan_application_events
    deduplicated_bronze_target: bronze.kafka_events_deduplicated
    event_envelope:
      retained_metadata:
      - topic
      - key
      - partition
      - offset
      - timestamp
      - event_type
      - raw_payload
    append_only_policy:
      allowed_operations:
      - APPEND
      prohibited_operations:
      - UPDATE_EXISTING_EVENT
      - DELETE_HISTORICAL_EVENT
      description: |
        Transport-level duplicates may be deduplicated, but valid process events must remain immutable and append-only.
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 5000
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/loan_application_events
- property: g3:eventDeduplicationKey
  value:
  - eventId
- property: g3:eventQualityRules
  value:
  - id: LAE_KAFKA_POSITION_UNIQUE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: UNIQUE_EVENT_ENVELOPE_POSITION
      columns:
      - topic
      - partition
      - offset
    severity: error
    dimension: uniqueness
    description: |
      A Kafka topic, partition, and offset combination must identify one landed transport record.
    customProperties:
    - property: g3:action
      value: DEDUPLICATE_TRANSPORT_COPY
  - id: LAE_EVENT_KEY_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ENVELOPE_FIELD_NOT_NULL
    severity: warning
    dimension: completeness
    description: |
      The Kafka event key should be present for deterministic partitioning and replay.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAE_EVENT_TIMESTAMP_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ENVELOPE_FIELD_NOT_NULL
    severity: warning
    dimension: completeness
    description: |
      The Kafka envelope should retain the broker event timestamp.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
- property: g3:derivedQualityChecks
  value:
  - rule_id: LAE_EVENT_ORIGIN_DERIVATION
    type: DERIVED_ENUM
    expression: |
      CASE
        WHEN conceptName LIKE 'A_%' THEN 'Application'
        WHEN conceptName LIKE 'O_%' THEN 'Offer'
        WHEN conceptName LIKE 'W_%' THEN 'Workflow'
      END
    output_field: derived_event_origin
    description: |
      Silver may independently derive event origin and compare it with the physical eventOrigin value.
  - rule_id: LAE_OFFER_AMOUNT_BUCKET_DERIVATION
    type: PRIVACY_TRANSFORMATION
    source_fields:
    - offeredAmount
    - firstWithdrawalAmount
    - monthlyCost
    output_fields:
    - offered_amount_masked
    - first_withdrawal_amount_masked
    - monthly_cost_masked
    description: |
      AI-ready outputs must use approved monetary range buckets rather than exact offer values.
  - rule_id: LAE_OFFER_DECISION_PROJECTION
    type: APPROVED_CONTEXT_PROJECTION
    approved_fields:
    - conceptName
    - lifecycleTransition
    - timestamp
    - action
    - eventOrigin
    prohibited_fields:
    - orgResource
    - offerId
    - offeredAmount
    - firstWithdrawalAmount
    - monthlyCost
    - creditScore
    description: |
      A restricted process timeline may be projected after quality validation, while employee identifiers, offer identifiers, exact amounts, and credit scores remain excluded or masked.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all seventeen fields defined for loan_application_events.
  - |
    loan_application_events is an EVENT source and must remain append-only. Transport duplicates may be removed, but valid historical events must never be updated or deleted.
  - |
    The source states that conceptName has twenty-four values but lists only four examples in the schema document. The full accepted-value catalogue must be extracted from the generator script rather than invented.
  - |
    The lifecycle value ate_abort is preserved exactly as documented by the source. The team should verify its spelling against the generator script before promoting the contract to APPROVED.
  - |
    Offer-specific fields are allowed only for O_ concept events. The source does not state that every offer field is mandatory on every O_ event, so only offerId presence is treated as a warning expectation.
  - |
    eventOrigin is derived from conceptName as Application, Offer, or Workflow. A conflicting Silver note lists SYSTEM, CUSTOMER, and BANKER, so the final cross-layer mapping remains unresolved.
  - orgResource is an internal process-resource identifier and must not be exposed to Customer.AI. Exact offer amounts, monthly
    costs, credit scores, and offer decisions require masking or restricted banker access.
