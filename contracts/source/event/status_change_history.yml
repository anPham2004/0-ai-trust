# =============================================================================
# DATA CONTRACT: status_change_history
# =============================================================================
# Purpose:
# - Stores the append-only audit log of loan-application status transitions.
# - Records the previous status, new status, transition timestamp, responsible
#   staff member, and the source-provided transition reason.
#
# Important event behaviour:
# - Each row is a historical status-change event and must remain append-only.
# - Transport duplicates may be removed, but valid historical transitions must
#   never be updated or deleted.
# - applicationId links each transition to loan_applications.
#
# Quick guide:
# - required: the event payload field must exist.
# - nullable: the physical payload value may be null.
# - ERROR + QUARANTINE: exclude the event from trusted outputs.
# - WARNING + ALLOW_WITH_WARNING: retain the event and report the issue.
# =============================================================================

contract_version: "1.0.0"
contract_id: "source.event.status_change_history"

# -----------------------------------------------------------------------------
# 1. Basic dataset information
# -----------------------------------------------------------------------------
dataset:
  name: status_change_history
  domain: LENDING_ORIGINATION
  description: >
    Append-only audit events for loan-application status transitions. Each
    record captures the previous status, next status, change timestamp,
    responsible staff member, and the source-provided transition reason.
  expected_rows_scale_1: 2000
  physical_schema_ref: "dev-tools/datagen/output/master-schema.json#/status_change_history"

# -----------------------------------------------------------------------------
# 2. Ownership and contract lifecycle
# -----------------------------------------------------------------------------
lifecycle:
  # DRAFT -> IN_REVIEW -> APPROVED -> DEPRECATED / RETIRED
  status: DRAFT
  owner: TBD
  approver: TBD
  effective_from: null

# -----------------------------------------------------------------------------
# 3. Event source and ingestion information
# -----------------------------------------------------------------------------
source:
  category: EVENT
  system_type: BUSINESS_EVENT_STREAM
  event_name: status_change_history
  topic_name: TBD
  authoritative: true
  append_only: true

ingestion:
  mechanism: KAFKA_EVENT
  transport: APACHE_KAFKA

  landing:
    format: JSONL
    path_template: "s3://<bucket>/bronze/landing/event/status_change_history/"
    immutable: true

  bronze_target: "bronze.kafka_events"
  deduplicated_bronze_target: "bronze.kafka_events_deduplicated"

  event_envelope:
    retained_metadata:
      - topic
      - key
      - partition
      - offset
      - timestamp
      - event_type
      - raw_payload

  append_only_policy:
    allowed_operations:
      - APPEND
    prohibited_operations:
      - UPDATE_EXISTING_EVENT
      - DELETE_HISTORICAL_EVENT
    description: >
      Transport-level duplicates may be deduplicated, but valid status-change
      events must remain immutable and append-only.

# -----------------------------------------------------------------------------
# 4. Keys and relationships
# -----------------------------------------------------------------------------
keys:
  primary_key:
    - changeId

  event_deduplication_key:
    - changeId

  foreign_keys:
    - columns:
        - global_id
      reference:
        dataset: customers
        columns:
          - global_id
      nullable: true

    - columns:
        - applicationId
      reference:
        dataset: loan_applications
        columns:
          - applicationId
      nullable: true

# -----------------------------------------------------------------------------
# 5. Field-level contract
# -----------------------------------------------------------------------------
schema:
  fields:

    - name: changeId
      data_type: string
      logical_type: status_change_event_identifier
      required: true
      nullable: false
      accepted:
        format: UUID
      example: "d2ae2db0-5272-4807-97b7-b138aa1b2909"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: SCH_CHANGE_ID_NOT_NULL
          type: NOT_NULL
          severity: ERROR
          action: QUARANTINE
          description: "changeId must always be present."

        - rule_id: SCH_CHANGE_ID_UUID
          type: FORMAT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "changeId must be a valid UUID."

    - name: global_id
      data_type: string
      logical_type: person_identifier
      required: true
      nullable: true
      accepted:
        format: UUID
      example: "65df84b8-4274-4dbd-9667-6c9967ae6538"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: SCH_GLOBAL_ID_UUID
          type: FORMAT_IF_PRESENT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "global_id must be a valid UUID when supplied."

        - rule_id: SCH_GLOBAL_ID_CUSTOMER_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: customers
            reference_column: global_id
          severity: ERROR
          action: QUARANTINE
          description: >
            global_id must exist in customers.global_id when supplied.

    - name: applicationId
      data_type: string
      logical_type: loan_application_identifier
      required: true
      nullable: true
      accepted:
        regex: '^Application_\d{9}$'
      example: "Application_000000042"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: SCH_APPLICATION_ID_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^Application_\d{9}$'
          severity: ERROR
          action: QUARANTINE
          description: >
            applicationId must follow the Application_000000000 pattern when supplied.

        - rule_id: SCH_APPLICATION_ID_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: loan_applications
            reference_column: applicationId
          severity: ERROR
          action: QUARANTINE
          description: >
            applicationId must exist in loan_applications.applicationId when supplied.

    - name: oldStatus
      data_type: string
      logical_type: previous_application_stage
      required: true
      nullable: true
      accepted:
        values:
          - Submitted
          - Document_Verification
          - Assessment
          - Credit_Check
          - Conditionally_Approved
          - Approved
          - Denied
          - Withdrawn
          - Cancelled
      example: "Document_Verification"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
      quality_rules:
        - rule_id: SCH_OLD_STATUS_ENUM_IF_PRESENT
          type: ACCEPTED_VALUES_IF_PRESENT
          parameters:
            values:
              - Submitted
              - Document_Verification
              - Assessment
              - Credit_Check
              - Conditionally_Approved
              - Approved
              - Denied
              - Withdrawn
              - Cancelled
          severity: ERROR
          action: QUARANTINE
          description: >
            oldStatus must be one of the documented application stages when supplied.

    - name: newStatus
      data_type: string
      logical_type: new_application_stage
      required: true
      nullable: true
      accepted:
        values:
          - Submitted
          - Document_Verification
          - Assessment
          - Credit_Check
          - Conditionally_Approved
          - Approved
          - Denied
          - Withdrawn
          - Cancelled
      example: "Assessment"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
      quality_rules:
        - rule_id: SCH_NEW_STATUS_ENUM_IF_PRESENT
          type: ACCEPTED_VALUES_IF_PRESENT
          parameters:
            values:
              - Submitted
              - Document_Verification
              - Assessment
              - Credit_Check
              - Conditionally_Approved
              - Approved
              - Denied
              - Withdrawn
              - Cancelled
          severity: ERROR
          action: QUARANTINE
          description: >
            newStatus must be one of the documented application stages when supplied.

    - name: changedAt
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
      example: "2026-02-23T09:00:00Z"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: APPLICATION_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
      quality_rules:
        - rule_id: SCH_CHANGED_AT_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "changedAt must be parseable as a timestamp."

    - name: changedBy
      data_type: string
      logical_type: internal_staff_identifier
      required: true
      nullable: true
      accepted:
        regex: '^STAFF-\d{3}$'
        numeric_suffix_min: 1
        numeric_suffix_max: 60
      example: "STAFF-027"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: EMPLOYEE_IDENTIFIER
        handling: REDACT_FROM_CUSTOMER_AI
      quality_rules:
        - rule_id: SCH_CHANGED_BY_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^STAFF-\d{3}$'
          severity: ERROR
          action: QUARANTINE
          description: >
            changedBy must follow the STAFF-000 pattern when supplied.

        - rule_id: SCH_CHANGED_BY_RANGE
          type: REGEX_NUMERIC_COMPONENT_RANGE_IF_PRESENT
          parameters:
            regex: '^STAFF-(\d{3})$'
            capture_group: 1
            min: 1
            max: 60
          severity: ERROR
          action: QUARANTINE
          description: >
            changedBy must identify a documented source staff number from 001
            through 060.

    - name: reason
      data_type: string
      logical_type: status_change_reason
      required: true
      nullable: true
      accepted:
        values:
          - auto_progression
          - approved_by_officer
          - credit_fail
          - document_rejected
          - withdrawn_by_customer
          - customer_request
        exact_status_mapping_status: TBD_FROM_GENERATOR_CONFIG
      example: "document_rejected"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: APPLICATION_DECISION_OR_PROCESS_REASON
        handling: CUSTOMER_SAFE_SUMMARY_OR_BANKER_ONLY
      quality_rules:
        - rule_id: SCH_REASON_ENUM_IF_PRESENT
          type: ACCEPTED_VALUES_IF_PRESENT
          parameters:
            values:
              - auto_progression
              - approved_by_officer
              - credit_fail
              - document_rejected
              - withdrawn_by_customer
              - customer_request
          severity: ERROR
          action: QUARANTINE
          description: >
            reason must be one of the documented source values when supplied.

# -----------------------------------------------------------------------------
# 6. Dataset-level quality rules
# -----------------------------------------------------------------------------
dataset_quality_rules:

  - rule_id: SCH_CHANGE_ID_UNIQUE
    type: UNIQUE
    columns:
      - changeId
    severity: ERROR
    action: QUARANTINE
    description: >
      changeId must uniquely identify a status-change event. Repeated changeId
      values are treated as transport duplicates rather than new transitions.

  - rule_id: SCH_APPLICATION_LINK_PRESENT
    type: NOT_NULL
    columns:
      - applicationId
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A status-change event should identify its application. The physical
      schema currently permits applicationId to be null.

  - rule_id: SCH_CUSTOMER_LINK_PRESENT
    type: NOT_NULL
    columns:
      - global_id
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A status-change event should identify its customer. The physical schema
      currently permits global_id to be null.

  - rule_id: SCH_APPLICATION_CUSTOMER_CONSISTENT
    type: REFERENCE_PAIR_CONSISTENT
    parameters:
      reference_dataset: loan_applications
      source_columns:
        - applicationId
        - global_id
      reference_columns:
        - applicationId
        - global_id
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      applicationId and global_id must refer to the same loan application.

  - rule_id: SCH_CORE_EVENT_FIELDS_PRESENT
    type: ALL_NOT_NULL
    columns:
      - oldStatus
      - newStatus
      - changedAt
      - changedBy
      - reason
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A usable status-change event should contain both statuses, the timestamp,
      responsible staff member, and reason. The physical schema permits nulls.

  - rule_id: SCH_STATUS_MUST_CHANGE
    type: COLUMN_COMPARISON
    parameters:
      left_column: oldStatus
      operator: NOT_EQUAL
      right_column: newStatus
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      oldStatus and newStatus must differ for a status-change event.

  - rule_id: SCH_ALLOWED_TRANSITION
    type: VALUE_PAIR_ACCEPTED
    parameters:
      left_column: oldStatus
      right_column: newStatus
      accepted_pairs:
        - [Submitted, Document_Verification]
        - [Document_Verification, Assessment]
        - [Assessment, Credit_Check]
        - [Assessment, Conditionally_Approved]
        - [Assessment, Withdrawn]
        - [Assessment, Cancelled]
        - [Credit_Check, Approved]
        - [Credit_Check, Denied]
        - [Conditionally_Approved, Document_Verification]
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      The old-to-new status pair must follow a documented application-stage transition.

  - rule_id: SCH_CHANGED_AT_NOT_BEFORE_SUBMISSION
    type: REFERENCE_TIMESTAMP_COMPARISON
    parameters:
      reference_dataset: loan_applications
      source_key:
        applicationId: applicationId
      source_timestamp_column: changedAt
      operator: GREATER_THAN_OR_EQUAL
      reference_timestamp_column: submittedAt
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      changedAt cannot be earlier than the parent application's submittedAt.

  - rule_id: SCH_CHRONOLOGICAL_ORDER_PER_APPLICATION
    type: MONOTONIC_EVENT_TIME_PER_GROUP
    parameters:
      group_columns:
        - applicationId
      timestamp_column: changedAt
      tiebreaker_columns:
        - changeId
      allow_equal_timestamps: true
      comparison_scope: COMPLETE_SNAPSHOT
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      Status changes for the same application must be chronologically orderable.

  - rule_id: SCH_STATUS_CHAIN_CONTINUITY
    type: PREVIOUS_NEXT_VALUE_CONTINUITY
    parameters:
      group_column: applicationId
      timestamp_column: changedAt
      current_old_value_column: oldStatus
      current_new_value_column: newStatus
      require_previous_new_equals_current_old: true
      comparison_scope: COMPLETE_SNAPSHOT
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      For consecutive transitions, the previous newStatus must equal the next
      event's oldStatus.

  - rule_id: SCH_MAX_ONE_IDENTICAL_TRANSITION_AT_TIME
    type: UNIQUE_WITHIN_GROUP
    columns:
      - applicationId
      - oldStatus
      - newStatus
      - changedAt
    parameters:
      comparison_scope: COMPLETE_SNAPSHOT
      ignore_nulls: true
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      Identical transitions at the same timestamp may indicate duplicate event
      production even when changeId values differ.

  - rule_id: SCH_STAGE_HISTORY_ALIGNMENT
    type: CROSS_EVENT_TRANSITION_ALIGNMENT
    parameters:
      transition_dataset: status_change_history
      stage_dataset: application_stage_history
      group_column: applicationId
      transition_old_column: oldStatus
      transition_new_column: newStatus
      transition_timestamp_column: changedAt
      stage_value_column: stage
      stage_entered_timestamp_column: enteredAt
      comparison_scope: COMPLETE_SNAPSHOT
      timestamp_tolerance_seconds: TBD_FROM_GENERATOR_CONFIG
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      Status transitions should align with consecutive application-stage
      records. The exact timestamp relationship is not documented and remains TBD.

  - rule_id: SCH_REASON_STATUS_MAPPING_REVIEW
    type: REFERENCE_MAPPING_PENDING
    parameters:
      selector_columns:
        - oldStatus
        - newStatus
      target_column: reason
      documented_values:
        - auto_progression
        - approved_by_officer
        - credit_fail
        - document_rejected
        - withdrawn_by_customer
        - customer_request
      status: TBD_FROM_GENERATOR_CONFIG
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      The source states that reason is status-correlated but does not provide
      the exact oldStatus/newStatus-to-reason mapping. The mapping must be copied
      from the generator before this contract is promoted to APPROVED.

  - rule_id: SCH_PARENT_OUTCOME_ALIGNMENT_REVIEW
    type: DOCUMENTED_CROSS_SOURCE_ALIGNMENT
    parameters:
      parent_dataset: loan_applications
      parent_column: finalOutcome
      stage_history_terminal_statuses:
        - Approved
        - Denied
        - Withdrawn
        - Cancelled
      parent_contract_outcomes:
        - Accepted
        - Denied
        - Cancelled
        - Incomplete
        - Pending
      status: TBD_CROSS_SOURCE_ALIGNMENT
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      The final transition and loan_applications.finalOutcome use partially
      different vocabularies. The team must resolve this mismatch before
      enforcing a hard parent-outcome alignment rule.

# -----------------------------------------------------------------------------
# 7. Event transport quality rules
# -----------------------------------------------------------------------------
event_quality_rules:

  - rule_id: SCH_KAFKA_POSITION_UNIQUE
    type: UNIQUE_EVENT_ENVELOPE_POSITION
    columns:
      - topic
      - partition
      - offset
    severity: ERROR
    action: DEDUPLICATE_TRANSPORT_COPY
    description: >
      A Kafka topic, partition, and offset combination must identify one landed
      transport record.

  - rule_id: SCH_EVENT_KEY_PRESENT
    type: ENVELOPE_FIELD_NOT_NULL
    field: key
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      The Kafka event key should be present for deterministic partitioning and replay.

  - rule_id: SCH_EVENT_TIMESTAMP_PRESENT
    type: ENVELOPE_FIELD_NOT_NULL
    field: timestamp
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      The Kafka envelope should retain the broker event timestamp.

# -----------------------------------------------------------------------------
# 8. Derived checks for Silver and AI-ready context
# -----------------------------------------------------------------------------
derived_quality_checks:

  - rule_id: SCH_STATUS_TRANSITION_LABEL
    type: DERIVED_STRING
    expression: "CONCAT(oldStatus, ' -> ', newStatus)"
    output_field: status_transition
    description: >
      Silver may derive a readable transition label after both statuses pass validation.

  - rule_id: SCH_CUSTOMER_SAFE_REASON_PROJECTION
    type: GOVERNED_REASON_TRANSLATION
    source_field: reason
    output_field: customer_safe_reason
    translation_catalogue_status: TBD_GOVERNED_COPY
    prohibited_content:
      - internal_staff_identifier
      - internal_decision_rule
      - unrestricted_internal_note
    description: >
      Customer.AI may use only an approved customer-safe explanation of the
      transition reason. The governed translation catalogue remains TBD.

  - rule_id: SCH_INTERNAL_STAFF_REDACTION
    type: PRIVACY_TRANSFORMATION
    source_field: changedBy
    output_field: changed_by_redacted
    description: >
      changedBy must be removed from customer-facing AI context.

  - rule_id: SCH_CURRENT_STATUS_DERIVATION
    type: LATEST_EVENT_VALUE
    group_column: applicationId
    order_by:
      - changedAt
      - changeId
    source_field: newStatus
    output_field: derived_current_status
    comparison_scope: COMPLETE_SNAPSHOT
    description: >
      Silver may derive the current status as the newStatus from the latest
      validated transition event.

# -----------------------------------------------------------------------------
# 9. Notes for the team
# -----------------------------------------------------------------------------
notes:
  - >
    This contract follows the authoritative physical source schema and includes
    all eight fields defined for status_change_history.
  - >
    status_change_history is an EVENT source and must remain append-only.
    Transport duplicates may be removed, but valid historical transitions must
    never be updated or deleted.
  - >
    oldStatus and newStatus are documented as consecutive stages in the same
    application lifecycle used by application_stage_history.
  - >
    The source states that reason is status-correlated but does not publish the
    exact mapping. The contract validates the documented reason values and marks
    the detailed mapping as TBD rather than inferring it from the labels.
  - >
    changedBy is an internal employee identifier and must not be exposed to
    Customer.AI.
  - >
    reason may support approved questions such as why an application was
    returned or delayed, but Customer.AI must receive a governed customer-safe
    explanation rather than unrestricted internal processing detail.
  - >
    The Kafka topic name, event-key convention, exact stage-history timestamp
    alignment, and customer-safe reason translation catalogue remain TBD.