kind: DataContract
apiVersion: v3.1.0
id: source.event.status_change_history
version: 1.0.0
name: status_change_history
status: draft
domain: LENDING_ORIGINATION
description:
  purpose: |
    Append-only audit events for loan-application status transitions. Each record captures the previous status, next status, change timestamp, responsible staff member, and the source-provided transition reason.
servers:
- server: source-kafka
  type: kafka
  host: kafka:9092
  topic: nab.application.events
  format: json
  description: Kafka event stream for status_change_history
  environment: prod
schema:
- name: status_change_history
  logicalType: object
  physicalType: table
  physicalName: status_change_history
  relationships:
  - type: foreignKey
    from:
    - status_change_history.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - status_change_history.applicationId
    to:
    - loan_applications.applicationId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: SCH_CHANGE_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: |
      changeId must uniquely identify a status-change event. Repeated changeId values are treated as transport duplicates rather than new transitions.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - changeId
  - id: SCH_APPLICATION_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A status-change event should identify its application. The physical schema currently permits applicationId to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - applicationId
  - id: SCH_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A status-change event should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: SCH_APPLICATION_CUSTOMER_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: loan_applications
        source_columns:
        - applicationId
        - global_id
        reference_columns:
        - applicationId
        - global_id
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      applicationId and global_id must refer to the same loan application.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCH_CORE_EVENT_FIELDS_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - oldStatus
      - newStatus
      - changedAt
      - changedBy
      - reason
    severity: warning
    dimension: completeness
    description: |
      A usable status-change event should contain both statuses, the timestamp, responsible staff member, and reason. The physical schema permits nulls.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCH_STATUS_MUST_CHANGE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: COLUMN_COMPARISON
      parameters:
        left_column: oldStatus
        operator: NOT_EQUAL
        right_column: newStatus
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      oldStatus and newStatus must differ for a status-change event.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCH_ALLOWED_TRANSITION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: VALUE_PAIR_ACCEPTED
      parameters:
        left_column: oldStatus
        right_column: newStatus
        accepted_pairs:
        - - Submitted
          - Document_Verification
        - - Document_Verification
          - Assessment
        - - Assessment
          - Credit_Check
        - - Assessment
          - Conditionally_Approved
        - - Assessment
          - Withdrawn
        - - Assessment
          - Cancelled
        - - Credit_Check
          - Approved
        - - Credit_Check
          - Denied
        - - Conditionally_Approved
          - Document_Verification
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      The old-to-new status pair must follow a documented application-stage transition.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCH_CHANGED_AT_NOT_BEFORE_SUBMISSION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_TIMESTAMP_COMPARISON
      parameters:
        reference_dataset: loan_applications
        source_key:
          applicationId: applicationId
        source_timestamp_column: changedAt
        operator: GREATER_THAN_OR_EQUAL
        reference_timestamp_column: submittedAt
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      changedAt cannot be earlier than the parent application's submittedAt.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCH_CHRONOLOGICAL_ORDER_PER_APPLICATION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: MONOTONIC_EVENT_TIME_PER_GROUP
      parameters:
        group_columns:
        - applicationId
        timestamp_column: changedAt
        tiebreaker_columns:
        - changeId
        allow_equal_timestamps: true
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: error
    dimension: timeliness
    description: |
      Status changes for the same application must be chronologically orderable.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCH_STATUS_CHAIN_CONTINUITY
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: PREVIOUS_NEXT_VALUE_CONTINUITY
      parameters:
        group_column: applicationId
        timestamp_column: changedAt
        current_old_value_column: oldStatus
        current_new_value_column: newStatus
        require_previous_new_equals_current_old: true
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      For consecutive transitions, the previous newStatus must equal the next event's oldStatus.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SCH_MAX_ONE_IDENTICAL_TRANSITION_AT_TIME
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: UNIQUE_WITHIN_GROUP
      parameters:
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
      columns:
      - applicationId
      - oldStatus
      - newStatus
      - changedAt
    severity: warning
    dimension: consistency
    description: |
      Identical transitions at the same timestamp may indicate duplicate event production even when changeId values differ.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCH_STAGE_HISTORY_ALIGNMENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CROSS_EVENT_TRANSITION_ALIGNMENT
      parameters:
        transition_dataset: status_change_history
        stage_dataset: application_stage_history
        group_column: applicationId
        transition_old_column: oldStatus
        transition_new_column: newStatus
        transition_timestamp_column: changedAt
        stage_value_column: stage
        stage_entered_timestamp_column: enteredAt
        comparison_scope: COMPLETE_SNAPSHOT
        timestamp_tolerance_seconds: TBD_FROM_GENERATOR_CONFIG
    severity: warning
    dimension: consistency
    description: |
      Status transitions should align with consecutive application-stage records. The exact timestamp relationship is not documented and remains TBD.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCH_REASON_STATUS_MAPPING_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_MAPPING_PENDING
      parameters:
        selector_columns:
        - oldStatus
        - newStatus
        target_column: reason
        documented_values:
        - auto_progression
        - approved_by_officer
        - credit_fail
        - document_rejected
        - withdrawn_by_customer
        - customer_request
        status: TBD_FROM_GENERATOR_CONFIG
    severity: warning
    dimension: consistency
    description: |
      The source states that reason is status-correlated but does not provide the exact oldStatus/newStatus-to-reason mapping. The mapping must be copied from the generator before this contract is promoted to APPROVED.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCH_PARENT_OUTCOME_ALIGNMENT_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DOCUMENTED_CROSS_SOURCE_ALIGNMENT
      parameters:
        parent_dataset: loan_applications
        parent_column: finalOutcome
        stage_history_terminal_statuses:
        - Approved
        - Denied
        - Withdrawn
        - Cancelled
        parent_contract_outcomes:
        - Accepted
        - Denied
        - Cancelled
        - Incomplete
        - Pending
        status: TBD_CROSS_SOURCE_ALIGNMENT
    severity: warning
    dimension: consistency
    description: |
      The final transition and loan_applications.finalOutcome use partially different vocabularies. The team must resolve this mismatch before enforcing a hard parent-outcome alignment rule.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: changeId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - d2ae2db0-5272-4807-97b7-b138aa1b2909
    quality:
    - id: SCH_CHANGE_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: changeId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCH_CHANGE_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: changeId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: status_change_event_identifier
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: SCH_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCH_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: applicationId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^Application_\d{9}$
    examples:
    - Application_000000042
    quality:
    - id: SCH_APPLICATION_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^Application_\d{9}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        applicationId must follow the Application_000000000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCH_APPLICATION_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: loan_applications
          reference_column: applicationId
      severity: error
      dimension: consistency
      description: |
        applicationId must exist in loan_applications.applicationId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: loan_application_identifier
  - name: oldStatus
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    examples:
    - Document_Verification
    quality:
    - id: SCH_OLD_STATUS_ENUM_IF_PRESENT
      type: library
      metric: invalidValues
      arguments:
        values:
        - Submitted
        - Document_Verification
        - Assessment
        - Credit_Check
        - Conditionally_Approved
        - Approved
        - Denied
        - Withdrawn
        - Cancelled
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        oldStatus must be one of the documented application stages when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: previous_application_stage
    - property: g3:accepted
      value:
        values:
        - Submitted
        - Document_Verification
        - Assessment
        - Credit_Check
        - Conditionally_Approved
        - Approved
        - Denied
        - Withdrawn
        - Cancelled
  - name: newStatus
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    examples:
    - Assessment
    quality:
    - id: SCH_NEW_STATUS_ENUM_IF_PRESENT
      type: library
      metric: invalidValues
      arguments:
        values:
        - Submitted
        - Document_Verification
        - Assessment
        - Credit_Check
        - Conditionally_Approved
        - Approved
        - Denied
        - Withdrawn
        - Cancelled
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        newStatus must be one of the documented application stages when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: new_application_stage
    - property: g3:accepted
      value:
        values:
        - Submitted
        - Document_Verification
        - Assessment
        - Credit_Check
        - Conditionally_Approved
        - Approved
        - Denied
        - Withdrawn
        - Cancelled
  - name: changedAt
    logicalType: timestamp
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-02-23T09:00:00Z'
    quality:
    - id: SCH_CHANGED_AT_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: changedAt must be parseable as a timestamp.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: APPLICATION_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: timestamp
  - name: changedBy
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^STAFF-\d{3}$
    examples:
    - STAFF-027
    quality:
    - id: SCH_CHANGED_BY_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^STAFF-\d{3}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        changedBy must follow the STAFF-000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SCH_CHANGED_BY_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: REGEX_NUMERIC_COMPONENT_RANGE_IF_PRESENT
        parameters:
          regex: ^STAFF-(\d{3})$
          capture_group: 1
          min: 1
          max: 60
      severity: error
      dimension: conformity
      description: |
        changedBy must identify a documented source staff number from 001 through 060.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: EMPLOYEE_IDENTIFIER
        handling: REDACT_FROM_CUSTOMER_AI
    - property: g3:domainType
      value: internal_staff_identifier
    - property: g3:accepted
      value:
        numeric_suffix_min: 1
        numeric_suffix_max: 60
  - name: reason
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - document_rejected
    quality:
    - id: SCH_REASON_ENUM_IF_PRESENT
      type: library
      metric: invalidValues
      arguments:
        values:
        - auto_progression
        - approved_by_officer
        - credit_fail
        - document_rejected
        - withdrawn_by_customer
        - customer_request
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        reason must be one of the documented source values when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: APPLICATION_DECISION_OR_PROCESS_REASON
        handling: CUSTOMER_SAFE_SUMMARY_OR_BANKER_ONLY
    - property: g3:domainType
      value: status_change_reason
    - property: g3:accepted
      value:
        values:
        - auto_progression
        - approved_by_officer
        - credit_fail
        - document_rejected
        - withdrawn_by_customer
        - customer_request
        exact_status_mapping_status: TBD_FROM_GENERATOR_CONFIG
customProperties:
- property: g3:source
  value:
    category: EVENT
    system_type: BUSINESS_EVENT_STREAM
    authoritative: true
    event_name: status_change_history
    topic_name: TBD
    append_only: true
- property: g3:ingestion
  value:
    mechanism: KAFKA_EVENT
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/event/status_change_history/
      immutable: true
    bronze_target: bronze.event_status_change_history
    deduplicated_bronze_target: bronze.kafka_events_deduplicated
    event_envelope:
      retained_metadata:
      - topic
      - key
      - partition
      - offset
      - timestamp
      - event_type
      - raw_payload
    append_only_policy:
      allowed_operations:
      - APPEND
      prohibited_operations:
      - UPDATE_EXISTING_EVENT
      - DELETE_HISTORICAL_EVENT
      description: |
        Transport-level duplicates may be deduplicated, but valid status-change events must remain immutable and append-only.
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 2000
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/status_change_history
- property: g3:eventDeduplicationKey
  value:
  - changeId
- property: g3:eventQualityRules
  value:
  - id: SCH_KAFKA_POSITION_UNIQUE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: UNIQUE_EVENT_ENVELOPE_POSITION
      columns:
      - topic
      - partition
      - offset
    severity: error
    dimension: uniqueness
    description: |
      A Kafka topic, partition, and offset combination must identify one landed transport record.
    customProperties:
    - property: g3:action
      value: DEDUPLICATE_TRANSPORT_COPY
  - id: SCH_EVENT_KEY_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ENVELOPE_FIELD_NOT_NULL
    severity: warning
    dimension: completeness
    description: |
      The Kafka event key should be present for deterministic partitioning and replay.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SCH_EVENT_TIMESTAMP_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ENVELOPE_FIELD_NOT_NULL
    severity: warning
    dimension: completeness
    description: |
      The Kafka envelope should retain the broker event timestamp.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
- property: g3:derivedQualityChecks
  value:
  - rule_id: SCH_STATUS_TRANSITION_LABEL
    type: DERIVED_STRING
    expression: CONCAT(oldStatus, ' -> ', newStatus)
    output_field: status_transition
    description: |
      Silver may derive a readable transition label after both statuses pass validation.
  - rule_id: SCH_CUSTOMER_SAFE_REASON_PROJECTION
    type: GOVERNED_REASON_TRANSLATION
    source_field: reason
    output_field: customer_safe_reason
    translation_catalogue_status: TBD_GOVERNED_COPY
    prohibited_content:
    - internal_staff_identifier
    - internal_decision_rule
    - unrestricted_internal_note
    description: |
      Customer.AI may use only an approved customer-safe explanation of the transition reason. The governed translation catalogue remains TBD.
  - rule_id: SCH_INTERNAL_STAFF_REDACTION
    type: PRIVACY_TRANSFORMATION
    source_field: changedBy
    output_field: changed_by_redacted
    description: |
      changedBy must be removed from customer-facing AI context.
  - rule_id: SCH_CURRENT_STATUS_DERIVATION
    type: LATEST_EVENT_VALUE
    group_column: applicationId
    order_by:
    - changedAt
    - changeId
    source_field: newStatus
    output_field: derived_current_status
    comparison_scope: COMPLETE_SNAPSHOT
    description: |
      Silver may derive the current status as the newStatus from the latest validated transition event.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all eight fields defined for status_change_history.
  - |
    status_change_history is an EVENT source and must remain append-only. Transport duplicates may be removed, but valid historical transitions must never be updated or deleted.
  - |
    oldStatus and newStatus are documented as consecutive stages in the same application lifecycle used by application_stage_history.
  - |
    The source states that reason is status-correlated but does not publish the exact mapping. The contract validates the documented reason values and marks the detailed mapping as TBD rather than inferring it from the labels.
  - |
    changedBy is an internal employee identifier and must not be exposed to Customer.AI.
  - |
    reason may support approved questions such as why an application was returned or delayed, but Customer.AI must receive a governed customer-safe explanation rather than unrestricted internal processing detail.
  - The Kafka topic name, event-key convention, exact stage-history timestamp alignment, and customer-safe reason translation
    catalogue remain TBD.
