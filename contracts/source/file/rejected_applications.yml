kind: DataContract
apiVersion: v3.1.0
id: source.file.rejected_applications
version: 1.0.0
name: rejected_applications
status: draft
domain: LENDING_HISTORY
description:
  purpose: |
    Historical rejected-loan application extract modelled after Lending Club rejected-application records. Each record contains customer linkage, requested lending details, source risk indicators, rejection reason, application title, geographic context, employment length, and policy code.
servers:
- server: source-s3
  type: s3
  description: S3 file drop for rejected_applications
  environment: prod
schema:
- name: rejected_applications
  logicalType: object
  physicalType: table
  physicalName: rejected_applications
  relationships:
  - type: foreignKey
    from:
    - rejected_applications.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: RAP_LOAN_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: loanId must be unique within the parsed file.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - loanId
  - id: RAP_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A rejected-application record should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: RAP_APPLICATION_DATE_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_NOT_IN_FUTURE
      columns:
      - applicationDate
    severity: warning
    dimension: timeliness
    description: |
      applicationDate should not be later than the file processing date.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: RAP_CORE_DECISION_FIELDS_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - requestedAmount
      - applicationDate
      - riskScore
      - debtToIncomeRatio
    severity: warning
    dimension: completeness
    description: |
      A useful rejected-application record should normally include the requested amount, date, risk score, and debt-to-income ratio. The physical schema permits these values to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: RAP_STATE_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CATEGORICAL_DISTRIBUTION_TOLERANCE
      parameters:
        column: state
        expected_ratios:
          NSW: 0.32
          VIC: 0.26
          QLD: 0.2
          WA: 0.12
          SA: 0.06
          TAS: 0.02
          ACT: 0.01
          NT: 0.01
        absolute_tolerance: 0.12
        comparison_scope: COMPLETE_FILE
    severity: warning
    dimension: consistency
    description: |
      State proportions should remain reasonably close to the customer-state distribution in a complete SCALE=1 file.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: RAP_RISK_SCORE_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: NUMERIC_DISTRIBUTION_MONITORING
      parameters:
        column: riskScore
        parse_as: DECIMAL
        expected_distribution:
          family: NORMAL
          mean: 600
          standard_deviation: 80
        comparison_scope: COMPLETE_FILE
        exact_test_thresholds_status: TBD_FROM_ANALYTICAL_IMPLEMENTATION
    severity: warning
    dimension: consistency
    description: |
      riskScore should remain reasonably close to the configured normal distribution in a complete file.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: RAP_DTI_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: NUMERIC_DISTRIBUTION_MONITORING
      parameters:
        column: debtToIncomeRatio
        parse_as: DECIMAL
        expected_distribution:
          family: NORMAL
          mean: 22.0
          standard_deviation: 8.0
        comparison_scope: COMPLETE_FILE
        exact_test_thresholds_status: TBD_FROM_ANALYTICAL_IMPLEMENTATION
    severity: warning
    dimension: consistency
    description: |
      debtToIncomeRatio should remain reasonably close to the configured normal distribution in a complete file.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: RAP_REJECTION_REASON_RISK_ALIGNMENT_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_MAPPING_PENDING
      parameters:
        selector_columns:
        - riskScore
        - debtToIncomeRatio
        - employmentLength
        target_column: rejectionReason
        status: NOT_DOCUMENTED_BY_SOURCE
    severity: warning
    dimension: consistency
    description: |
      The source provides rejection-reason values but does not document a deterministic mapping from risk indicators to a reason. The contract must not infer or recreate underwriting logic.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: RAP_SENSITIVE_FIELD_LEAKAGE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: PROHIBITED_RAW_FIELDS_IN_AI_OUTPUT
      parameters:
        fields:
        - requestedAmount
        - riskScore
        - debtToIncomeRatio
        - rejectionReason
        - applicationTitle
        - zipCode
        - employmentLength
    severity: error
    dimension: conformity
    description: |
      Raw financial, risk, decision, free-text, location, and employment fields must not appear in unrestricted AI-ready output.
    customProperties:
    - property: g3:action
      value: BLOCK_AI_OUTPUT
  - id: RAP_EXPECTED_SCALE_ONE_RECORD_COUNT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: RECORD_COUNT_EXPECTATION
      parameters:
        expected: 250
        applies_when:
          scale: 1
    severity: warning
    dimension: completeness
    description: |
      At SCALE=1, the rejected_applications extract is expected to contain 250 records.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: RAP_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: RAP_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: loanId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - feab9fdb-5040-4294-baf7-30c5a9518ec3
    quality:
    - id: RAP_LOAN_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: loanId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: RAP_LOAN_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: loanId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: rejected_loan_application_identifier
  - name: requestedAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '22000.00'
    quality:
    - id: RAP_REQUESTED_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        requestedAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: RAP_REQUESTED_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: |
        requestedAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: applicationDate
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2026-01-18'
    quality:
    - id: RAP_APPLICATION_DATE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        applicationDate must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LOAN_APPLICATION_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: date
  - name: riskScore
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '612'
    quality:
    - id: RAP_RISK_SCORE_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        riskScore must be parseable as a numeric value when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_RISK_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: lending_risk_score
    - property: g3:accepted
      value:
        distribution:
          family: NORMAL
          mean: 600
          standard_deviation: 80
        hard_range_status: NOT_DOCUMENTED
  - name: debtToIncomeRatio
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '24.50'
    quality:
    - id: RAP_DTI_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        debtToIncomeRatio must be parseable as a numeric value when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: DEBT_CAPACITY_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: percentage
    - property: g3:accepted
      value:
        distribution:
          family: NORMAL
          mean: 22.0
          standard_deviation: 8.0
        hard_range_status: NOT_DOCUMENTED
  - name: rejectionReason
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - Employment not verified
    quality:
    - id: RAP_REJECTION_REASON_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: rejectionReason must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: RAP_REJECTION_REASON_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Debt-to-income too high
        - Insufficient credit history
        - Employment not verified
        - High credit utilization
        - Too many recent inquiries
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        rejectionReason must be one of the five documented source values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_DECISION_REASON
        handling: BANKER_ONLY_OR_GOVERNED_CUSTOMER_SUMMARY
    - property: g3:domainType
      value: rejected_application_reason
    - property: g3:accepted
      value:
        values:
        - Debt-to-income too high
        - Insufficient credit history
        - Employment not verified
        - High credit utilization
        - Too many recent inquiries
  - name: applicationTitle
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
    examples:
    - Loan application for household expenses.
    quality:
    - id: RAP_APPLICATION_TITLE_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: |
        applicationTitle must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LOAN_APPLICATION_FREE_TEXT
        handling: REDACT_OR_BANKER_ONLY
    - property: g3:domainType
      value: rejected_application_title
    - property: g3:accepted
      value:
        exact_max_length_status: NOT_DOCUMENTED
  - name: zipCode
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    examples:
    - '3000'
    quality:
    - id: RAP_ZIP_CODE_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: |
        zipCode must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    - id: RAP_ZIP_CODE_PATTERN_REVIEW
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FORMAT_REVIEW_PENDING
        parameters:
          expected_representation: AUSTRALIAN_POSTCODE
          status: TBD_FROM_GENERATOR_OUTPUT
      severity: warning
      dimension: conformity
      description: |
        The exact postcode formatting rule must be confirmed from generated output before the contract is promoted to APPROVED.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: APPROXIMATE_LOCATION_INFORMATION
        handling: GENERALISE_OR_RESTRICT
    - property: g3:domainType
      value: australian_postcode
    - property: g3:accepted
      value:
        pattern_status: TBD_FROM_GENERATOR_OUTPUT
        expected_representation: AUSTRALIAN_POSTCODE
  - name: state
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - VIC
    quality:
    - id: RAP_STATE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - NSW
        - VIC
        - QLD
        - WA
        - SA
        - TAS
        - ACT
        - NT
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        state must be a supported Australian state or territory code.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: APPROXIMATE_LOCATION_INFORMATION
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: australian_state_or_territory_code
    - property: g3:accepted
      value:
        values:
        - NSW
        - VIC
        - QLD
        - WA
        - SA
        - TAS
        - ACT
        - NT
  - name: employmentLength
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - 5 years
    quality:
    - id: RAP_EMPLOYMENT_LENGTH_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - < 1 year
        - 1 year
        - 2 years
        - 3 years
        - 4 years
        - 5 years
        - 6 years
        - 7 years
        - 8 years
        - 9 years
        - 10+ years
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        employmentLength must use the same documented values as accepted_loans.empLength.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: EMPLOYMENT_INFORMATION
        handling: GENERALISE_OR_RESTRICT
    - property: g3:domainType
      value: employment_length
    - property: g3:accepted
      value:
        values:
        - < 1 year
        - 1 year
        - 2 years
        - 3 years
        - 4 years
        - 5 years
        - 6 years
        - 7 years
        - 8 years
        - 9 years
        - 10+ years
  - name: policyCode
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - PC1
    quality:
    - id: RAP_POLICY_CODE_CONSTANT
      type: library
      metric: invalidValues
      arguments:
        values:
        - PC1
      mustBe: 0
      severity: error
      dimension: conformity
      description: policyCode must always equal PC1.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: lending_policy_code
    - property: g3:accepted
      value:
        values:
        - PC1
  customProperties:
  - property: g3:schema:expected_column_count
    value: 12
  - property: g3:schema:unknown_column_action
    value: REJECT_FILE
  - property: g3:schema:missing_column_action
    value: REJECT_FILE
  - property: g3:schema:incompatible_type_change_action
    value: REJECT_FILE
customProperties:
- property: g3:source
  value:
    category: FILE
    system_type: LEGACY_OR_EXTERNAL_EXTRACT
    authoritative: true
    authoritative_for: HISTORICAL_REJECTED_APPLICATION_RECORDS
    delivery_mode: PERIODIC_FILE_DROP
- property: g3:ingestion
  value:
    mechanism: FILE_DROP
    transport: S3
    source_drop_zone:
      path_template: s3://<source-bucket>/<source-prefix>/rejected_applications/*.csv
      native_format: CSV
    landing:
      path_template: s3://<bucket>/bronze/landing/file/rejected_applications/*.csv
      immutable: true
      copy_mode: BYTE_FOR_BYTE
    bronze_target: bronze.file_arrivals
    bronze_reader: AUTO_LOADER_BINARY_FILE
    bronze_metadata:
    - file_path
    - file_bytes
    - file_size
    - file_modification_time
    - ingestion_timestamp
    - pipeline_run_id
    - source_reference
    parsing:
      stage: SILVER
      format: CSV
      encoding: TBD_FROM_EXPORTER_CONFIG
      delimiter: TBD_FROM_EXPORTER_CONFIG
      header: TBD_FROM_EXPORTER_CONFIG
      quote_character: TBD_FROM_EXPORTER_CONFIG
      escape_character: TBD_FROM_EXPORTER_CONFIG
      malformed_row_action: QUARANTINE
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
    approval_blockers:
    - CSV_PARSING_PROFILE_NOT_CONFIRMED
    - FILE_FRESHNESS_SLA_NOT_CONFIRMED
    - CUSTOMER_SAFE_REJECTION_REASON_CATALOGUE_NOT_APPROVED
- property: g3:dataset
  value:
    expected_rows_scale_1: 250
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/rejected_applications
    expected_physical_column_count: 12
- property: g3:manifest
  value:
    required: true
    path_template: s3://<bucket>/bronze/landing/manifests/manifest-<batch_id>.json
    required_attributes:
    - batch_id
    - heartbeat_status
    - dataset_artifact_path
    - record_count
    - sha256
    - native_format
    - total_records
    reconciliation_checks:
    - rule_id: RAP_FILE_PATH_IN_MANIFEST
      type: FILE_PATH_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: |
        The landed rejected_applications file path must match the artifact path recorded in the delivery manifest.
    - rule_id: RAP_FILE_SHA256_MATCH
      type: SHA256_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: |
        The SHA-256 hash of the landed file must match the manifest hash.
    - rule_id: RAP_FILE_RECORD_COUNT_MATCH
      type: RECORD_COUNT_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: |
        The parsed CSV record count must match the rejected_applications record count declared in the delivery manifest.
    - rule_id: RAP_NATIVE_FORMAT_CSV
      type: MANIFEST_VALUE
      parameters:
        field: native_format
        expected_value: CSV
      severity: ERROR
      action: REJECT_FILE
      description: |
        The manifest must identify the rejected_applications artifact as CSV.
- property: g3:derivedQualityChecks
  value:
  - rule_id: RAP_REQUESTED_AMOUNT_BUCKET
    type: PRIVACY_TRANSFORMATION
    source_field: requestedAmount
    output_field: requested_amount_masked
    description: |
      Silver must convert requestedAmount into an approved monetary range bucket.
  - rule_id: RAP_REJECTED_APPLICATION_PROJECTION
    type: APPROVED_CONTEXT_PROJECTION
    approved_fields:
    - applicationTitle
    - applicationDate
    banker_only_fields:
    - rejectionReason
    masked_fields:
    - requestedAmount
    prohibited_fields:
    - riskScore
    - debtToIncomeRatio
    - zipCode
    - employmentLength
    description: |
      Silver may expose a restricted rejected-application summary after quality validation, masking, access checks, and lineage enrichment.
  - rule_id: RAP_CUSTOMER_SAFE_REJECTION_REASON
    type: GOVERNED_REASON_TRANSLATION
    source_field: rejectionReason
    output_field: customer_safe_rejection_reason
    translation_catalogue_status: TBD_GOVERNED_COPY
    description: |
      Customer-facing output may use only an approved customer-safe explanation of a rejection reason. Raw decision logic and risk indicators remain restricted.
  - rule_id: RAP_FILE_LINEAGE_PROJECTION
    type: LINEAGE_ENRICHMENT
    output_fields:
    - source_dataset
    - source_file_path
    - source_file_sha256
    - source_record_id
    - pipeline_run_id
    - processed_at
    - dq_status
    - masking_status
    - context_version
    description: |
      Curated records must retain enough file and record lineage for answer verification and audit.
- property: g3:fileQualityRules
  value:
  - id: RAP_FILE_NON_EMPTY
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: FILE_SIZE_MIN
      parameters:
        min_bytes: 1
    severity: error
    dimension: completeness
    description: The delivered CSV file must not be empty.
    customProperties:
    - property: g3:action
      value: REJECT_FILE
  - id: RAP_EXACT_COLUMN_COUNT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: EXACT_COLUMN_COUNT
      parameters:
        expected: 12
    severity: error
    dimension: completeness
    description: |
      The parsed CSV file must contain exactly twelve physical columns.
    customProperties:
    - property: g3:action
      value: REJECT_FILE
  - id: RAP_DUPLICATE_FILE_HASH
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DUPLICATE_FILE_HASH
      parameters:
        hash_field: sha256
        scope: rejected_applications
    severity: warning
    dimension: uniqueness
    description: |
      A file with an already processed SHA-256 hash should be treated as a duplicate delivery rather than reprocessed as new data.
    customProperties:
    - property: g3:action
      value: SKIP_DUPLICATE_DELIVERY
  - id: RAP_FILE_FRESHNESS
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: FILE_MODIFICATION_AGE
      parameters:
        modification_time_field: file_modification_time
        max_age: TBD
    severity: warning
    dimension: timeliness
    description: |
      The file freshness threshold must be agreed before the contract is promoted to APPROVED.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all twelve fields defined for rejected_applications.
  - |
    rejected_applications is delivered as a FILE source. Bronze stores the CSV bytes and file metadata, while parsing and schema enforcement occur later.
  - |
    riskScore and debtToIncomeRatio are source risk indicators. The source documents their statistical distributions but does not define hard ranges, so this contract validates numeric parsing and monitors distributions without inventing record-level limits.
  - |
    The source lists five rejection reasons but does not document deterministic underwriting logic. The contract must not infer why a particular risk score or debt-to-income ratio produced a specific reason.
  - |
    rejectionReason is banker-only in the Silver design. Customer-facing use requires an approved governed translation rather than raw internal decision content.
  - |
    applicationTitle is generated free text and may reveal sensitive application purpose or personal context. It must be redacted or restricted before AI use.
  - The exact postcode pattern, CSV parser profile, file freshness SLA, filename convention, and customer-safe reason catalogue
    remain TBD.
