kind: DataContract
apiVersion: v3.1.0
id: source.file.accepted_loans
version: 1.0.0
name: accepted_loans
status: draft
domain: LENDING_HISTORY
description:
  purpose: |
    Historical accepted-loan extract modelled after Lending Club accepted-loan records. The physical dataset contains 152 columns covering borrower profile, credit history, loan terms, repayment performance, hardship programs, and debt settlement.
servers:
- server: source-s3
  type: s3
  location: s3://g3-assignment/g3/0-ai-trust/bronze/landing/file/accepted_loans/*.jsonl
  format: json
  description: S3 file drop for accepted_loans
  environment: prod
schema:
- name: accepted_loans
  logicalType: object
  physicalType: table
  physicalName: accepted_loans
  relationships:
  - type: foreignKey
    from:
    - accepted_loans.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: ACL_LOAN_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: loanId must be unique within the parsed file.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - loanId
  - id: ACL_MEMBER_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: memberId must be unique within the parsed file.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - memberId
  - id: ACL_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      An accepted-loan record should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: ACL_FUNDED_AMOUNT_WITHIN_SOURCE_RATIO
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: NUMERIC_RATIO_RANGE
      parameters:
        numerator_column: fundedAmount
        denominator_column: loanAmount
        min_ratio: 0.95
        max_ratio: 1.0
        parse_as: DECIMAL
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      fundedAmount must be between ninety-five and one hundred percent of loanAmount.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ACL_SUBGRADE_MATCHES_GRADE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: PREFIX_MATCH
      parameters:
        prefix_source_column: grade
        target_column: subGrade
        prefix_length: 1
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      The first character of subGrade must equal grade.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ACL_ISSUED_AT_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_NOT_IN_FUTURE
      columns:
      - issuedAt
    severity: warning
    dimension: timeliness
    description: |
      issuedAt should not be later than the file processing date.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ACL_FULL_SCHEMA_COLUMN_COUNT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: EXACT_COLUMN_COUNT
      parameters:
        expected: 152
        schema_reference: dev-tools/datagen/output/master-schema.json#/accepted_loans
    severity: error
    dimension: completeness
    description: |
      The parsed file must contain exactly the 152 physical columns defined in the authoritative generated schema.
    customProperties:
    - property: g3:action
      value: REJECT_FILE
  - id: ACL_FULL_SCHEMA_NAME_AND_TYPE_MATCH
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: AUTHORITATIVE_SCHEMA_MATCH
      parameters:
        schema_reference: dev-tools/datagen/output/master-schema.json#/accepted_loans
        compare:
        - column_names
        - physical_types
        - nullability
    severity: error
    dimension: conformity
    description: |
      Column names, physical types, and nullability must match the generated authoritative schema.
    customProperties:
    - property: g3:action
      value: REJECT_FILE
  - id: ACL_EXPECTED_SCALE_ONE_RECORD_COUNT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: RECORD_COUNT_EXPECTATION
      parameters:
        expected: 500
        applies_when:
          scale: 1
    severity: warning
    dimension: completeness
    description: |
      At SCALE=1, the accepted_loans extract is expected to contain 500 records.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ACL_HARDSHIP_AMOUNT_CONSISTENCY_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NUMERIC_CONSISTENCY
      parameters:
        when:
          column: hardship_flag
          equals: Y
        target_column: hardship_amount
        expected: POSITIVE_IF_PRESENT
        status: PROPOSED_RULE_REQUIRES_CONFIRMATION
    severity: warning
    dimension: consistency
    description: |
      A hardship record would normally be expected to contain a positive hardship_amount, but the exact source rule must be confirmed.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ACL_SETTLEMENT_AMOUNT_CONSISTENCY_REVIEW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NUMERIC_CONSISTENCY
      parameters:
        when:
          column: debt_settlement_flag
          equals: Y
        target_column: settlement_amount
        expected: POSITIVE_IF_PRESENT
        status: PROPOSED_RULE_REQUIRES_CONFIRMATION
    severity: warning
    dimension: consistency
    description: |
      A debt-settlement record would normally be expected to contain a positive settlement_amount, but the exact source rule must be confirmed.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ACL_SENSITIVE_FIELD_LEAKAGE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: PROHIBITED_RAW_FIELDS_IN_AI_OUTPUT
      parameters:
        fields:
        - memberId
        - loanAmount
        - fundedAmount
        - interestRate
        - annualIncome
        - verification_status
        - grade
        - subGrade
        - fico_range_low
        - hardship_flag
        - debt_settlement_flag
        - dti
        - revol_bal
        - revol_util
        - out_prncp
        - total_pymnt
        - total_rec_prncp
        - total_rec_int
        - recoveries
        - settlement_amount
        - hardship_amount
    severity: error
    dimension: conformity
    description: |
      Raw sensitive borrower, pricing, repayment, hardship, settlement, and credit-risk fields must not appear in AI-ready output.
    customProperties:
    - property: g3:action
      value: BLOCK_AI_OUTPUT
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: ACL_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: loanId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 5e59fd45-1363-47d0-9cdd-27acd402219d
    quality:
    - id: ACL_LOAN_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: loanId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_LOAN_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: loanId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: accepted_loan_identifier
  - name: memberId
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 3dfbd049-6e49-4f34-8cad-cd0bf9717c98
    quality:
    - id: ACL_MEMBER_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: memberId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_MEMBER_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: memberId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LENDING_MEMBER_IDENTIFIER
        handling: TOKENISE_OR_REMOVE
    - property: g3:domainType
      value: lending_member_identifier
  - name: loanAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '24000.00'
    quality:
    - id: ACL_LOAN_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: loanAmount must be parseable as a decimal amount.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_LOAN_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: loanAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: fundedAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '23520.00'
    quality:
    - id: ACL_FUNDED_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: fundedAmount must be parseable as a decimal amount.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_FUNDED_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: fundedAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: term
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - 36 months
    quality:
    - id: ACL_TERM_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - 36 months
        - 60 months
      mustBe: 0
      severity: error
      dimension: conformity
      description: term must be 36 months or 60 months.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: loan_term
    - property: g3:accepted
      value:
        values:
        - 36 months
        - 60 months
  - name: interestRate
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '12.50'
    quality:
    - id: ACL_INTEREST_RATE_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: interestRate must be parseable as a decimal percentage.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_INTEREST_RATE_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: interestRate must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LOAN_PRICING_INFORMATION
        handling: RANGE_BUCKET_OR_RESTRICT
    - property: g3:domainType
      value: percentage
    - property: g3:accepted
      value:
        min_exclusive: 0
  - name: grade
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - B
    quality:
    - id: ACL_GRADE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
      mustBe: 0
      severity: error
      dimension: conformity
      description: grade must be one of A through G.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_RISK_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: credit_grade
    - property: g3:accepted
      value:
        values:
        - A
        - B
        - C
        - D
        - E
        - F
        - G
  - name: subGrade
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^[A-G][1-5]$
    examples:
    - B3
    quality:
    - id: ACL_SUBGRADE_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^[A-G][1-5]$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        subGrade must contain a grade letter followed by a suffix from 1 to 5.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_RISK_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: credit_subgrade
  - name: empLength
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - 5 years
    quality:
    - id: ACL_EMP_LENGTH_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - < 1 year
        - 1 year
        - 2 years
        - 3 years
        - 4 years
        - 5 years
        - 6 years
        - 7 years
        - 8 years
        - 9 years
        - 10+ years
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        empLength must be one of the documented employment-length values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: EMPLOYMENT_INFORMATION
        handling: GENERALISE_OR_RESTRICT
    - property: g3:domainType
      value: employment_length
    - property: g3:accepted
      value:
        values:
        - < 1 year
        - 1 year
        - 2 years
        - 3 years
        - 4 years
        - 5 years
        - 6 years
        - 7 years
        - 8 years
        - 9 years
        - 10+ years
  - name: homeOwnership
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - MORTGAGE
    quality:
    - id: ACL_HOME_OWNERSHIP_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - RENT
        - MORTGAGE
        - OWN
        - OTHER
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        homeOwnership must be RENT, MORTGAGE, OWN, or OTHER.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: PERSONAL_FINANCIAL_PROFILE
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: home_ownership_status
    - property: g3:accepted
      value:
        values:
        - RENT
        - MORTGAGE
        - OWN
        - OTHER
  - name: annualIncome
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '85000.00'
    quality:
    - id: ACL_ANNUAL_INCOME_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: annualIncome must be parseable as a decimal amount.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_ANNUAL_INCOME_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: annualIncome must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INCOME_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: verification_status
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - Source Verified
    quality:
    - id: ACL_VERIFICATION_STATUS_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Not Verified
        - Source Verified
        - Verified
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        verification_status must be one of the documented verification values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INCOME_VERIFICATION_INFORMATION
        handling: BANKER_ONLY_OR_RESTRICT
    - property: g3:domainType
      value: income_verification_status
    - property: g3:accepted
      value:
        values:
        - Not Verified
        - Source Verified
        - Verified
  - name: application_type
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - Individual
    quality:
    - id: ACL_APPLICATION_TYPE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Individual
        - Joint App
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        application_type must be Individual or Joint App.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: accepted_loan_application_type
    - property: g3:accepted
      value:
        values:
        - Individual
        - Joint App
  - name: loanStatus
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - Current
    quality:
    - id: ACL_LOAN_STATUS_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Fully Paid
        - Charged Off
        - Current
        - Late
        - Default
        - In Grace
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        loanStatus must be one of the documented repayment-performance values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_PERFORMANCE_INFORMATION
        handling: BANKER_ONLY_OR_RESTRICT
    - property: g3:domainType
      value: accepted_loan_status
    - property: g3:accepted
      value:
        values:
        - Fully Paid
        - Charged Off
        - Current
        - Late
        - Default
        - In Grace
  - name: fico_range_low
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '720'
    quality:
    - id: ACL_FICO_LOW_INTEGER
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_INTEGER_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        fico_range_low must be parseable as an integer when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ACL_FICO_LOW_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 660
          max: 845
          parse_as: INTEGER
      severity: error
      dimension: conformity
      description: |
        fico_range_low must be between 660 and 845.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_SCORE_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: fico_score_lower_bound
  - name: hardship_flag
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - N
    quality:
    - id: ACL_HARDSHIP_FLAG_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Y
        - N
      mustBe: 0
      severity: error
      dimension: conformity
      description: hardship_flag must be Y or N.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_HARDSHIP_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: hardship_program_flag
    - property: g3:accepted
      value:
        values:
        - Y
        - N
  - name: debt_settlement_flag
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - N
    quality:
    - id: ACL_DEBT_SETTLEMENT_FLAG_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Y
        - N
      mustBe: 0
      severity: error
      dimension: conformity
      description: debt_settlement_flag must be Y or N.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: DEBT_SETTLEMENT_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: debt_settlement_flag
    - property: g3:accepted
      value:
        values:
        - Y
        - N
  - name: purpose
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    examples:
    - debt_consolidation
    quality:
    - id: ACL_PURPOSE_NON_BLANK_IF_PRESENT
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: purpose must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LOAN_PURPOSE_INFORMATION
        handling: APPROVED_CONTEXT_ONLY
    - property: g3:domainType
      value: loan_purpose
    - property: g3:accepted
      value:
        exact_value_catalogue_status: TBD_FROM_MASTER_SCHEMA_JSON
  - name: issuedAt
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2025-11-01'
    quality:
    - id: ACL_ISSUED_AT_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: issuedAt must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LOAN_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: date
  customProperties:
  - property: g3:schema:contract_mode
    value: AUTHORITATIVE_REFERENCE_WITH_PRINCIPAL_FIELD_RULES
  - property: g3:schema:expected_column_count
    value: 152
  - property: g3:schema:authoritative_schema_required
    value: true
  - property: g3:schema:authoritative_schema_ref
    value: dev-tools/datagen/output/master-schema.json#/accepted_loans
  - property: g3:schema:full_field_catalogue_status
    value: REQUIRED_BEFORE_APPROVAL
  - property: g3:schema:unknown_column_action
    value: CAPTURE_AND_WARN
  - property: g3:schema:missing_authoritative_column_action
    value: FAIL_FILE
  - property: g3:schema:incompatible_type_change_action
    value: FAIL_FILE
  - property: g3:schema:notes
    value:
    - |
      The available human-readable schema intentionally lists only principal fields for accepted_loans.
    - |
      All 152 physical columns must be loaded from master-schema.json at runtime before this contract can be promoted to APPROVED.
    - |
      The fields below are the documented principal fields with explicit business and privacy rules.
  - property: g3:schema:documentedFinancialFieldFamilies
    value:
      borrower_risk_and_capacity:
        fields:
        - dti
        - revol_bal
        - revol_util
        physical_rules:
        - PARSEABLE_NUMERIC_IF_PRESENT
        full_schema_details_status: TBD_FROM_MASTER_SCHEMA_JSON
      repayment_performance:
        fields:
        - out_prncp
        - total_pymnt
        - total_rec_prncp
        - total_rec_int
        - recoveries
        physical_rules:
        - PARSEABLE_NUMERIC_IF_PRESENT
        full_schema_details_status: TBD_FROM_MASTER_SCHEMA_JSON
      hardship_and_settlement:
        fields:
        - settlement_amount
        - hardship_amount
        physical_rules:
        - PARSEABLE_NUMERIC_IF_PRESENT
        full_schema_details_status: TBD_FROM_MASTER_SCHEMA_JSON
customProperties:
- property: g3:source
  value:
    category: FILE
    system_type: LEGACY_OR_EXTERNAL_EXTRACT
    authoritative: true
    authoritative_for: HISTORICAL_ACCEPTED_LOAN_RECORDS
    delivery_mode: PERIODIC_FILE_DROP
- property: g3:ingestion
  value:
    mechanism: FILE_DROP
    transport: S3
    source_drop_zone:
      path_template: s3://<source-bucket>/<source-prefix>/accepted_loans/*.csv
      native_format: CSV
    landing:
      path_template: s3://<bucket>/bronze/landing/file/accepted_loans/*.csv
      immutable: true
      copy_mode: BYTE_FOR_BYTE
    bronze_target: bronze.file_accepted_loans
    bronze_reader: AUTO_LOADER_BINARY_FILE
    bronze_metadata:
    - file_path
    - file_bytes
    - file_size
    - file_modification_time
    - ingestion_timestamp
    - pipeline_run_id
    - source_reference
    parsing:
      stage: SILVER
      format: CSV
      encoding: TBD_FROM_EXPORTER_CONFIG
      delimiter: TBD_FROM_EXPORTER_CONFIG
      header: TBD_FROM_EXPORTER_CONFIG
      quote_character: TBD_FROM_EXPORTER_CONFIG
      escape_character: TBD_FROM_EXPORTER_CONFIG
      malformed_row_action: QUARANTINE
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
    approval_blockers:
    - FULL_152_COLUMN_SCHEMA_NOT_EMBEDDED
    - CSV_PARSING_PROFILE_NOT_CONFIRMED
    - FILE_FRESHNESS_SLA_NOT_CONFIRMED
- property: g3:dataset
  value:
    expected_rows_scale_1: 500
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/accepted_loans
    expected_physical_column_count: 152
- property: g3:alternateKeys
  value:
  - memberId
- property: g3:manifest
  value:
    required: true
    path_template: s3://<bucket>/bronze/landing/manifests/manifest-<batch_id>.json
    required_attributes:
    - batch_id
    - heartbeat_status
    - dataset_artifact_path
    - record_count
    - sha256
    - native_format
    - total_records
    reconciliation_checks:
    - rule_id: ACL_FILE_PATH_IN_MANIFEST
      type: FILE_PATH_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: |
        The landed accepted_loans file path must match the artifact path recorded in the delivery manifest.
    - rule_id: ACL_FILE_SHA256_MATCH
      type: SHA256_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: |
        The SHA-256 hash of the landed file must match the manifest hash.
    - rule_id: ACL_FILE_RECORD_COUNT_MATCH
      type: RECORD_COUNT_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: |
        The parsed CSV record count must match the accepted_loans record count declared in the delivery manifest.
    - rule_id: ACL_NATIVE_FORMAT_CSV
      type: MANIFEST_VALUE
      parameters:
        field: native_format
        expected_value: CSV
      severity: ERROR
      action: REJECT_FILE
      description: |
        The manifest must identify the accepted_loans artifact as CSV.
- property: g3:derivedQualityChecks
  value:
  - rule_id: ACL_LOAN_AMOUNT_BUCKET
    type: PRIVACY_TRANSFORMATION
    source_field: loanAmount
    output_field: loan_amount_masked
    description: |
      Silver must convert exact loanAmount into an approved monetary range bucket.
  - rule_id: ACL_APPROVED_LOAN_CONTEXT_PROJECTION
    type: APPROVED_CONTEXT_PROJECTION
    approved_fields:
    - loanStatus
    - purpose
    - term
    - issuedAt
    banker_only_fields:
    - grade
    masked_fields:
    - loanAmount
    prohibited_fields:
    - memberId
    - annualIncome
    - fico_range_low
    - hardship_flag
    - debt_settlement_flag
    - hardship_amount
    - settlement_amount
    description: |
      Silver may expose a restricted accepted-loan summary after validation, masking, access checks, and lineage enrichment.
  - rule_id: ACL_FILE_LINEAGE_PROJECTION
    type: LINEAGE_ENRICHMENT
    output_fields:
    - source_dataset
    - source_file_path
    - source_file_sha256
    - source_record_id
    - pipeline_run_id
    - processed_at
    - dq_status
    - masking_status
    - context_version
    description: |
      Curated records must retain enough file and record lineage for answer verification and audit.
- property: g3:fileQualityRules
  value:
  - id: ACL_FILE_NON_EMPTY
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: FILE_SIZE_MIN
      parameters:
        min_bytes: 1
    severity: error
    dimension: completeness
    description: The delivered CSV file must not be empty.
    customProperties:
    - property: g3:action
      value: REJECT_FILE
  - id: ACL_DUPLICATE_FILE_HASH
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DUPLICATE_FILE_HASH
      parameters:
        hash_field: sha256
        scope: accepted_loans
    severity: warning
    dimension: uniqueness
    description: |
      A file with an already processed SHA-256 hash should be treated as a duplicate delivery rather than reprocessed as new data.
    customProperties:
    - property: g3:action
      value: SKIP_DUPLICATE_DELIVERY
  - id: ACL_FILE_FRESHNESS
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: FILE_MODIFICATION_AGE
      parameters:
        modification_time_field: file_modification_time
        max_age: TBD
    severity: warning
    dimension: timeliness
    description: |
      The file freshness threshold must be agreed before the contract is promoted to APPROVED.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
- property: g3:notes
  value:
  - |
    This is the first FILE-source contract. Unlike DATABASE and EVENT sources, Bronze stores the file bytes and file metadata before parsing the CSV.
  - |
    The current human-readable schema explicitly states that accepted_loans has 152 physical columns but intentionally lists only principal fields.
  - |
    This contract is therefore valid as a DRAFT principal-field contract, but it cannot be promoted to APPROVED until all 152 columns are loaded from the generated master-schema.json and validated.
  - |
    purpose and issuedAt are included because they are used by the approved Silver accepted-loan projection. Their exact physical nullability must still be confirmed from master-schema.json.
  - |
    Exact borrower, pricing, credit-risk, repayment, hardship, and settlement details are highly sensitive and must be masked, restricted, or removed before AI consumption.
  - The source does not provide an explicit file freshness SLA, CSV parser profile, or delivery filename convention. Those
    values remain TBD rather than being invented.
