# =============================================================================
# DATA CONTRACT: energy_plans
# =============================================================================
# Purpose:
# - Stores the EnergyAus retail energy-plan catalogue delivered as a periodic file.
# - Provides governed plan identity, branding, display name, fuel type, plan type,
#   customer segment, effective date, and last-updated timestamp.
#
# Important catalogue behaviour:
# - This dataset is a catalogue and intentionally has no global_id.
# - It is excluded from customer foreign-key integrity validation.
# - energy_accounts.planId references this catalogue.
#
# Important FILE-source behaviour:
# - The source is delivered as a CSV file through the S3 file drop-zone.
# - Bronze copies the file byte-for-byte and records file metadata.
# - Parsing, schema validation, data-quality checks, and curation occur after the
#   immutable file arrival has been registered.
#
# Quick guide:
# - required: the physical CSV column must exist.
# - nullable: the parsed field value may be null.
# - ERROR + QUARANTINE: exclude the record from trusted outputs.
# - WARNING + ALLOW_WITH_WARNING: retain the record and report the issue.
# =============================================================================

contract_version: "1.0.0"
contract_id: "source.file.energy_plans"

# -----------------------------------------------------------------------------
# 1. Basic dataset information
# -----------------------------------------------------------------------------
dataset:
  name: energy_plans
  domain: PRODUCT_CATALOGUE
  description: >
    Fixed EnergyAus retail energy-plan catalogue containing thirty records.
    Each record defines plan identity, EnergyAus branding, display name, fuel
    type, plan type, customer segment, effective date, and update timestamp.
  expected_rows_scale_1: 30
  expected_physical_column_count: 9
  fixed_row_count: true
  physical_schema_ref: "dev-tools/datagen/output/master-schema.json#/energy_plans"

# -----------------------------------------------------------------------------
# 2. Ownership and contract lifecycle
# -----------------------------------------------------------------------------
lifecycle:
  # DRAFT -> IN_REVIEW -> APPROVED -> DEPRECATED / RETIRED
  status: DRAFT
  owner: TBD
  approver: TBD
  effective_from: null

  approval_blockers:
    - CSV_PARSING_PROFILE_NOT_CONFIRMED
    - FILE_FRESHNESS_SLA_NOT_CONFIRMED
    - DISPLAY_NAME_CATALOGUE_NOT_EXTRACTED
    - SOURCE_TIMEZONE_NOT_CONFIRMED

# -----------------------------------------------------------------------------
# 3. File source and ingestion information
# -----------------------------------------------------------------------------
source:
  category: FILE
  system_type: PRODUCT_CATALOGUE_EXTRACT
  authoritative: true
  authoritative_for: ENERGY_RETAIL_PLAN_CATALOGUE
  delivery_mode: PERIODIC_FILE_DROP
  catalogue: true
  contains_global_id: false
  customer_fk_validation_exempt: true

ingestion:
  mechanism: FILE_DROP
  transport: S3

  source_drop_zone:
    path_template: "s3://<source-bucket>/<source-prefix>/energy_plans/*.csv"
    native_format: CSV

  landing:
    path_template: "s3://<bucket>/bronze/landing/file/energy_plans/*.csv"
    immutable: true
    copy_mode: BYTE_FOR_BYTE

  bronze_target: "bronze.file_arrivals"
  bronze_reader: AUTO_LOADER_BINARY_FILE

  bronze_metadata:
    - file_path
    - file_bytes
    - file_size
    - file_modification_time
    - ingestion_timestamp
    - pipeline_run_id
    - source_reference

  parsing:
    stage: SILVER
    format: CSV
    encoding: TBD_FROM_EXPORTER_CONFIG
    delimiter: TBD_FROM_EXPORTER_CONFIG
    header: TBD_FROM_EXPORTER_CONFIG
    quote_character: TBD_FROM_EXPORTER_CONFIG
    escape_character: TBD_FROM_EXPORTER_CONFIG
    malformed_row_action: QUARANTINE

# -----------------------------------------------------------------------------
# 4. Manifest and file-level reconciliation
# -----------------------------------------------------------------------------
manifest:
  required: true
  path_template: "s3://<bucket>/bronze/landing/manifests/manifest-<batch_id>.json"

  required_attributes:
    - batch_id
    - heartbeat_status
    - dataset_artifact_path
    - record_count
    - sha256
    - native_format
    - total_records

  reconciliation_checks:

    - rule_id: EPL_FILE_PATH_IN_MANIFEST
      type: FILE_PATH_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: >
        The landed energy_plans file path must match the artifact path recorded
        in the delivery manifest.

    - rule_id: EPL_FILE_SHA256_MATCH
      type: SHA256_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: >
        The SHA-256 hash of the landed file must match the manifest hash.

    - rule_id: EPL_FILE_RECORD_COUNT_MATCH
      type: RECORD_COUNT_MATCH
      severity: ERROR
      action: REJECT_FILE
      description: >
        The parsed CSV record count must match the energy_plans record count
        declared in the delivery manifest.

    - rule_id: EPL_NATIVE_FORMAT_CSV
      type: MANIFEST_VALUE
      parameters:
        field: native_format
        expected_value: CSV
      severity: ERROR
      action: REJECT_FILE
      description: >
        The manifest must identify the energy_plans artifact as CSV.

# -----------------------------------------------------------------------------
# 5. Keys and relationships
# -----------------------------------------------------------------------------
keys:
  primary_key:
    - planId

  alternate_keys: []

  foreign_keys: []

  referenced_by:
    - dataset: energy_accounts
      source_column: planId
      reference_column: planId
      relationship: MANY_TO_ONE
      nullable_in_child: true

  relationship_notes:
    - >
      energy_plans is a catalogue and has no global_id.
    - >
      energy_accounts.planId is the governed physical reference to this catalogue.
    - >
      Plan display names or categories must not be used as replacement join keys.

# -----------------------------------------------------------------------------
# 6. Field-level contract
# -----------------------------------------------------------------------------
schema:
  expected_column_count: 9
  unknown_column_action: REJECT_FILE
  missing_column_action: REJECT_FILE
  incompatible_type_change_action: REJECT_FILE

  fields:

    - name: planId
      data_type: string
      logical_type: energy_plan_identifier
      required: true
      nullable: false
      accepted:
        regex: '^EPLAN-\d{3}$'
        numeric_suffix_min: 0
        numeric_suffix_max: 29
      example: "EPLAN-007"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_PLAN_ID_NOT_NULL
          type: NOT_NULL
          severity: ERROR
          action: QUARANTINE
          description: "planId must always be present."

        - rule_id: EPL_PLAN_ID_PATTERN
          type: REGEX
          parameters:
            regex: '^EPLAN-\d{3}$'
          severity: ERROR
          action: QUARANTINE
          description: "planId must follow the EPLAN-000 pattern."

        - rule_id: EPL_PLAN_ID_RANGE
          type: REGEX_NUMERIC_COMPONENT_RANGE
          parameters:
            regex: '^EPLAN-(\d{3})$'
            capture_group: 1
            min: 0
            max: 29
          severity: ERROR
          action: QUARANTINE
          description: >
            planId must be between EPLAN-000 and EPLAN-029 in the fixed catalogue.

    - name: brand
      data_type: string
      logical_type: energy_retail_brand_code
      required: true
      nullable: false
      accepted:
        values:
          - EnergyAus
      example: "EnergyAus"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_BRAND_CONSTANT
          type: ACCEPTED_VALUES
          parameters:
            values:
              - EnergyAus
          severity: ERROR
          action: QUARANTINE
          description: "brand must always equal EnergyAus."

    - name: brandName
      data_type: string
      logical_type: energy_retail_brand_display_name
      required: true
      nullable: false
      accepted:
        values:
          - EnergyAus Australia
      example: "EnergyAus Australia"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_BRAND_NAME_CONSTANT
          type: ACCEPTED_VALUES
          parameters:
            values:
              - EnergyAus Australia
          severity: ERROR
          action: QUARANTINE
          description: "brandName must always equal EnergyAus Australia."

    - name: displayName
      data_type: string
      logical_type: energy_plan_display_name
      required: true
      nullable: false
      accepted:
        documented_plan_type_count: 10
        exact_value_catalogue_status: TBD_FROM_GENERATOR_CONFIG
        documented_examples:
          - Basic Electricity
          - Solar Saver
          - Gas Essential
      example: "Solar Saver"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: CONTENT_SANITISE
      quality_rules:
        - rule_id: EPL_DISPLAY_NAME_NOT_NULL
          type: NOT_NULL
          severity: ERROR
          action: QUARANTINE
          description: "displayName must always be present."

        - rule_id: EPL_DISPLAY_NAME_NON_BLANK
          type: NON_BLANK
          severity: ERROR
          action: QUARANTINE
          description: "displayName must not be empty or whitespace-only."

    - name: fuelType
      data_type: string
      logical_type: energy_fuel_type
      required: true
      nullable: false
      accepted:
        values:
          - ELECTRICITY
          - GAS
          - DUAL
      example: "ELECTRICITY"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_FUEL_TYPE_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - ELECTRICITY
              - GAS
              - DUAL
          severity: ERROR
          action: QUARANTINE
          description: >
            fuelType must be ELECTRICITY, GAS, or DUAL.

    - name: type
      data_type: string
      logical_type: energy_plan_type
      required: true
      nullable: false
      accepted:
        values:
          - STANDING
          - MARKET
          - REGULATED
      example: "MARKET"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_PLAN_TYPE_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - STANDING
              - MARKET
              - REGULATED
          severity: ERROR
          action: QUARANTINE
          description: >
            type must be STANDING, MARKET, or REGULATED.

    - name: customerType
      data_type: string
      logical_type: energy_plan_customer_segment
      required: true
      nullable: false
      accepted:
        values:
          - RESIDENTIAL
          - BUSINESS
      example: "RESIDENTIAL"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_CUSTOMER_TYPE_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - RESIDENTIAL
              - BUSINESS
          severity: ERROR
          action: QUARANTINE
          description: >
            customerType must be RESIDENTIAL or BUSINESS.

    - name: effectiveFrom
      data_type: string
      logical_type: date
      required: true
      nullable: true
      accepted:
        format: ISO_8601_DATE
        generated_start_date: "2022-01-01"
        generated_offset_years_approximate: 3.3
      example: "2024-07-15"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_EFFECTIVE_FROM_PARSEABLE
          type: PARSEABLE_DATE_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: >
            effectiveFrom must be parseable as a date when supplied.

        - rule_id: EPL_EFFECTIVE_FROM_LOWER_BOUND
          type: DATE_RANGE_IF_PRESENT
          parameters:
            min_inclusive: "2022-01-01"
          severity: ERROR
          action: QUARANTINE
          description: >
            effectiveFrom cannot be earlier than the documented generator start date.

    - name: lastUpdated
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
        source_timezone_status: TBD
      example: "2026-06-30T12:10:00Z"
      sensitivity:
        classification: PUBLIC
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: EPL_LAST_UPDATED_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: >
            lastUpdated must be parseable as a timestamp when supplied.

# -----------------------------------------------------------------------------
# 7. Dataset-level quality rules
# -----------------------------------------------------------------------------
dataset_quality_rules:

  - rule_id: EPL_PLAN_ID_UNIQUE
    type: UNIQUE
    columns:
      - planId
    severity: ERROR
    action: QUARANTINE
    description: "planId must be unique within the catalogue file."

  - rule_id: EPL_FIXED_RECORD_COUNT
    type: RECORD_COUNT_EXACT
    parameters:
      expected: 30
    severity: ERROR
    action: REJECT_FILE
    description: >
      The fixed energy-plan catalogue must contain exactly thirty records.

  - rule_id: EPL_PLAN_ID_COMPLETE_SEQUENCE
    type: IDENTIFIER_SEQUENCE_COMPLETE
    parameters:
      column: planId
      regex: '^EPLAN-(\d{3})$'
      capture_group: 1
      expected_min: 0
      expected_max: 29
      comparison_scope: COMPLETE_FILE
    severity: ERROR
    action: REJECT_FILE
    description: >
      The catalogue must contain every plan identifier from EPLAN-000 through
      EPLAN-029 exactly once.

  - rule_id: EPL_EFFECTIVE_FROM_NOT_IN_FUTURE
    type: DATE_NOT_IN_FUTURE
    columns:
      - effectiveFrom
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      effectiveFrom should not be later than the file processing date.

  - rule_id: EPL_LAST_UPDATED_NOT_IN_FUTURE
    type: TIMESTAMP_NOT_IN_FUTURE
    columns:
      - lastUpdated
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      lastUpdated should not be later than the file processing timestamp.

  - rule_id: EPL_LAST_UPDATED_NOT_BEFORE_EFFECTIVE_FROM
    type: TIMESTAMP_NOT_BEFORE_DATE
    parameters:
      timestamp_column: lastUpdated
      date_column: effectiveFrom
      ignore_nulls: true
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      lastUpdated should not normally be earlier than effectiveFrom.

  - rule_id: EPL_FUEL_TYPE_DISTRIBUTION
    type: CATEGORICAL_DISTRIBUTION_TOLERANCE
    parameters:
      column: fuelType
      expected_ratios:
        ELECTRICITY: 0.50
        GAS: 0.30
        DUAL: 0.20
      absolute_tolerance: 0.12
      comparison_scope: COMPLETE_FILE
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      Fuel-type proportions should remain reasonably close to the configured
      fixed-catalogue distribution.

  - rule_id: EPL_PLAN_TYPE_DISTRIBUTION
    type: CATEGORICAL_DISTRIBUTION_TOLERANCE
    parameters:
      column: type
      expected_ratios:
        STANDING: 0.30
        MARKET: 0.50
        REGULATED: 0.20
      absolute_tolerance: 0.12
      comparison_scope: COMPLETE_FILE
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      Plan-type proportions should remain reasonably close to the configured
      fixed-catalogue distribution.

  - rule_id: EPL_CUSTOMER_TYPE_DISTRIBUTION
    type: CATEGORICAL_DISTRIBUTION_TOLERANCE
    parameters:
      column: customerType
      expected_ratios:
        RESIDENTIAL: 0.70
        BUSINESS: 0.30
      absolute_tolerance: 0.12
      comparison_scope: COMPLETE_FILE
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      Customer-segment proportions should remain reasonably close to the
      configured fixed-catalogue distribution.

  - rule_id: EPL_DISPLAY_NAME_CATALOGUE_REVIEW
    type: REFERENCE_CATALOGUE_PENDING
    parameters:
      column: displayName
      documented_count: 10
      source: GENERATOR_CONFIG
      status: TBD_FROM_GENERATOR_CONFIG
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      The source documents ten plan display-name types but does not publish the
      complete list. The exact catalogue must be extracted before approval.

  - rule_id: EPL_NO_GLOBAL_ID
    type: COLUMN_MUST_NOT_EXIST
    parameters:
      column: global_id
    severity: ERROR
    action: REJECT_FILE
    description: >
      energy_plans is a catalogue and must not contain a customer global_id.

  - rule_id: EPL_CHILD_REFERENCE_INTEGRITY
    type: CHILD_FOREIGN_KEY_INTEGRITY
    parameters:
      child_dataset: energy_accounts
      child_column: planId
      parent_column: planId
      ignore_nulls: true
      comparison_scope: COMPLETE_SNAPSHOT
    severity: ERROR
    action: QUARANTINE_CHILD_RECORD
    description: >
      Every populated energy_accounts.planId must exist in the energy_plans catalogue.

  - rule_id: EPL_PLAN_USAGE_MONITORING
    type: PARENT_REFERENCE_USAGE
    parameters:
      child_dataset: energy_accounts
      child_column: planId
      parent_column: planId
      comparison_scope: COMPLETE_SNAPSHOT
      allow_unreferenced_parent_records: true
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      Plan usage may be monitored across energy accounts. Unreferenced catalogue
      plans remain valid and must not be quarantined solely because no account
      currently uses them.

# -----------------------------------------------------------------------------
# 8. File freshness and duplicate-delivery controls
# -----------------------------------------------------------------------------
file_quality_rules:

  - rule_id: EPL_FILE_NON_EMPTY
    type: FILE_SIZE_MIN
    parameters:
      min_bytes: 1
    severity: ERROR
    action: REJECT_FILE
    description: "The delivered CSV file must not be empty."

  - rule_id: EPL_EXACT_COLUMN_COUNT
    type: EXACT_COLUMN_COUNT
    parameters:
      expected: 9
    severity: ERROR
    action: REJECT_FILE
    description: >
      The parsed CSV file must contain exactly nine physical columns.

  - rule_id: EPL_DUPLICATE_FILE_HASH
    type: DUPLICATE_FILE_HASH
    parameters:
      hash_field: sha256
      scope: energy_plans
    severity: WARNING
    action: SKIP_DUPLICATE_DELIVERY
    description: >
      A file with an already processed SHA-256 hash should be treated as a
      duplicate delivery rather than new catalogue data.

  - rule_id: EPL_FILE_FRESHNESS
    type: FILE_MODIFICATION_AGE
    parameters:
      modification_time_field: file_modification_time
      max_age: TBD
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      The energy-plan catalogue freshness SLA must be agreed before the contract
      is promoted to APPROVED.

# -----------------------------------------------------------------------------
# 9. Derived checks for Silver and AI-ready product context
# -----------------------------------------------------------------------------
derived_quality_checks:

  - rule_id: EPL_CURRENTLY_EFFECTIVE_DERIVATION
    type: DERIVED_BOOLEAN
    expression: "effectiveFrom IS NULL OR effectiveFrom <= CURRENT_DATE"
    output_field: is_currently_effective
    description: >
      Silver may derive whether the plan has reached its effective date. The
      source does not contain effectiveTo, so expiry cannot be determined.

  - rule_id: EPL_SAFE_PLAN_PROJECTION
    type: APPROVED_CONTEXT_PROJECTION
    approved_fields:
      - planId
      - brand
      - brandName
      - displayName
      - fuelType
      - type
      - customerType
      - effectiveFrom
      - lastUpdated
      - is_currently_effective
    description: >
      Validated plan attributes may be exposed as governed catalogue context
      after content sanitisation and freshness review.

  - rule_id: EPL_ENERGY_ACCOUNT_ENRICHMENT
    type: APPROVED_REFERENCE_ENRICHMENT
    child_dataset: energy_accounts
    join:
      child_column: planId
      reference_column: planId
    approved_reference_fields:
      - brand
      - brandName
      - displayName
      - fuelType
      - type
      - customerType
    description: >
      Silver may enrich an energy account with approved plan context only after
      its planId foreign key has passed validation.

  - rule_id: EPL_FILE_LINEAGE_PROJECTION
    type: LINEAGE_ENRICHMENT
    output_fields:
      - source_dataset
      - source_file_path
      - source_file_sha256
      - source_record_id
      - pipeline_run_id
      - processed_at
      - dq_status
      - content_sanitisation_status
      - context_version
    description: >
      Curated plan records must retain enough file and record lineage for answer
      verification, freshness review, and audit.

# -----------------------------------------------------------------------------
# 10. Notes for the team
# -----------------------------------------------------------------------------
notes:
  - >
    This contract follows the authoritative physical source schema and includes
    all nine fields defined for energy_plans.
  - >
    energy_plans is one of three catalogue datasets without global_id. It is
    excluded from customer foreign-key integrity validation.
  - >
    energy_accounts.planId is the governed physical reference to this catalogue.
    Display names, brand names, and categories must not be used as replacement
    join keys.
  - >
    The source documents ten plan display-name types but provides only examples.
    The complete display-name catalogue must be copied from the generator rather
    than invented.
  - >
    effectiveFrom is generated from 2022-01-01 with an offset of up to
    approximately 3.3 years. The exact upper-bound date depends on the generator
    implementation and is therefore not enforced as a hard rule.
  - >
    The source contains no effectiveTo date, pricing amount, tariff structure,
    discounts, incentives, fees, terms, or contract-length fields. This contract
    must not imply that those details are available.
  - >
    The CSV parser profile, file freshness SLA, filename convention, source
    timezone, and complete display-name catalogue remain TBD.