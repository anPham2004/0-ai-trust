kind: DataContract
apiVersion: v3.1.0
id: source.database.loan_applications
version: 1.0.0
name: loan_applications
status: draft
domain: LENDING_ORIGINATION
description:
  purpose: |
    Source dataset containing loan applications with customer and optional organisation context, requested lending details, credit score, lifecycle timestamps, final outcome, and offer summary information.
servers:
- server: source-postgresql
  type: postgresql
  host: postgres
  port: 5432
  database: g3_sources
  schema: public
  description: PostgreSQL CDC source via Debezium for loan_applications
  environment: prod
schema:
- name: loan_applications
  logicalType: object
  physicalType: table
  physicalName: public.loan_applications
  relationships:
  - type: foreignKey
    from:
    - loan_applications.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - loan_applications.customerId
    to:
    - customers.customerId
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - loan_applications.organisationId
    to:
    - organisations.organisationId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: LAP_APPLICATION_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: applicationId must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - applicationId
  - id: LAP_CUSTOMER_LINK_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - global_id
      - customerId
    severity: warning
    dimension: completeness
    description: |
      A loan application should identify its customer using both global_id and customerId. The physical schema currently permits null values.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAP_CUSTOMER_IDENTIFIERS_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: customers
        source_columns:
        - global_id
        - customerId
        reference_columns:
        - global_id
        - customerId
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      global_id and customerId must refer to the same customer record.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAP_LAST_UPDATE_NOT_BEFORE_SUBMISSION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: TIMESTAMP_COLUMN_COMPARISON
      parameters:
        left_column: lastUpdatedAt
        operator: GREATER_THAN_OR_EQUAL
        right_column: submittedAt
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      lastUpdatedAt cannot be earlier than submittedAt.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAP_LAST_UPDATE_WITHIN_GENERATOR_WINDOW
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: TIMESTAMP_OFFSET_RANGE
      parameters:
        start_column: submittedAt
        end_column: lastUpdatedAt
        min_seconds: 0
        max_seconds: 15552000
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      The source generator creates lastUpdatedAt no more than 180 days after submittedAt; values outside that window should be investigated.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAP_SUBMISSION_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: TIMESTAMP_NOT_IN_FUTURE
      columns:
      - submittedAt
    severity: error
    dimension: timeliness
    description: |
      submittedAt cannot be later than the pipeline processing timestamp.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAP_ACCEPTED_OFFER_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NOT_NULL
      parameters:
        when:
          column: finalOutcome
          equals: Accepted
        target_column: acceptedOfferAmount
    severity: error
    dimension: consistency
    description: |
      An Accepted application must include acceptedOfferAmount.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAP_ACCEPTED_OFFER_ABSENT_FOR_NON_ACCEPTED
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NULL_EXCEPT_VALUES
      parameters:
        source_column: finalOutcome
        allowed_source_values:
        - Accepted
        target_column: acceptedOfferAmount
    severity: warning
    dimension: consistency
    description: |
      acceptedOfferAmount should normally be null when finalOutcome is not Accepted.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAP_ACCEPTED_APPLICATION_HAS_OFFER
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NUMERIC_MIN
      parameters:
        when:
          column: finalOutcome
          equals: Accepted
        target_column: numOffers
        min: 1
        parse_as: INTEGER
    severity: error
    dimension: consistency
    description: |
      An Accepted application must have at least one offer.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAP_DENIED_OR_CANCELLED_TERMS_NULL
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NULL_FOR_VALUES
      parameters:
        source_column: finalOutcome
        source_values:
        - Denied
        - Cancelled
        target_column: numberOfTerms
    severity: error
    dimension: consistency
    description: |
      numberOfTerms must be null for Denied or Cancelled applications.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: LAP_ACCEPTED_TERMS_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NOT_NULL
      parameters:
        when:
          column: finalOutcome
          equals: Accepted
        target_column: numberOfTerms
    severity: warning
    dimension: consistency
    description: |
      An Accepted application should include numberOfTerms.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAP_ORGANISATION_CUSTOMER_CONTEXT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_RELATIONSHIP_EXISTS_IF_PRESENT
      parameters:
        when_column: organisationId
        relationship_dataset: organisation_party_relationships
        source_mapping:
          global_id: global_id
          organisationId: organisationId
        required_relationship_status:
          column: isActive
          equals: true
    severity: warning
    dimension: consistency
    description: |
      When organisationId is populated, the customer should normally have an active relationship with that organisation.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAP_BUSINESS_GOAL_ORGANISATION_EXPECTED
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NOT_NULL
      parameters:
        when:
          column: loanGoal
          equals: Business goal
        target_column: organisationId
    severity: warning
    dimension: consistency
    description: |
      A Business goal application should normally include organisationId.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: LAP_TOTAL_EVENTS_MATCH_CHILD_COUNT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CHILD_ROW_COUNT_MATCH
      parameters:
        child_dataset: loan_application_events
        parent_key: applicationId
        child_foreign_key: applicationId
        target_count_column: totalEvents
        parse_as: INTEGER
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      In a complete snapshot, totalEvents should match the number of linked loan_application_events records.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: LAP_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: applicationId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^Application_\d{9}$
    examples:
    - Application_000000042
    quality:
    - id: LAP_APPLICATION_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: applicationId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_APPLICATION_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^Application_\d{9}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        applicationId must follow the Application_000000000 pattern.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: loan_application_identifier
  - name: customerId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^CUST-\d{5}$
    examples:
    - CUST-00042
    quality:
    - id: LAP_CUSTOMER_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^CUST-\d{5}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        customerId must follow the CUST-00000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_CUSTOMER_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: customerId
      severity: error
      dimension: consistency
      description: |
        customerId must exist in customers.customerId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: customer_identifier
  - name: loanGoal
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - Home improvement
    quality:
    - id: LAP_LOAN_GOAL_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Home improvement
        - Existing loan takeover
        - Car
        - Business goal
        - Extra spending limit
        - Remaining debt home
        - Tax payments
        - Boat
        - Motorcycle
        - Caravan/Camper
        - Not specified
        - Other
        - Unknown
      mustBe: 0
      severity: error
      dimension: conformity
      description: loanGoal must be one of the supported source values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_PURPOSE_INFORMATION
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: loan_purpose
    - property: g3:accepted
      value:
        values:
        - Home improvement
        - Existing loan takeover
        - Car
        - Business goal
        - Extra spending limit
        - Remaining debt home
        - Tax payments
        - Boat
        - Motorcycle
        - Caravan/Camper
        - Not specified
        - Other
        - Unknown
  - name: applicationType
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - New credit
    quality:
    - id: LAP_APPLICATION_TYPE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - New credit
        - Limit raise
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        applicationType must be New credit or Limit raise.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: application_type
    - property: g3:accepted
      value:
        values:
        - New credit
        - Limit raise
  - name: requestedAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '33000.00'
    quality:
    - id: LAP_REQUESTED_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        requestedAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_REQUESTED_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: |
        requestedAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: creditScore
    logicalType: integer
    physicalType: int32
    required: true
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minimum: 300
      maximum: 1000
    examples:
    - 750
    quality:
    - id: LAP_CREDIT_SCORE_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE
        parameters:
          min: 300
          max: 1000
      severity: error
      dimension: conformity
      description: |
        creditScore must be between 300 and 1000.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_RISK_INFORMATION
        handling: BANKER_ONLY_OR_REDACT
    - property: g3:domainType
      value: credit_score
  - name: finalOutcome
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - Accepted
    quality:
    - id: LAP_FINAL_OUTCOME_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Accepted
        - Denied
        - Cancelled
        - Incomplete
        - Pending
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        finalOutcome must be one of the supported source lifecycle outcomes.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CREDIT_DECISION_INFORMATION
        handling: BANKER_ONLY_OR_RESTRICT
    - property: g3:domainType
      value: application_final_outcome
    - property: g3:accepted
      value:
        values:
        - Accepted
        - Denied
        - Cancelled
        - Incomplete
        - Pending
  - name: submittedAt
    logicalType: timestamp
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-02-14T10:20:00Z'
    quality:
    - id: LAP_SUBMITTED_AT_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: submittedAt must be parseable as a timestamp.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: APPLICATION_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: timestamp
  - name: lastUpdatedAt
    logicalType: timestamp
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-03-20T15:45:00Z'
    quality:
    - id: LAP_LAST_UPDATED_AT_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: lastUpdatedAt must be parseable as a timestamp.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: APPLICATION_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: timestamp
  - name: numOffers
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - '2'
    quality:
    - id: LAP_NUM_OFFERS_INTEGER
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_INTEGER
      severity: error
      dimension: conformity
      description: numOffers must be parseable as an integer.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_NUM_OFFERS_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE
        parameters:
          min: 0
          max: 5
          parse_as: INTEGER
      severity: error
      dimension: conformity
      description: numOffers must be between zero and five.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: integer_count
  - name: acceptedOfferAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '30000.00'
    quality:
    - id: LAP_ACCEPTED_OFFER_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        acceptedOfferAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_ACCEPTED_OFFER_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: |
        acceptedOfferAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: monthlyCost
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '415.70'
    quality:
    - id: LAP_MONTHLY_COST_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        monthlyCost must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_MONTHLY_COST_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: monthlyCost must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: numberOfTerms
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    examples:
    - '60'
    quality:
    - id: LAP_NUMBER_OF_TERMS_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - '12'
        - '24'
        - '36'
        - '48'
        - '60'
        - '72'
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        numberOfTerms must be one of the supported month values when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: term_months
    - property: g3:accepted
      value:
        values:
        - '12'
        - '24'
        - '36'
        - '48'
        - '60'
        - '72'
  - name: totalEvents
    logicalType: string
    physicalType: string
    classification: INTERNAL
    examples:
    - '8'
    quality:
    - id: LAP_TOTAL_EVENTS_INTEGER
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_INTEGER_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        totalEvents must be parseable as an integer when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_TOTAL_EVENTS_RANGE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 3
          max: 15
          parse_as: INTEGER
      severity: error
      dimension: conformity
      description: |
        totalEvents must be between three and fifteen when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: integer_count
  - name: organisationId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^ORG-\d{5}$
    examples:
    - ORG-00042
    quality:
    - id: LAP_ORGANISATION_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^ORG-\d{5}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        organisationId must follow the ORG-00000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: LAP_ORGANISATION_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: organisations
          reference_column: organisationId
      severity: error
      dimension: consistency
      description: |
        organisationId must exist in organisations.organisationId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
