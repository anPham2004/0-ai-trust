- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all sixteen fields defined for loan_applications.
  - |
    The source finalOutcome values are Accepted, Denied, Cancelled, Incomplete, and Pending. Any downstream normalisation to APPROVED, REJECTED, or PENDING belongs in the Silver transformation rather than in this source contract.
