kind: DataContract
apiVersion: v3.1.0
id: source.database.service_cases
version: 1.0.0
name: service_cases
status: draft
domain: CUSTOMER_SERVICE
description:
  purpose: |
    Source dataset containing customer service cases with customer, optional organisation, and optional loan-application context. Each record includes case classification, subject, lifecycle status, priority, timestamps, resolution details, assigned team, and a priority-derived SLA deadline.
servers:
- server: source-postgresql
  type: postgresql
  host: postgres
  port: 5432
  database: g3_sources
  schema: public
  description: PostgreSQL CDC source via Debezium for service_cases
  environment: prod
schema:
- name: service_cases
  logicalType: object
  physicalType: table
  physicalName: public.service_cases
  relationships:
  - type: foreignKey
    from:
    - service_cases.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - service_cases.customerId
    to:
    - customers.customerId
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - service_cases.organisationId
    to:
    - organisations.organisationId
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - service_cases.applicationId
    to:
    - loan_applications.applicationId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: SVC_CASE_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: caseId must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - caseId
  - id: SVC_CUSTOMER_LINK_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - global_id
      - customerId
    severity: warning
    dimension: completeness
    description: |
      A service case should identify its customer using both global_id and customerId. The physical schema currently permits null values.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SVC_CUSTOMER_IDENTIFIERS_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: customers
        source_columns:
        - global_id
        - customerId
        reference_columns:
        - global_id
        - customerId
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      global_id and customerId must refer to the same customer record.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_APPLICATION_CUSTOMER_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_TRIPLE_CONSISTENT
      parameters:
        reference_dataset: loan_applications
        source_columns:
        - applicationId
        - global_id
        - customerId
        reference_columns:
        - applicationId
        - global_id
        - customerId
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      When applicationId is populated, the case and application must identify the same customer.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_ORGANISATION_CUSTOMER_CONTEXT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_RELATIONSHIP_EXISTS_IF_PRESENT
      parameters:
        when_column: organisationId
        relationship_dataset: organisation_party_relationships
        source_mapping:
          global_id: global_id
          organisationId: organisationId
        required_relationship_status:
          column: isActive
          equals: true
    severity: warning
    dimension: consistency
    description: |
      When organisationId is populated, the customer should normally have an active relationship with that organisation.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SVC_APPLICATION_ORGANISATION_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_COLUMN_EQUAL_IF_BOTH_PRESENT
      parameters:
        reference_dataset: loan_applications
        source_key:
          applicationId: applicationId
        source_column: organisationId
        reference_column: organisationId
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      When both applicationId and organisationId are populated, the case organisation should normally match the application organisation.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: SVC_RESOLVED_NOT_BEFORE_CREATED
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: TIMESTAMP_COLUMN_COMPARISON
      parameters:
        left_column: resolvedAt
        operator: GREATER_THAN_OR_EQUAL
        right_column: createdAt
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: resolvedAt cannot be earlier than createdAt.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_OPEN_CASE_RESOLUTION_FIELDS_NULL
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_ALL_NULL_FOR_VALUES
      parameters:
        source_column: status
        source_values:
        - open
        - in_progress
        target_columns:
        - resolvedAt
        - resolutionSummary
    severity: error
    dimension: consistency
    description: |
      Open or in-progress cases must not contain resolution timestamps or resolution summaries in the current source model.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_COMPLETED_CASE_RESOLUTION_FIELDS_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_ALL_NOT_NULL_FOR_VALUES
      parameters:
        source_column: status
        source_values:
        - resolved
        - closed
        target_columns:
        - resolvedAt
        - resolutionSummary
    severity: error
    dimension: consistency
    description: |
      Resolved or closed cases must contain both resolvedAt and resolutionSummary.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_CREATED_AT_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: TIMESTAMP_NOT_IN_FUTURE
      columns:
      - createdAt
    severity: error
    dimension: timeliness
    description: |
      createdAt cannot be later than the pipeline processing timestamp.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_SLA_DEADLINE_AFTER_CREATION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: TIMESTAMP_COLUMN_COMPARISON
      parameters:
        left_column: slaDeadline
        operator: GREATER_THAN
        right_column: createdAt
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: slaDeadline must be later than createdAt.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_SLA_DEADLINE_FORMULA
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_TIMESTAMP_OFFSET_MATCH
      parameters:
        start_column: createdAt
        target_column: slaDeadline
        selector_column: priority
        offset_days:
          critical: 1
          high: 3
          medium: 5
          low: 10
        tolerance_seconds: 1
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      slaDeadline must equal createdAt plus the priority-specific SLA: critical one day, high three days, medium five days, or low ten days.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: SVC_SLA_DEADLINE_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      Every service case should contain a priority-derived SLA deadline. The physical schema currently permits slaDeadline to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - slaDeadline
  - id: SVC_POSSIBLE_DUPLICATE_CASE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: COMPOSITE_DUPLICATE_DETECTION
      parameters:
        ignore_nulls: true
      columns:
      - global_id
      - caseType
      - subject
      - createdAt
    severity: warning
    dimension: consistency
    description: |
      Cases with the same customer, type, subject, and creation timestamp may represent duplicate ingestion.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: SVC_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SVC_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: caseId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - aa1718d4-623d-4da0-a3d9-b1f2df832cd8
    quality:
    - id: SVC_CASE_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: caseId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SVC_CASE_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: caseId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: service_case_identifier
  - name: customerId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^CUST-\d{5}$
    examples:
    - CUST-00042
    quality:
    - id: SVC_CUSTOMER_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^CUST-\d{5}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        customerId must follow the CUST-00000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SVC_CUSTOMER_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: customerId
      severity: error
      dimension: consistency
      description: |
        customerId must exist in customers.customerId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: customer_identifier
  - name: caseType
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - complaint
    quality:
    - id: SVC_CASE_TYPE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - inquiry
        - request
        - complaint
        - dispute
      mustBe: 0
      severity: error
      dimension: conformity
      description: caseType must be one of the supported source values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: service_case_type
    - property: g3:accepted
      value:
        values:
        - inquiry
        - request
        - complaint
        - dispute
  - name: subject
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
      maxLength: 500
    examples:
    - Customer disputes an unfamiliar card transaction.
    quality:
    - id: SVC_SUBJECT_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: subject must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_SERVICE_FREE_TEXT
        handling: REDACT_OR_BANKER_ONLY
    - property: g3:domainType
      value: service_case_subject
  - name: status
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - open
    quality:
    - id: SVC_STATUS_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - resolved
        - closed
        - open
        - in_progress
      mustBe: 0
      severity: error
      dimension: conformity
      description: status must be one of the supported lifecycle values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: service_case_status
    - property: g3:accepted
      value:
        values:
        - resolved
        - closed
        - open
        - in_progress
  - name: priority
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - high
    quality:
    - id: SVC_PRIORITY_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - critical
        - high
        - medium
        - low
      mustBe: 0
      severity: error
      dimension: conformity
      description: priority must be one of the supported source values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: service_case_priority
    - property: g3:accepted
      value:
        values:
        - critical
        - high
        - medium
        - low
  - name: createdAt
    logicalType: timestamp
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-05-12T10:15:00Z'
    quality:
    - id: SVC_CREATED_AT_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: createdAt must be parseable as a timestamp.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_SERVICE_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: timestamp
  - name: resolvedAt
    logicalType: timestamp
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-05-15T14:40:00Z'
    quality:
    - id: SVC_RESOLVED_AT_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: resolvedAt must be parseable as a timestamp.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_SERVICE_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: timestamp
  - name: resolutionSummary
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
      maxLength: 4000
    examples:
    - The disputed transaction was investigated and the customer was advised.
    quality:
    - id: SVC_RESOLUTION_SUMMARY_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: |
        resolutionSummary must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_SERVICE_FREE_TEXT
        handling: REDACT_OR_BANKER_ONLY
    - property: g3:domainType
      value: service_case_resolution_summary
  - name: assignedTeam
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - Complaints
    quality:
    - id: SVC_ASSIGNED_TEAM_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Support
        - Complaints
        - Escalations
        - Fraud
      mustBe: 0
      severity: error
      dimension: conformity
      description: assignedTeam must be one of the supported source teams.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: service_team
    - property: g3:accepted
      value:
        values:
        - Support
        - Complaints
        - Escalations
        - Fraud
  - name: organisationId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^ORG-\d{5}$
    examples:
    - ORG-00042
    quality:
    - id: SVC_ORGANISATION_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^ORG-\d{5}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        organisationId must follow the ORG-00000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SVC_ORGANISATION_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: organisations
          reference_column: organisationId
      severity: error
      dimension: consistency
      description: |
        organisationId must exist in organisations.organisationId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: organisation_identifier
  - name: applicationId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^Application_\d{9}$
    examples:
    - Application_000000042
    quality:
    - id: SVC_APPLICATION_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^Application_\d{9}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        applicationId must follow the Application_000000000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: SVC_APPLICATION_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: loan_applications
          reference_column: applicationId
      severity: error
      dimension: consistency
      description: |
        applicationId must exist in loan_applications.applicationId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: loan_application_identifier
  - name: slaDeadline
    logicalType: timestamp
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: ISO_8601_TIMESTAMP
    examples:
    - '2026-05-15T10:15:00Z'
    quality:
    - id: SVC_SLA_DEADLINE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_TIMESTAMP_IF_PRESENT
      severity: error
      dimension: conformity
      description: slaDeadline must be parseable as a timestamp.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: timestamp
customProperties:
- property: g3:source
  value:
    category: DATABASE
    system_type: POSTGRESQL
    source_object: public.service_cases
    authoritative: true
- property: g3:ingestion
  value:
    mechanism: DEBEZIUM_CDC
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/cdc/service_cases/
      immutable: true
    bronze_target: bronze.cdc_service_cases
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 800
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/service_cases
- property: g3:derivedQualityChecks
  value:
  - rule_id: SVC_SLA_BREACH_DERIVATION
    type: DERIVED_BOOLEAN
    expression: |
      CURRENT_TIMESTAMP > slaDeadline AND status IN ('open', 'in_progress')
    output_field: is_sla_breached
    description: |
      Silver may derive is_sla_breached for open and in-progress cases whose SLA deadline has passed.
  - rule_id: SVC_BUSINESS_CASE_DERIVATION
    type: DERIVED_BOOLEAN
    expression: organisationId IS NOT NULL
    output_field: is_business_case
    description: |
      Silver may derive is_business_case from the presence of organisationId.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all fourteen fields defined for service_cases.
  - |
    subject and resolutionSummary are unrestricted free-text fields and may contain names, account details, application details, or other sensitive information. They must be redacted or restricted before AI consumption.
  - |
    The source assigns SLA deadlines from priority: critical plus one day, high plus three days, medium plus five days, and low plus ten days.
  - |
    The Silver design derives is_sla_breached using the SLA deadline and the open or in-progress status values.
  - |
    Application and organisation consistency rules preserve customer-centric context when a case is linked to a loan application or business entity.
  - The maximum lengths for subject and resolutionSummary are proposed contract limits because the source schema does not
    define exact maximum lengths.
