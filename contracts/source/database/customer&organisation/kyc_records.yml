# =============================================================================
# DATA CONTRACT: kyc_records
# =============================================================================
# Purpose:
# - Stores Know Your Customer (KYC) verification information for people.
# - Stores Know Your Business (KYB) information when organisationId is present.
# - Supports identity verification, review scheduling, and risk-related checks.
#
# Important distinction:
# - organisationId is null  -> the record represents personal KYC.
# - organisationId is set   -> the record also contains KYB information.
#
# Quick guide:
# - required: the source column must exist.
# - nullable: the field value may be null.
# - ERROR + QUARANTINE: do not send the record to the trusted output.
# - WARNING + ALLOW_WITH_WARNING: keep the record but report the issue.
# =============================================================================

contract_version: "1.0.0"
contract_id: "source.database.kyc_records"

# -----------------------------------------------------------------------------
# 1. Basic dataset information
# -----------------------------------------------------------------------------
dataset:
  name: kyc_records
  domain: CUSTOMER_AND_ORGANISATION
  description: >
    One-to-one source dataset containing customer identity verification
    information. When organisationId is populated, the record also includes
    Know Your Business checks for the linked organisation.
  expected_rows_scale_1: 1000
  physical_schema_ref: "dev-tools/datagen/output/master-schema.json#/kyc_records"

# -----------------------------------------------------------------------------
# 2. Ownership and contract lifecycle
# -----------------------------------------------------------------------------
lifecycle:
  # DRAFT -> IN_REVIEW -> APPROVED -> DEPRECATED / RETIRED
  status: DRAFT
  owner: TBD
  approver: TBD
  effective_from: null

# -----------------------------------------------------------------------------
# 3. Source and ingestion information
# -----------------------------------------------------------------------------
source:
  category: DATABASE
  system_type: POSTGRESQL
  source_object: "public.kyc_records"
  authoritative: true

ingestion:
  mechanism: DEBEZIUM_CDC
  transport: APACHE_KAFKA

  landing:
    format: JSONL
    path_template: "s3://<bucket>/bronze/landing/cdc/kyc_records/"
    immutable: true

  bronze_target: "bronze.cdc_changes"

  cdc:
    supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE

    ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset

# -----------------------------------------------------------------------------
# 4. Keys and relationships
# -----------------------------------------------------------------------------
keys:
  primary_key:
    - kycId

  # The source is generated as one KYC record per customer.
  alternate_keys:
    - global_id
    - customerId

  foreign_keys:
    - columns:
        - global_id
      reference:
        dataset: customers
        columns:
          - global_id
      nullable: true

    - columns:
        - customerId
      reference:
        dataset: customers
        columns:
          - customerId
      nullable: true

    - columns:
        - organisationId
      reference:
        dataset: organisations
        columns:
          - organisationId
      nullable: true

# -----------------------------------------------------------------------------
# 5. Field-level contract
# -----------------------------------------------------------------------------
schema:
  fields:

    - name: global_id
      data_type: string
      logical_type: person_identifier
      required: true
      nullable: true
      accepted:
        format: UUID
      example: "65df84b8-4274-4dbd-9667-6c9967ae6538"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: KYC_GLOBAL_ID_UUID
          type: FORMAT_IF_PRESENT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "global_id must be a valid UUID when supplied."

        - rule_id: KYC_GLOBAL_ID_CUSTOMER_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: customers
            reference_column: global_id
          severity: ERROR
          action: QUARANTINE
          description: >
            global_id must exist in customers.global_id when supplied.

    - name: customerId
      data_type: string
      logical_type: customer_identifier
      required: true
      nullable: true
      accepted:
        regex: '^CUST-\d{5}$'
      example: "CUST-00042"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: KYC_CUSTOMER_ID_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^CUST-\d{5}$'
          severity: ERROR
          action: QUARANTINE
          description: >
            customerId must follow the CUST-00000 pattern when supplied.

        - rule_id: KYC_CUSTOMER_ID_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: customers
            reference_column: customerId
          severity: ERROR
          action: QUARANTINE
          description: >
            customerId must exist in customers.customerId when supplied.

    - name: kycId
      data_type: string
      logical_type: kyc_record_identifier
      required: true
      nullable: false
      accepted:
        format: UUID
      example: "3f4c9d89-1eb9-4a49-b3ab-017c58d95cc1"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: KYC_ID_NOT_NULL
          type: NOT_NULL
          severity: ERROR
          action: QUARANTINE
          description: "kycId must always be present."

        - rule_id: KYC_ID_UUID
          type: FORMAT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "kycId must be a valid UUID."

    - name: verificationStatus
      data_type: string
      logical_type: verification_status
      required: true
      nullable: false
      accepted:
        values:
          - VERIFIED
          - PENDING
          - FAILED
          - EXPIRED
      example: "VERIFIED"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_VERIFICATION_STATUS_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - VERIFIED
              - PENDING
              - FAILED
              - EXPIRED
          severity: ERROR
          action: QUARANTINE
          description: >
            verificationStatus must be one of the supported source values.

    - name: verificationDate
      data_type: string
      logical_type: date
      required: true
      nullable: true
      accepted:
        format: ISO_8601_DATE
      example: "2025-03-12"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_VERIFICATION_DATE_PARSEABLE
          type: PARSEABLE_DATE_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "verificationDate must be parseable as a date."

    - name: verificationMethod
      data_type: string
      logical_type: verification_method
      required: true
      nullable: false
      accepted:
        values:
          - DOCUMENT
          - ELECTRONIC
          - IN_PERSON
          - VIDEO
      example: "ELECTRONIC"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_VERIFICATION_METHOD_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - DOCUMENT
              - ELECTRONIC
              - IN_PERSON
              - VIDEO
          severity: ERROR
          action: QUARANTINE
          description: >
            verificationMethod must be one of the supported source values.

    - name: riskRating
      data_type: string
      logical_type: customer_risk_rating
      required: true
      nullable: false
      accepted:
        values:
          - LOW
          - MEDIUM
          - HIGH
          - VERY_HIGH
      example: "LOW"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: RISK_AND_COMPLIANCE_INFORMATION
        handling: REDACT_OR_BANKER_ONLY
      quality_rules:
        - rule_id: KYC_RISK_RATING_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - LOW
              - MEDIUM
              - HIGH
              - VERY_HIGH
          severity: ERROR
          action: QUARANTINE
          description: "riskRating must be one of the supported source values."

    - name: pepStatus
      data_type: bool
      logical_type: politically_exposed_person_flag
      required: true
      nullable: false
      accepted:
        values:
          - true
          - false
      example: false
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: RISK_AND_COMPLIANCE_INFORMATION
        handling: REDACT_OR_BANKER_ONLY
      quality_rules:
        - rule_id: KYC_PEP_STATUS_BOOLEAN
          type: BOOLEAN
          severity: ERROR
          action: QUARANTINE
          description: "pepStatus must be a boolean value."

    - name: sanctionsCheck
      data_type: string
      logical_type: sanctions_check_status
      required: true
      nullable: false
      accepted:
        values:
          - CLEAR
          - MATCH
          - PENDING
      example: "CLEAR"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: RISK_AND_COMPLIANCE_INFORMATION
        handling: REDACT_OR_BANKER_ONLY
      quality_rules:
        - rule_id: KYC_SANCTIONS_CHECK_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - CLEAR
              - MATCH
              - PENDING
          severity: ERROR
          action: QUARANTINE
          description: >
            sanctionsCheck must be one of the supported source values.

    - name: lastReviewDate
      data_type: string
      logical_type: date
      required: true
      nullable: true
      accepted:
        format: ISO_8601_DATE
      example: "2025-06-10"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_LAST_REVIEW_DATE_PARSEABLE
          type: PARSEABLE_DATE_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "lastReviewDate must be parseable as a date."

    - name: nextReviewDate
      data_type: string
      logical_type: date
      required: true
      nullable: true
      accepted:
        format: ISO_8601_DATE
      example: "2026-06-10"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_NEXT_REVIEW_DATE_PARSEABLE
          type: PARSEABLE_DATE_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "nextReviewDate must be parseable as a date."

    - name: documentTypes
      data_type: string
      logical_type: comma_separated_document_type_list
      required: true
      nullable: true
      accepted:
        delimiter: ","
        minimum_items: 2
        maximum_items: 4
        item_values:
          - passport
          - drivers_licence
          - medicare_card
          - utility_bill
          - bank_statement
          - birth_certificate
      example: "passport,drivers_licence,utility_bill"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: IDENTITY_DOCUMENT_INFORMATION
        handling: REDACT_OR_BANKER_ONLY
      quality_rules:
        - rule_id: KYC_DOCUMENT_TYPES_LIST
          type: DELIMITED_ACCEPTED_VALUES_IF_PRESENT
          parameters:
            delimiter: ","
            minimum_items: 2
            maximum_items: 4
            values:
              - passport
              - drivers_licence
              - medicare_card
              - utility_bill
              - bank_statement
              - birth_certificate
          severity: WARNING
          action: ALLOW_WITH_WARNING
          description: >
            documentTypes should contain two to four supported document types.

    - name: organisationId
      data_type: string
      logical_type: organisation_identifier
      required: true
      nullable: true
      accepted:
        regex: '^ORG-\d{5}$'
      example: "ORG-00042"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: KYC_ORGANISATION_ID_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^ORG-\d{5}$'
          severity: ERROR
          action: QUARANTINE
          description: >
            organisationId must follow the ORG-00000 pattern when supplied.

        - rule_id: KYC_ORGANISATION_ID_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: organisations
            reference_column: organisationId
          severity: ERROR
          action: QUARANTINE
          description: >
            organisationId must exist in organisations.organisationId when supplied.

    - name: abnVerified
      data_type: bool
      logical_type: abn_verification_flag
      required: true
      nullable: true
      accepted:
        values:
          - true
          - false
      example: true
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_ABN_VERIFIED_BOOLEAN
          type: BOOLEAN_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "abnVerified must be a boolean value when supplied."

    - name: asicCheckStatus
      data_type: string
      logical_type: asic_check_status
      required: true
      nullable: true
      accepted:
        values:
          - CURRENT
          - PENDING
          - DEREGISTERED
      example: "CURRENT"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_ASIC_CHECK_STATUS_ENUM
          type: ACCEPTED_VALUES_IF_PRESENT
          parameters:
            values:
              - CURRENT
              - PENDING
              - DEREGISTERED
          severity: ERROR
          action: QUARANTINE
          description: >
            asicCheckStatus must be one of the supported source values when supplied.

    - name: beneficialOwnershipVerified
      data_type: bool
      logical_type: beneficial_ownership_verification_flag
      required: true
      nullable: true
      accepted:
        values:
          - true
          - false
      example: true
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: KYC_BENEFICIAL_OWNERSHIP_BOOLEAN
          type: BOOLEAN_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: >
            beneficialOwnershipVerified must be a boolean value when supplied.

# -----------------------------------------------------------------------------
# 6. Dataset-level quality rules
# -----------------------------------------------------------------------------
dataset_quality_rules:

  - rule_id: KYC_ID_UNIQUE
    type: UNIQUE
    columns:
      - kycId
    severity: ERROR
    action: QUARANTINE
    description: "kycId must be unique across the dataset."

  - rule_id: KYC_GLOBAL_ID_UNIQUE_IF_PRESENT
    type: UNIQUE_IF_PRESENT
    columns:
      - global_id
    severity: ERROR
    action: QUARANTINE
    description: >
      The source is generated as one KYC record per customer, so a populated
      global_id must not appear in multiple KYC records.

  - rule_id: KYC_CUSTOMER_ID_UNIQUE_IF_PRESENT
    type: UNIQUE_IF_PRESENT
    columns:
      - customerId
    severity: ERROR
    action: QUARANTINE
    description: >
      The source is generated as one KYC record per customer, so a populated
      customerId must not appear in multiple KYC records.

  - rule_id: KYC_CUSTOMER_LINK_PRESENT
    type: ALL_NOT_NULL
    columns:
      - global_id
      - customerId
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A KYC record should identify its customer using both global_id and
      customerId. The physical schema currently permits null values.

  - rule_id: KYC_VERIFIED_DATE_PRESENT
    type: CONDITIONAL_NOT_NULL
    parameters:
      when:
        column: verificationStatus
        equals: VERIFIED
      target_column: verificationDate
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A VERIFIED record should include the date on which verification occurred.

  - rule_id: KYC_LAST_REVIEW_NOT_BEFORE_VERIFICATION
    type: COLUMN_COMPARISON
    parameters:
      left_column: lastReviewDate
      operator: GREATER_THAN_OR_EQUAL
      right_column: verificationDate
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      lastReviewDate cannot be earlier than verificationDate.

  - rule_id: KYC_NEXT_REVIEW_AFTER_LAST_REVIEW
    type: COLUMN_COMPARISON
    parameters:
      left_column: nextReviewDate
      operator: GREATER_THAN
      right_column: lastReviewDate
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      nextReviewDate must be later than lastReviewDate.

  - rule_id: KYC_KYB_FIELDS_PRESENT_FOR_ORGANISATION
    type: CONDITIONAL_ALL_NOT_NULL
    parameters:
      when:
        column: organisationId
        operator: IS_NOT_NULL
      target_columns:
        - abnVerified
        - asicCheckStatus
        - beneficialOwnershipVerified
    severity: ERROR
    action: QUARANTINE
    description: >
      When organisationId is present, all three KYB verification fields must
      also be present.

  - rule_id: KYC_KYB_FIELDS_NULL_WITHOUT_ORGANISATION
    type: CONDITIONAL_ALL_NULL
    parameters:
      when:
        column: organisationId
        operator: IS_NULL
      target_columns:
        - abnVerified
        - asicCheckStatus
        - beneficialOwnershipVerified
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      When organisationId is absent, the organisation-specific KYB fields
      should normally be null.

# -----------------------------------------------------------------------------
# 7. Notes for the team
# -----------------------------------------------------------------------------
notes:
  - >
    This contract describes the raw source fields. Silver may derive a
    record_type value of KYC or KYB from the presence of organisationId.
  - >
    riskRating, pepStatus, sanctionsCheck, and documentTypes are highly
    sensitive compliance information and must not be exposed to Customer.AI.
  - >
    The source schema states that abnVerified, asicCheckStatus, and
    beneficialOwnershipVerified are populated only when organisationId is
    present.
  - >
    Customer-link completeness is currently a warning because global_id and
    customerId are physically nullable, even though the dataset is described
    as one-to-one with customers.