kind: DataContract
apiVersion: v3.1.0
id: source.database.physical_addresses
version: 1.0.0
name: physical_addresses
status: draft
domain: CUSTOMER_AND_ORGANISATION
description:
  purpose: |
    Source dataset containing customer addresses. Each customer may have multiple addresses with different purposes and either a CDR SimpleAddress representation or an Australia Post PAF representation.
servers:
- server: source-postgresql
  type: postgresql
  host: postgres
  port: 5432
  database: g3_sources
  schema: public
  description: PostgreSQL CDC source via Debezium for physical_addresses
  environment: prod
schema:
- name: physical_addresses
  logicalType: object
  physicalType: table
  physicalName: public.physical_addresses
  relationships:
  - type: foreignKey
    from:
    - physical_addresses.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: ADR_ADDRESS_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: addressId must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - addressId
  - id: ADR_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      An address should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: ADR_SIMPLE_PRESENT_FOR_SIMPLE_TYPE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NOT_NULL
      parameters:
        when:
          column: addressUType
          equals: simple
        target_column: simple
    severity: error
    dimension: consistency
    description: |
      The simple JSON field must be present when addressUType is simple.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ADR_PAF_NULL_FOR_SIMPLE_TYPE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NULL
      parameters:
        when:
          column: addressUType
          equals: simple
        target_column: paf
    severity: warning
    dimension: consistency
    description: |
      The paf field should normally be null when addressUType is simple.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ADR_PAF_PRESENT_FOR_PAF_TYPE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NOT_NULL
      parameters:
        when:
          column: addressUType
          equals: paf
        target_column: paf
    severity: error
    dimension: consistency
    description: |
      The paf JSON field must be present when addressUType is paf.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ADR_SIMPLE_NULL_FOR_PAF_TYPE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NULL
      parameters:
        when:
          column: addressUType
          equals: paf
        target_column: simple
    severity: warning
    dimension: consistency
    description: |
      The simple field should normally be null when addressUType is paf.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ADR_CORE_ADDRESS_COMPONENT_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ANY_PRESENT
      columns:
      - addressLine1
      - suburb
      - postcode
      - simple
      - paf
    severity: warning
    dimension: completeness
    description: |
      At least one core address component or structured address object should be present.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: ADR_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ADR_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: addressId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - c4e2d18a-e719-446f-9e37-2f26a8bb7cf5
    quality:
    - id: ADR_ADDRESS_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: addressId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ADR_ADDRESS_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: addressId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: address_identifier
  - name: purpose
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - REGISTERED
    quality:
    - id: ADR_PURPOSE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - REGISTERED
        - MAIL
        - WORK
        - OTHER
      mustBe: 0
      severity: error
      dimension: conformity
      description: purpose must be one of the supported address purposes.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: address_purpose
    - property: g3:accepted
      value:
        values:
        - REGISTERED
        - MAIL
        - WORK
        - OTHER
  - name: addressUType
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - simple
    quality:
    - id: ADR_ADDRESS_TYPE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - simple
        - paf
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        addressUType must identify either the simple or paf address format.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: address_representation_type
    - property: g3:accepted
      value:
        values:
        - simple
        - paf
  - name: addressLine1
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
      maxLength: 250
    examples:
    - 42 Harbour Street
    quality:
    - id: ADR_ADDRESS_LINE_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: addressLine1 must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: PRECISE_ADDRESS_INFORMATION
        handling: MASK_OR_REDACT
    - property: g3:domainType
      value: street_address
  - name: suburb
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
      maxLength: 120
    examples:
    - Melbourne
    quality:
    - id: ADR_SUBURB_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: suburb must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LOCATION_INFORMATION
        handling: GENERALISE_OR_RESTRICT
    - property: g3:domainType
      value: suburb_name
  - name: state
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - VIC
    quality:
    - id: ADR_STATE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - NSW
        - VIC
        - QLD
        - WA
        - SA
        - TAS
        - ACT
        - NT
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        state must be a supported Australian state or territory code.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: australian_state_code
    - property: g3:accepted
      value:
        values:
        - NSW
        - VIC
        - QLD
        - WA
        - SA
        - TAS
        - ACT
        - NT
  - name: postcode
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^\d{4}$
    examples:
    - '3000'
    quality:
    - id: ADR_POSTCODE_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^\d{4}$
      mustBe: 0
      severity: warning
      dimension: conformity
      description: |
        postcode should contain four digits when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: LOCATION_INFORMATION
        handling: GENERALISE_OR_RESTRICT
    - property: g3:domainType
      value: postal_code
  - name: country
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - AU
    quality:
    - id: ADR_COUNTRY_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - AU
        - NZ
      mustBe: 0
      severity: error
      dimension: conformity
      description: country must be AU or NZ in the current mock-data scope.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: country_code
    - property: g3:accepted
      value:
        values:
        - AU
        - NZ
  - name: simple
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_OBJECT
    examples:
    - '{"addressLine1":"42 Harbour Street","city":"Melbourne","state":"VIC","postcode":"3000"}'
    quality:
    - id: ADR_SIMPLE_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_OBJECT_IF_PRESENT
      severity: error
      dimension: conformity
      description: simple must be a valid JSON object when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: PRECISE_ADDRESS_INFORMATION
        handling: REDACT_OR_RESTRICT
    - property: g3:domainType
      value: cdr_simple_address_json
  - name: paf
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_OBJECT
    examples:
    - '{"dpid":"12345678","streetName":"Harbour","streetType":"ST","localityName":"MELBOURNE","state":"VIC","postcode":"3000"}'
    quality:
    - id: ADR_PAF_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_OBJECT_IF_PRESENT
      severity: error
      dimension: conformity
      description: paf must be a valid JSON object when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: PRECISE_ADDRESS_INFORMATION
        handling: REDACT_OR_RESTRICT
    - property: g3:domainType
      value: paf_address_json
customProperties:
- property: g3:source
  value:
    category: DATABASE
    system_type: POSTGRESQL
    source_object: public.physical_addresses
    authoritative: true
- property: g3:ingestion
  value:
    mechanism: DEBEZIUM_CDC
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/cdc/physical_addresses/
      immutable: true
    bronze_target: bronze.cdc_physical_addresses
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 2500
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/physical_addresses
- property: g3:notes
  value:
  - |
    This contract describes the raw source address dataset. Exact street-level address information must not be exposed directly to Customer.AI.
  - |
    addressLine1, simple, and paf contain precise address information and must be masked, redacted, or access-restricted in approved downstream outputs.
  - |
    The maximum lengths for addressLine1 and suburb are proposed contract limits because the source schema does not define exact maximum lengths.
  - |
    The postcode rule uses a four-digit pattern because the source generator uses Australian-style postcodes and the current country scope is AU or NZ.
  - The simple and paf conditional rules ensure that the populated structured address field matches addressUType.
