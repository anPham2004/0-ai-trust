# =============================================================================
# DATA CONTRACT: customer_preferences
# =============================================================================
# Purpose:
# - Stores one set of communication and service preferences for each customer.
# - Records the preferred contact channel, preferred language, marketing choice,
#   satisfaction score, and the latest source update time.
#
# Important relationship:
# - This dataset is generated as one-to-one with customers.
# - global_id and customerId should identify the same customer record.
#
# Quick guide:
# - required: the source column must exist.
# - nullable: the field value may be null.
# - ERROR + QUARANTINE: do not send the record to the trusted output.
# - WARNING + ALLOW_WITH_WARNING: keep the record but report the issue.
# =============================================================================

contract_version: "1.0.0"
contract_id: "source.database.customer_preferences"

# -----------------------------------------------------------------------------
# 1. Basic dataset information
# -----------------------------------------------------------------------------
dataset:
  name: customer_preferences
  domain: CUSTOMER
  description: >
    One-to-one source dataset containing each customer's preferred contact
    channel, preferred language, marketing consent choice, satisfaction score,
    and latest update timestamp.
  expected_rows_scale_1: 1000
  physical_schema_ref: "dev-tools/datagen/output/master-schema.json#/customer_preferences"

# -----------------------------------------------------------------------------
# 2. Ownership and contract lifecycle
# -----------------------------------------------------------------------------
lifecycle:
  # DRAFT -> IN_REVIEW -> APPROVED -> DEPRECATED / RETIRED
  status: DRAFT
  owner: TBD
  approver: TBD
  effective_from: null

# -----------------------------------------------------------------------------
# 3. Source and ingestion information
# -----------------------------------------------------------------------------
source:
  category: DATABASE
  system_type: POSTGRESQL
  source_object: "public.customer_preferences"
  authoritative: true

ingestion:
  mechanism: DEBEZIUM_CDC
  transport: APACHE_KAFKA

  landing:
    format: JSONL
    path_template: "s3://<bucket>/bronze/landing/cdc/customer_preferences/"
    immutable: true

  bronze_target: "bronze.cdc_changes"

  cdc:
    supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE

    ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset

# -----------------------------------------------------------------------------
# 4. Keys and relationships
# -----------------------------------------------------------------------------
keys:
  # The source is generated as one preferences record per customer.
  primary_key:
    - global_id

  alternate_keys:
    - customerId

  foreign_keys:
    - columns:
        - global_id
      reference:
        dataset: customers
        columns:
          - global_id
      nullable: true

    - columns:
        - customerId
      reference:
        dataset: customers
        columns:
          - customerId
      nullable: true

# -----------------------------------------------------------------------------
# 5. Field-level contract
# -----------------------------------------------------------------------------
schema:
  fields:

    - name: global_id
      data_type: string
      logical_type: person_identifier
      required: true
      nullable: true
      accepted:
        format: UUID
      example: "65df84b8-4274-4dbd-9667-6c9967ae6538"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: PREF_GLOBAL_ID_UUID
          type: FORMAT_IF_PRESENT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "global_id must be a valid UUID when supplied."

        - rule_id: PREF_GLOBAL_ID_CUSTOMER_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: customers
            reference_column: global_id
          severity: ERROR
          action: QUARANTINE
          description: >
            global_id must exist in customers.global_id when supplied.

    - name: customerId
      data_type: string
      logical_type: customer_identifier
      required: true
      nullable: true
      accepted:
        regex: '^CUST-\d{5}$'
      example: "CUST-00042"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: PREF_CUSTOMER_ID_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^CUST-\d{5}$'
          severity: ERROR
          action: QUARANTINE
          description: >
            customerId must follow the CUST-00000 pattern when supplied.

        - rule_id: PREF_CUSTOMER_ID_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: customers
            reference_column: customerId
          severity: ERROR
          action: QUARANTINE
          description: >
            customerId must exist in customers.customerId when supplied.

    - name: preferredContactChannel
      data_type: string
      logical_type: contact_channel_preference
      required: true
      nullable: false
      accepted:
        values:
          - email
          - phone
          - sms
          - chat
      example: "email"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: PREF_CONTACT_CHANNEL_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - email
              - phone
              - sms
              - chat
          severity: ERROR
          action: QUARANTINE
          description: >
            preferredContactChannel must be one of the supported source values.

    - name: preferredLanguage
      data_type: string
      logical_type: language_preference
      required: true
      nullable: false
      accepted:
        values:
          - en
          - es
          - zh
          - vi
          - fr
          - ko
      example: "en"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: PREF_LANGUAGE_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - en
              - es
              - zh
              - vi
              - fr
              - ko
          severity: ERROR
          action: QUARANTINE
          description: >
            preferredLanguage must be one of the supported source language codes.

    - name: marketingOptIn
      data_type: bool
      logical_type: marketing_consent_flag
      required: true
      nullable: false
      accepted:
        values:
          - true
          - false
      example: true
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: PREF_MARKETING_OPT_IN_BOOLEAN
          type: BOOLEAN
          severity: ERROR
          action: QUARANTINE
          description: "marketingOptIn must be a boolean value."

    - name: satisfactionScore
      data_type: string
      logical_type: decimal_score
      required: true
      nullable: true
      accepted:
        min: 1.0
        max: 5.0
      example: "4.2"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: PREF_SATISFACTION_SCORE_NUMERIC
          type: PARSEABLE_DECIMAL_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: >
            satisfactionScore must be parseable as a decimal number when supplied.

        - rule_id: PREF_SATISFACTION_SCORE_RANGE
          type: RANGE_IF_PRESENT
          parameters:
            min: 1.0
            max: 5.0
          severity: ERROR
          action: QUARANTINE
          description: >
            satisfactionScore must be between 1.0 and 5.0 when supplied.

    - name: updatedAt
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
      example: "2026-06-30T14:15:00Z"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: PREF_UPDATED_AT_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "updatedAt must be parseable as a timestamp."

# -----------------------------------------------------------------------------
# 6. Dataset-level quality rules
# -----------------------------------------------------------------------------
dataset_quality_rules:

  - rule_id: PREF_GLOBAL_ID_UNIQUE_IF_PRESENT
    type: UNIQUE_IF_PRESENT
    columns:
      - global_id
    severity: ERROR
    action: QUARANTINE
    description: >
      The source is generated as one preferences record per customer, so a
      populated global_id must not appear in multiple records.

  - rule_id: PREF_CUSTOMER_ID_UNIQUE_IF_PRESENT
    type: UNIQUE_IF_PRESENT
    columns:
      - customerId
    severity: ERROR
    action: QUARANTINE
    description: >
      The source is generated as one preferences record per customer, so a
      populated customerId must not appear in multiple records.

  - rule_id: PREF_CUSTOMER_LINK_PRESENT
    type: ALL_NOT_NULL
    columns:
      - global_id
      - customerId
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A preferences record should identify its customer using both global_id
      and customerId. The physical schema currently permits null values.

  - rule_id: PREF_CUSTOMER_IDENTIFIERS_CONSISTENT
    type: REFERENCE_PAIR_CONSISTENT
    parameters:
      reference_dataset: customers
      source_columns:
        - global_id
        - customerId
      reference_columns:
        - global_id
        - customerId
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      global_id and customerId must refer to the same row in the customers dataset.

  - rule_id: PREF_UPDATED_AT_NOT_IN_FUTURE
    type: TIMESTAMP_NOT_IN_FUTURE
    columns:
      - updatedAt
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      updatedAt should not be later than the pipeline processing timestamp.

# -----------------------------------------------------------------------------
# 7. Notes for the team
# -----------------------------------------------------------------------------
notes:
  - >
    This contract describes the raw source preferences dataset. It does not
    define how Customer.AI or Banker.AI should apply communication preferences.
  - >
    preferredContactChannel, preferredLanguage, marketingOptIn, and
    satisfactionScore are customer preference attributes and should only be
    exposed to approved downstream consumers.
  - >
    satisfactionScore is physically stored as a string, so the pipeline must
    parse it before applying the numeric range rule.
  - >
    Customer-link completeness is currently a warning because global_id and
    customerId are physically nullable, even though the dataset is generated
    one-to-one with customers.