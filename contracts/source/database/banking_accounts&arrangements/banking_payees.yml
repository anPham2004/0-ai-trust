kind: DataContract
apiVersion: v3.1.0
id: source.database.banking_payees
version: 1.0.0
name: banking_payees
status: draft
domain: BANKING
description:
  purpose: |
    Source dataset containing payees saved by customers. Each record stores the payee type, a customer-facing nickname, a short description, and the payee creation date.
servers:
- server: source-postgresql
  type: postgresql
  description: PostgreSQL CDC source via Debezium for banking_payees
  environment: prod
schema:
- name: banking_payees
  logicalType: object
  physicalType: table
  physicalName: public.banking_payees
  relationships:
  - type: foreignKey
    from:
    - banking_payees.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: PAY_PAYEE_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: payeeId must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - payeeId
  - id: PAY_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A saved payee should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: PAY_CREATION_DATE_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_NOT_IN_FUTURE
      columns:
      - creationDate
    severity: warning
    dimension: timeliness
    description: |
      creationDate should not be later than the pipeline processing date.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: PAY_PAYEE_LABEL_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ANY_NOT_NULL
      columns:
      - nickname
      - description
    severity: warning
    dimension: consistency
    description: |
      At least one of nickname or description should be present so that the saved payee can be understood.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: PAY_POSSIBLE_DUPLICATE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: COMPOSITE_UNIQUE_IF_PRESENT
      columns:
      - global_id
      - nickname
      - type
    severity: warning
    dimension: consistency
    description: |
      The same customer should not normally have duplicate saved payees with the same nickname and type.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: PAY_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: PAY_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: payeeId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - f2699522-a4fd-4ebd-bca0-726b2db83bc2
    quality:
    - id: PAY_PAYEE_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: payeeId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: PAY_PAYEE_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: payeeId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: payee_identifier
  - name: nickname
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
      maxLength: 200
    examples:
    - Southern Utilities
    quality:
    - id: PAY_NICKNAME_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: nickname must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: PAYEE_IDENTITY_INFORMATION
        handling: REDACT_OR_RESTRICT
    - property: g3:domainType
      value: payee_display_name
  - name: type
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - DOMESTIC
    quality:
    - id: PAY_TYPE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - DOMESTIC
        - BILLER
        - INTERNATIONAL
      mustBe: 0
      severity: error
      dimension: conformity
      description: type must be one of the supported payee types.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: payee_type
    - property: g3:accepted
      value:
        values:
        - DOMESTIC
        - BILLER
        - INTERNATIONAL
  - name: description
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      minLength: 1
      maxLength: 500
    examples:
    - Monthly electricity bill payment
    quality:
    - id: PAY_DESCRIPTION_NON_BLANK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: NON_BLANK_IF_PRESENT
      severity: warning
      dimension: completeness
      description: description must not be blank when supplied.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_FINANCIAL_RELATIONSHIP_INFORMATION
        handling: REDACT_OR_RESTRICT
    - property: g3:domainType
      value: payee_description
  - name: creationDate
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2025-11-14'
    quality:
    - id: PAY_CREATION_DATE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: creationDate must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: date
customProperties:
- property: g3:source
  value:
    category: DATABASE
    system_type: POSTGRESQL
    source_object: public.banking_payees
    authoritative: true
- property: g3:ingestion
  value:
    mechanism: DEBEZIUM_CDC
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/cdc/banking_payees/
      immutable: true
    bronze_target: bronze.cdc_changes
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 3000
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/banking_payees
- property: g3:notes
  value:
  - |
    The source schema contains six physical fields and links payees directly to customers rather than to banking accounts.
  - |
    nickname is generated as either a person name or a company name. It can therefore reveal the identity of a customer's payment recipient and is treated as highly confidential.
  - |
    description may reveal the purpose of a customer's financial relationship and must be restricted or redacted before AI consumption.
  - |
    The maximum lengths for nickname and description are proposed contract limits because the source schema does not define exact maximum lengths.
  - The duplicate-payee rule is a warning rather than an error because a customer may intentionally save similar payees.
