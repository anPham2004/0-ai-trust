# =============================================================================
# DATA CONTRACT: banking_direct_debits
# =============================================================================
# Purpose:
# - Stores direct debit arrangements linked to banking accounts.
# - Records the authorised entity, the most recent debit date, and the most
#   recent debit amount for each arrangement.
#
# Important relationship:
# - One banking account may have multiple direct debit arrangements.
# - accountId links each direct debit record to banking_accounts.
#
# Quick guide:
# - required: the source column must exist.
# - nullable: the physical source value may be null.
# - ERROR + QUARANTINE: do not send the record to the trusted output.
# - WARNING + ALLOW_WITH_WARNING: keep the record but report the issue.
# =============================================================================

contract_version: "1.0.0"
contract_id: "source.database.banking_direct_debits"

# -----------------------------------------------------------------------------
# 1. Basic dataset information
# -----------------------------------------------------------------------------
dataset:
  name: banking_direct_debits
  domain: BANKING
  description: >
    Source dataset containing direct debit arrangements associated with
    banking accounts. Each record identifies the authorised entity and the
    latest known debit date and amount.
  expected_rows_scale_1: 2250
  physical_schema_ref: "dev-tools/datagen/output/master-schema.json#/banking_direct_debits"

# -----------------------------------------------------------------------------
# 2. Ownership and contract lifecycle
# -----------------------------------------------------------------------------
lifecycle:
  # DRAFT -> IN_REVIEW -> APPROVED -> DEPRECATED / RETIRED
  status: DRAFT
  owner: TBD
  approver: TBD
  effective_from: null

# -----------------------------------------------------------------------------
# 3. Source and ingestion information
# -----------------------------------------------------------------------------
source:
  category: DATABASE
  system_type: POSTGRESQL
  source_object: "public.banking_direct_debits"
  authoritative: true

ingestion:
  mechanism: DEBEZIUM_CDC
  transport: APACHE_KAFKA

  landing:
    format: JSONL
    path_template: "s3://<bucket>/bronze/landing/cdc/banking_direct_debits/"
    immutable: true

  bronze_target: "bronze.cdc_changes"

  cdc:
    supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE

    ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset

# -----------------------------------------------------------------------------
# 4. Keys and relationships
# -----------------------------------------------------------------------------
keys:
  primary_key:
    - directDebitId

  alternate_keys: []

  foreign_keys:
    - columns:
        - global_id
      reference:
        dataset: customers
        columns:
          - global_id
      nullable: true

    - columns:
        - accountId
      reference:
        dataset: banking_accounts
        columns:
          - accountId
      nullable: true

# -----------------------------------------------------------------------------
# 5. Field-level contract
# -----------------------------------------------------------------------------
schema:
  fields:

    - name: global_id
      data_type: string
      logical_type: person_identifier
      required: true
      nullable: true
      accepted:
        format: UUID
      example: "65df84b8-4274-4dbd-9667-6c9967ae6538"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: DDB_GLOBAL_ID_UUID
          type: FORMAT_IF_PRESENT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "global_id must be a valid UUID when supplied."

        - rule_id: DDB_GLOBAL_ID_CUSTOMER_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: customers
            reference_column: global_id
          severity: ERROR
          action: QUARANTINE
          description: >
            global_id must exist in customers.global_id when supplied.

    - name: accountId
      data_type: string
      logical_type: account_identifier
      required: true
      nullable: true
      accepted:
        format: UUID
      example: "a5ef7c5b-04b6-49fa-8a0a-6b6a86be900f"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: DDB_ACCOUNT_ID_UUID
          type: FORMAT_IF_PRESENT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "accountId must be a valid UUID when supplied."

        - rule_id: DDB_ACCOUNT_ID_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: banking_accounts
            reference_column: accountId
          severity: ERROR
          action: QUARANTINE
          description: >
            accountId must exist in banking_accounts.accountId when supplied.

    - name: directDebitId
      data_type: string
      logical_type: direct_debit_identifier
      required: true
      nullable: false
      accepted:
        format: UUID
      example: "7f2d52af-56c5-49d6-a4de-33f2e5ac3ceb"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: DDB_DIRECT_DEBIT_ID_NOT_NULL
          type: NOT_NULL
          severity: ERROR
          action: QUARANTINE
          description: "directDebitId must always be present."

        - rule_id: DDB_DIRECT_DEBIT_ID_UUID
          type: FORMAT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "directDebitId must be a valid UUID."

    - name: authorisedEntity
      data_type: string
      logical_type: authorised_entity_name
      required: true
      nullable: true
      accepted:
        min_length: 1
        max_length: 250
      example: "Southern Utilities Pty Ltd"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: DDB_AUTHORISED_ENTITY_NON_BLANK
          type: NON_BLANK_IF_PRESENT
          severity: WARNING
          action: ALLOW_WITH_WARNING
          description: >
            authorisedEntity must not be blank when supplied.

    - name: lastDebitDate
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
      example: "2026-06-15T09:45:00Z"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
      quality_rules:
        - rule_id: DDB_LAST_DEBIT_DATE_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: >
            lastDebitDate must be parseable as a timestamp when supplied.

    - name: lastDebitAmount
      data_type: string
      logical_type: decimal_amount
      required: true
      nullable: true
      accepted:
        currency: AUD
        min_exclusive: 0
      example: "129.95"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
      quality_rules:
        - rule_id: DDB_LAST_DEBIT_AMOUNT_DECIMAL
          type: PARSEABLE_DECIMAL_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: >
            lastDebitAmount must be parseable as a decimal amount when supplied.

        - rule_id: DDB_LAST_DEBIT_AMOUNT_POSITIVE
          type: RANGE_IF_PRESENT
          parameters:
            min_exclusive: 0
          severity: ERROR
          action: QUARANTINE
          description: >
            lastDebitAmount must be greater than zero when supplied.

# -----------------------------------------------------------------------------
# 6. Dataset-level quality rules
# -----------------------------------------------------------------------------
dataset_quality_rules:

  - rule_id: DDB_DIRECT_DEBIT_ID_UNIQUE
    type: UNIQUE
    columns:
      - directDebitId
    severity: ERROR
    action: QUARANTINE
    description: >
      directDebitId must be unique across the dataset.

  - rule_id: DDB_ACCOUNT_LINK_PRESENT
    type: NOT_NULL
    columns:
      - accountId
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A direct debit arrangement should identify its banking account. The
      physical schema currently permits accountId to be null.

  - rule_id: DDB_CUSTOMER_LINK_PRESENT
    type: NOT_NULL
    columns:
      - global_id
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A direct debit arrangement should identify its customer. The physical
      schema currently permits global_id to be null.

  - rule_id: DDB_ACCOUNT_CUSTOMER_CONSISTENT
    type: REFERENCE_PAIR_CONSISTENT
    parameters:
      reference_dataset: banking_accounts
      source_columns:
        - accountId
        - global_id
      reference_columns:
        - accountId
        - global_id
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      accountId and global_id must refer to the same banking account record.

  - rule_id: DDB_LAST_DEBIT_FIELDS_COMPLETE
    type: ALL_OR_NONE_NULL
    columns:
      - lastDebitDate
      - lastDebitAmount
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      lastDebitDate and lastDebitAmount should normally be populated together
      or both be null.

  - rule_id: DDB_LAST_DEBIT_DATE_NOT_IN_FUTURE
    type: TIMESTAMP_NOT_IN_FUTURE
    columns:
      - lastDebitDate
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      lastDebitDate should not be later than the pipeline processing timestamp.

  - rule_id: DDB_ACTIVE_ACCOUNT_EXPECTED
    type: REFERENCE_CONDITION
    parameters:
      reference_dataset: banking_accounts
      source_key:
        accountId: accountId
      expected_condition:
        column: isActive
        equals: true
      ignore_missing_reference: false
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      Direct debit arrangements are normally expected to belong to active
      banking accounts.

# -----------------------------------------------------------------------------
# 7. Notes for the team
# -----------------------------------------------------------------------------
notes:
  - >
    This contract describes the raw direct debit source and does not expose the
    exact debit amount to AI-ready outputs.
  - >
    lastDebitAmount must be converted to an approved range bucket or removed
    before downstream AI consumption.
  - >
    authorisedEntity is a business name rather than a direct personal
    identifier, but it still reveals customer financial relationships and is
    therefore treated as confidential.
  - >
    The maximum authorisedEntity length is a proposed contract limit because
    the source schema does not define an exact maximum length.
  - >
    Account-link and customer-link completeness remain warnings because the
    physical schema marks accountId and global_id as nullable.