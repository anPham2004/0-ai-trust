# =============================================================================
# DATA CONTRACT: banking_transactions
# =============================================================================
# Purpose:
# - Stores banking transaction history for each banking account.
# - Includes transaction direction, CDR transaction type, amount, timestamps,
#   merchant context, category, currency, and optional BPAY information.
#
# Important relationship:
# - One banking account may have many transactions.
# - accountId links each transaction to banking_accounts.
# - global_id identifies the customer who owns the linked account.
#
# Quick guide:
# - required: the source column must exist.
# - nullable: the physical source value may be null.
# - ERROR + QUARANTINE: do not send the record to the trusted output.
# - WARNING + ALLOW_WITH_WARNING: keep the record but report the issue.
# =============================================================================

contract_version: "1.0.0"
contract_id: "source.database.banking_transactions"

# -----------------------------------------------------------------------------
# 1. Basic dataset information
# -----------------------------------------------------------------------------
dataset:
  name: banking_transactions
  domain: BANKING
  description: >
    Source dataset containing full banking transaction history with account and
    customer links, debit or credit direction, CDR transaction type, amount,
    timestamps, merchant information, transaction category, currency, and
    optional BPAY and clearing information.
  expected_rows_scale_1: 15000
  physical_schema_ref: "dev-tools/datagen/output/master-schema.json#/banking_transactions"

# -----------------------------------------------------------------------------
# 2. Ownership and contract lifecycle
# -----------------------------------------------------------------------------
lifecycle:
  # DRAFT -> IN_REVIEW -> APPROVED -> DEPRECATED / RETIRED
  status: DRAFT
  owner: TBD
  approver: TBD
  effective_from: null

# -----------------------------------------------------------------------------
# 3. Source and ingestion information
# -----------------------------------------------------------------------------
source:
  category: DATABASE
  system_type: POSTGRESQL
  source_object: "public.banking_transactions"
  authoritative: true

ingestion:
  mechanism: DEBEZIUM_CDC
  transport: APACHE_KAFKA

  landing:
    format: JSONL
    path_template: "s3://<bucket>/bronze/landing/cdc/banking_transactions/"
    immutable: true

  bronze_target: "bronze.cdc_changes"

  cdc:
    supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE

    ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset

# -----------------------------------------------------------------------------
# 4. Keys and relationships
# -----------------------------------------------------------------------------
keys:
  primary_key:
    - transactionId

  alternate_keys: []

  foreign_keys:
    - columns:
        - global_id
      reference:
        dataset: customers
        columns:
          - global_id
      nullable: true

    - columns:
        - accountId
      reference:
        dataset: banking_accounts
        columns:
          - accountId
      nullable: true

# -----------------------------------------------------------------------------
# 5. Field-level contract
# -----------------------------------------------------------------------------
schema:
  fields:

    - name: global_id
      data_type: string
      logical_type: person_identifier
      required: true
      nullable: true
      accepted:
        format: UUID
      example: "65df84b8-4274-4dbd-9667-6c9967ae6538"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: TXN_GLOBAL_ID_UUID
          type: FORMAT_IF_PRESENT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "global_id must be a valid UUID when supplied."

        - rule_id: TXN_GLOBAL_ID_CUSTOMER_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: customers
            reference_column: global_id
          severity: ERROR
          action: QUARANTINE
          description: >
            global_id must exist in customers.global_id when supplied.

    - name: transactionId
      data_type: string
      logical_type: transaction_identifier
      required: true
      nullable: false
      accepted:
        format: UUID
      example: "4b78df48-f1d4-4e7f-8ef8-24ad8034ea9a"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: TXN_ID_NOT_NULL
          type: NOT_NULL
          severity: ERROR
          action: QUARANTINE
          description: "transactionId must always be present."

        - rule_id: TXN_ID_UUID
          type: FORMAT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "transactionId must be a valid UUID."

    - name: accountId
      data_type: string
      logical_type: account_identifier
      required: true
      nullable: true
      accepted:
        format: UUID
      example: "a5ef7c5b-04b6-49fa-8a0a-6b6a86be900f"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: TXN_ACCOUNT_ID_UUID
          type: FORMAT_IF_PRESENT
          parameters:
            format: UUID
          severity: ERROR
          action: QUARANTINE
          description: "accountId must be a valid UUID when supplied."

        - rule_id: TXN_ACCOUNT_ID_FK
          type: FOREIGN_KEY_IF_PRESENT
          parameters:
            reference_dataset: banking_accounts
            reference_column: accountId
          severity: ERROR
          action: QUARANTINE
          description: >
            accountId must exist in banking_accounts.accountId when supplied.

    - name: amount
      data_type: string
      logical_type: decimal_amount
      required: true
      nullable: true
      accepted:
        min_exclusive: 0
      example: "84.75"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
      quality_rules:
        - rule_id: TXN_AMOUNT_DECIMAL
          type: PARSEABLE_DECIMAL_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "amount must be parseable as a decimal when supplied."

        - rule_id: TXN_AMOUNT_POSITIVE
          type: RANGE_IF_PRESENT
          parameters:
            min_exclusive: 0
          severity: ERROR
          action: QUARANTINE
          description: >
            amount must be greater than zero in the current mock-data model.

    - name: transactionType
      data_type: string
      logical_type: transaction_direction
      required: true
      nullable: false
      accepted:
        values:
          - debit
          - credit
      example: "debit"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: TXN_DIRECTION_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - debit
              - credit
          severity: ERROR
          action: QUARANTINE
          description: "transactionType must be debit or credit."

    - name: type
      data_type: string
      logical_type: cdr_transaction_type
      required: true
      nullable: false
      accepted:
        values:
          - PAYMENT
          - DIRECT_DEBIT
          - FEE
          - TRANSFER_OUTGOING
          - TRANSFER_INCOMING
          - INTEREST_PAID
          - OTHER
      example: "PAYMENT"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: TXN_TYPE_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - PAYMENT
              - DIRECT_DEBIT
              - FEE
              - TRANSFER_OUTGOING
              - TRANSFER_INCOMING
              - INTEREST_PAID
              - OTHER
          severity: ERROR
          action: QUARANTINE
          description: "type must be one of the supported CDR transaction types."

    - name: timestamp
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
      example: "2026-06-15T11:20:00Z"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
      quality_rules:
        - rule_id: TXN_TIMESTAMP_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "timestamp must be parseable when supplied."

    - name: description
      data_type: string
      logical_type: transaction_description
      required: true
      nullable: true
      accepted:
        min_length: 1
        max_length: 500
      example: "Harbour Market"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: CUSTOMER_FINANCIAL_RELATIONSHIP_INFORMATION
        handling: REDACT_OR_RESTRICT
      quality_rules:
        - rule_id: TXN_DESCRIPTION_NON_BLANK
          type: NON_BLANK_IF_PRESENT
          severity: WARNING
          action: ALLOW_WITH_WARNING
          description: "description must not be blank when supplied."

    - name: category
      data_type: string
      logical_type: transaction_category
      required: true
      nullable: false
      accepted:
        values:
          - groceries
          - utilities
          - transport
          - dining
          - healthcare
          - entertainment
          - shopping
          - other
      example: "groceries"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: SPENDING_BEHAVIOUR_INFORMATION
        handling: GENERALISE_OR_RESTRICT
      quality_rules:
        - rule_id: TXN_CATEGORY_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - groceries
              - utilities
              - transport
              - dining
              - healthcare
              - entertainment
              - shopping
              - other
          severity: ERROR
          action: QUARANTINE
          description: "category must be one of the supported spending categories."

    - name: status
      data_type: string
      logical_type: transaction_status
      required: true
      nullable: false
      accepted:
        values:
          - POSTED
          - PENDING
      example: "POSTED"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: TXN_STATUS_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - POSTED
              - PENDING
          severity: ERROR
          action: QUARANTINE
          description: "status must be POSTED or PENDING."

    - name: reference
      data_type: string
      logical_type: transaction_reference
      required: true
      nullable: true
      accepted:
        regex: '^\d{9}$'
        blank_allowed: true
      example: "123456789"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_REFERENCE_INFORMATION
        handling: TOKENISE_OR_REDACT
      quality_rules:
        - rule_id: TXN_REFERENCE_PATTERN
          type: REGEX_OR_BLANK_IF_PRESENT
          parameters:
            regex: '^\d{9}$'
          severity: WARNING
          action: ALLOW_WITH_WARNING
          description: >
            reference should contain nine digits or be blank when supplied.

    - name: isDetailAvailable
      data_type: bool
      logical_type: detail_availability_flag
      required: true
      nullable: false
      accepted:
        values:
          - true
          - false
      example: true
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: TXN_DETAIL_AVAILABLE_BOOLEAN
          type: BOOLEAN
          severity: ERROR
          action: QUARANTINE
          description: "isDetailAvailable must be a boolean value."

    - name: postingDateTime
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
      example: "2026-06-15T11:45:00Z"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
      quality_rules:
        - rule_id: TXN_POSTING_TIME_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "postingDateTime must be parseable when supplied."

    - name: valueDateTime
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
      example: "2026-06-15T11:20:00Z"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
      quality_rules:
        - rule_id: TXN_VALUE_TIME_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "valueDateTime must be parseable when supplied."

    - name: executionDateTime
      data_type: string
      logical_type: timestamp
      required: true
      nullable: true
      accepted:
        format: ISO_8601_TIMESTAMP
      example: "2026-06-15T11:20:00Z"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
      quality_rules:
        - rule_id: TXN_EXECUTION_TIME_PARSEABLE
          type: PARSEABLE_TIMESTAMP_IF_PRESENT
          severity: ERROR
          action: QUARANTINE
          description: "executionDateTime must be parseable when supplied."

    - name: currency
      data_type: string
      logical_type: currency_code
      required: true
      nullable: false
      accepted:
        values:
          - AUD
          - USD
          - GBP
          - EUR
          - JPY
      example: "AUD"
      sensitivity:
        classification: INTERNAL
        is_pii: false
        handling: NONE
      quality_rules:
        - rule_id: TXN_CURRENCY_ENUM
          type: ACCEPTED_VALUES
          parameters:
            values:
              - AUD
              - USD
              - GBP
              - EUR
              - JPY
          severity: ERROR
          action: QUARANTINE
          description: "currency must be one of the supported source currencies."

    - name: merchantName
      data_type: string
      logical_type: merchant_name
      required: true
      nullable: true
      accepted:
        min_length: 1
        max_length: 250
      example: "Harbour Market Pty Ltd"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: CUSTOMER_FINANCIAL_RELATIONSHIP_INFORMATION
        handling: REDACT_OR_RESTRICT
      quality_rules:
        - rule_id: TXN_MERCHANT_NAME_NON_BLANK
          type: NON_BLANK_IF_PRESENT
          severity: WARNING
          action: ALLOW_WITH_WARNING
          description: "merchantName must not be blank when supplied."

    - name: merchantCategoryCode
      data_type: string
      logical_type: merchant_category_code
      required: true
      nullable: true
      accepted:
        reference_set: MCC
        exact_mapping_status: TBD_FROM_GENERATOR_CONFIG
      example: "5411"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: true
        pii_type: SPENDING_BEHAVIOUR_INFORMATION
        handling: GENERALISE_OR_RESTRICT
      quality_rules:
        - rule_id: TXN_MCC_REFERENCE
          type: REFERENCE_SET_IF_PRESENT
          parameters:
            reference_set: MCC
          severity: WARNING
          action: ALLOW_WITH_WARNING
          description: >
            merchantCategoryCode should exist in the approved MCC reference set.

    - name: billerCode
      data_type: string
      logical_type: bpay_biller_code
      required: true
      nullable: true
      accepted:
        regex: '^\d{4}$'
      example: "1234"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: BILL_PAYMENT_INFORMATION
        handling: TOKENISE_OR_REDACT
      quality_rules:
        - rule_id: TXN_BILLER_CODE_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^\d{4}$'
          severity: ERROR
          action: QUARANTINE
          description: "billerCode must contain four digits when supplied."

    - name: billerName
      data_type: string
      logical_type: bpay_biller_name
      required: true
      nullable: true
      accepted:
        min_length: 1
        max_length: 250
      example: "Southern Energy"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: BILL_PAYMENT_INFORMATION
        handling: REDACT_OR_RESTRICT
      quality_rules:
        - rule_id: TXN_BILLER_NAME_NON_BLANK
          type: NON_BLANK_IF_PRESENT
          severity: WARNING
          action: ALLOW_WITH_WARNING
          description: "billerName must not be blank when supplied."

    - name: crn
      data_type: string
      logical_type: bpay_customer_reference_number
      required: true
      nullable: true
      accepted:
        regex: '^\d{9}$'
      example: "987654321"
      sensitivity:
        classification: HIGHLY_CONFIDENTIAL
        is_pii: true
        pii_type: FINANCIAL_REFERENCE_INFORMATION
        handling: TOKENISE_OR_REDACT
      quality_rules:
        - rule_id: TXN_CRN_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^\d{9}$'
          severity: ERROR
          action: QUARANTINE
          description: "crn must contain nine digits when supplied."

    - name: apcaNumber
      data_type: string
      logical_type: apca_clearing_code
      required: true
      nullable: true
      accepted:
        regex: '^\d{6}$'
      example: "123456"
      sensitivity:
        classification: CONFIDENTIAL
        is_pii: false
        handling: RESTRICT_ACCESS
      quality_rules:
        - rule_id: TXN_APCA_NUMBER_PATTERN
          type: REGEX_IF_PRESENT
          parameters:
            regex: '^\d{6}$'
          severity: ERROR
          action: QUARANTINE
          description: "apcaNumber must contain six digits when supplied."

# -----------------------------------------------------------------------------
# 6. Dataset-level quality rules
# -----------------------------------------------------------------------------
dataset_quality_rules:

  - rule_id: TXN_ID_UNIQUE
    type: UNIQUE
    columns:
      - transactionId
    severity: ERROR
    action: QUARANTINE
    description: "transactionId must be unique across the dataset."

  - rule_id: TXN_ACCOUNT_LINK_PRESENT
    type: NOT_NULL
    columns:
      - accountId
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A transaction should identify its banking account. The physical schema
      currently permits accountId to be null.

  - rule_id: TXN_CUSTOMER_LINK_PRESENT
    type: NOT_NULL
    columns:
      - global_id
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      A transaction should identify its customer. The physical schema currently
      permits global_id to be null.

  - rule_id: TXN_ACCOUNT_CUSTOMER_CONSISTENT
    type: REFERENCE_PAIR_CONSISTENT
    parameters:
      reference_dataset: banking_accounts
      source_columns:
        - accountId
        - global_id
      reference_columns:
        - accountId
        - global_id
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      accountId and global_id must refer to the same banking account record.

  - rule_id: TXN_TYPE_MATCHES_DIRECTION
    type: CONDITIONAL_ACCEPTED_VALUES
    parameters:
      source_column: transactionType
      mappings:
        debit:
          - PAYMENT
          - DIRECT_DEBIT
          - FEE
          - TRANSFER_OUTGOING
        credit:
          - TRANSFER_INCOMING
          - INTEREST_PAID
          - OTHER
      target_column: type
    severity: ERROR
    action: QUARANTINE
    description: >
      The CDR transaction type must be valid for the debit or credit direction.

  - rule_id: TXN_VALUE_TIME_MATCHES_TIMESTAMP
    type: TIMESTAMP_EQUALITY
    columns:
      - valueDateTime
      - timestamp
    ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      valueDateTime must equal timestamp in the current source model.

  - rule_id: TXN_EXECUTION_TIME_MATCHES_TIMESTAMP
    type: TIMESTAMP_EQUALITY
    columns:
      - executionDateTime
      - timestamp
    ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      executionDateTime must equal timestamp in the current source model.

  - rule_id: TXN_POSTING_TIME_WINDOW
    type: TIMESTAMP_OFFSET_RANGE
    parameters:
      start_column: timestamp
      end_column: postingDateTime
      min_seconds: 0
      max_seconds: 3600
      ignore_nulls: true
    severity: ERROR
    action: QUARANTINE
    description: >
      postingDateTime must be between timestamp and one hour after timestamp.

  - rule_id: TXN_TIMESTAMP_NOT_IN_FUTURE
    type: TIMESTAMP_NOT_IN_FUTURE
    columns:
      - timestamp
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      timestamp should not be later than the pipeline processing timestamp.

  - rule_id: TXN_MERCHANT_NAME_PRESENT_FOR_MERCHANT_TYPES
    type: CONDITIONAL_NOT_NULL_FOR_VALUES
    parameters:
      source_column: type
      source_values:
        - PAYMENT
        - DIRECT_DEBIT
      target_column: merchantName
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      PAYMENT and DIRECT_DEBIT transactions should include merchantName.

  - rule_id: TXN_MERCHANT_NAME_NULL_FOR_NON_MERCHANT_TYPES
    type: CONDITIONAL_NULL_EXCEPT_VALUES
    parameters:
      source_column: type
      allowed_source_values:
        - PAYMENT
        - DIRECT_DEBIT
      target_column: merchantName
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      merchantName should normally be null for non-merchant transaction types.

  - rule_id: TXN_BPAY_FIELDS_COMPLETE
    type: CONDITIONAL_ALL_NOT_NULL
    parameters:
      when:
        column: billerCode
        operator: IS_NOT_NULL
      target_columns:
        - billerName
        - crn
    severity: ERROR
    action: QUARANTINE
    description: >
      When billerCode is present, billerName and crn must also be present.

  - rule_id: TXN_BPAY_FIELDS_NULL_WITHOUT_BILLER
    type: CONDITIONAL_ALL_NULL
    parameters:
      when:
        column: billerCode
        operator: IS_NULL
      target_columns:
        - billerName
        - crn
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      billerName and crn should normally be null when billerCode is absent.

  - rule_id: TXN_DETAIL_FIELDS_EXPECTED_WHEN_AVAILABLE
    type: CONDITIONAL_ANY_NOT_NULL
    parameters:
      when:
        column: isDetailAvailable
        equals: true
      target_columns:
        - description
        - reference
        - merchantName
        - billerCode
        - apcaNumber
    severity: WARNING
    action: ALLOW_WITH_WARNING
    description: >
      When isDetailAvailable is true, at least one detail field should be present.

# -----------------------------------------------------------------------------
# 7. Notes for the team
# -----------------------------------------------------------------------------
notes:
  - >
    This contract follows the latest master schema and includes all twenty-two
    physical fields defined for banking_transactions.
  - >
    amount, description, category, merchantName, biller information, reference,
    and CRN reveal sensitive customer financial behaviour and must not be
    exposed directly to AI-ready outputs.
  - >
    The exact category-to-MCC mapping must be copied from the generator or an
    approved MCC reference before this contract is promoted to APPROVED.
  - >
    The maximum lengths for description, merchantName, and billerName are
    proposed contract limits because the source schema does not define exact
    maximum lengths.
  - >
    Merchant and BPAY completeness rules are derived from the source notes:
    merchantName is populated only for PAYMENT or DIRECT_DEBIT, while billerName
    and crn are populated when a BPAY billerCode is present.