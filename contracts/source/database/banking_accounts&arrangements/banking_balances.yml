kind: DataContract
apiVersion: v3.1.0
id: source.database.banking_balances
version: 1.0.0
name: banking_balances
status: draft
domain: BANKING
description:
  purpose: |
    One-to-one source dataset containing the current monetary position of each banking account, including current balance, available balance, optional credit limits, optional amortised limits, currency, and multi-currency purse information.
servers:
- server: source-postgresql
  type: postgresql
  host: postgres
  port: 5432
  database: g3_sources
  schema: public
  description: PostgreSQL CDC source via Debezium for banking_balances
  environment: prod
schema:
- name: banking_balances
  logicalType: object
  physicalType: table
  physicalName: public.banking_balances
  relationships:
  - type: foreignKey
    from:
    - banking_balances.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - banking_balances.accountId
    to:
    - banking_accounts.accountId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: BAL_ACCOUNT_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: |
      accountId must be unique because banking_balances is one-to-one with banking_accounts.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - accountId
  - id: BAL_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      A balance record should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: BAL_ACCOUNT_CUSTOMER_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: banking_accounts
        source_columns:
        - accountId
        - global_id
        reference_columns:
        - accountId
        - global_id
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      accountId and global_id must refer to the same banking account record.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: BAL_AVAILABLE_NOT_ABOVE_CURRENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: NUMERIC_COLUMN_COMPARISON
      parameters:
        left_column: availableBalance
        operator: LESS_THAN_OR_EQUAL
        right_column: currentBalance
        parse_as: DECIMAL
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      availableBalance cannot exceed currentBalance in the current source model.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: BAL_AT_LEAST_ONE_BALANCE_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ANY_NOT_NULL
      columns:
      - currentBalance
      - availableBalance
    severity: error
    dimension: consistency
    description: |
      At least one of currentBalance or availableBalance must be present.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: BAL_CREDIT_AND_AMORTISED_LIMIT_NOT_BOTH_ZERO
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_NOT_BOTH_EQUAL
      parameters:
        columns:
        - creditLimit
        - amortisedLimit
        disallowed_value: 0
        parse_as: DECIMAL
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      When both optional limit fields are populated, they should not both be zero.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: BAL_PURSES_EXPECTED_TO_BE_RARE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: POPULATION_RATIO_MAX
      parameters:
        column: purses
        condition: IS_NOT_NULL
        max_ratio: 0.1
    severity: warning
    dimension: consistency
    description: |
      Multi-currency purses are generated for approximately five percent of accounts; a ratio above ten percent should be investigated.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: BAL_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: BAL_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: accountId
    logicalType: string
    physicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - a5ef7c5b-04b6-49fa-8a0a-6b6a86be900f
    quality:
    - id: BAL_ACCOUNT_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: |
        accountId is required by the business contract because every balance record must belong to one banking account.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: BAL_ACCOUNT_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: accountId must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: BAL_ACCOUNT_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: banking_accounts
          reference_column: accountId
      severity: error
      dimension: consistency
      description: |
        accountId must exist in banking_accounts.accountId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: account_identifier
  - name: currentBalance
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '18450.75'
    quality:
    - id: BAL_CURRENT_BALANCE_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        currentBalance must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: BAL_CURRENT_BALANCE_NON_NEGATIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 0
      severity: error
      dimension: conformity
      description: |
        currentBalance must not be negative in the current mock-data model.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
  - name: availableBalance
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '17220.40'
    quality:
    - id: BAL_AVAILABLE_BALANCE_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        availableBalance must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: BAL_AVAILABLE_BALANCE_NON_NEGATIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 0
      severity: error
      dimension: conformity
      description: |
        availableBalance must not be negative in the current mock-data model.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
  - name: creditLimit
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '12000.00'
    quality:
    - id: BAL_CREDIT_LIMIT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        creditLimit must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: BAL_CREDIT_LIMIT_NON_NEGATIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 0
      severity: error
      dimension: conformity
      description: creditLimit must not be negative when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
  - name: amortisedLimit
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '8500.00'
    quality:
    - id: BAL_AMORTISED_LIMIT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        amortisedLimit must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: BAL_AMORTISED_LIMIT_NON_NEGATIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 0
      severity: error
      dimension: conformity
      description: amortisedLimit must not be negative when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
  - name: currency
    logicalType: string
    physicalType: string
    required: true
    classification: INTERNAL
    examples:
    - AUD
    quality:
    - id: BAL_CURRENCY_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - AUD
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        currency must be AUD in the current source dataset.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: currency_code
    - property: g3:accepted
      value:
        values:
        - AUD
  - name: purses
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: JSON
    examples:
    - '{"USD":{"balance":"250.00"},"NZD":{"balance":"180.00"}}'
    quality:
    - id: BAL_PURSES_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_IF_PRESENT
      severity: error
      dimension: conformity
      description: purses must contain valid JSON when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: multi_currency_purses_json
    - property: g3:accepted
      value:
        schema_status: TBD_FROM_GENERATOR_CONFIG
customProperties:
- property: g3:source
  value:
    category: DATABASE
    system_type: POSTGRESQL
    source_object: public.banking_balances
    authoritative: true
- property: g3:ingestion
  value:
    mechanism: DEBEZIUM_CDC
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/cdc/banking_balances/
      immutable: true
    bronze_target: bronze.cdc_banking_balances
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 1500
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/banking_balances
- property: g3:notes
  value:
  - |
    This contract follows the current master schema, which contains eight physical fields including amortisedLimit and purses.
  - |
    currentBalance, availableBalance, creditLimit, amortisedLimit, and purses contain highly confidential financial information and must never be exposed as exact values in AI-ready outputs.
  - |
    The Silver layer should convert currentBalance and availableBalance into approved range buckets and retain currency as non-sensitive context.
  - |
    The physical schema marks accountId as nullable, but this contract treats a missing accountId as an error because a balance record without an account cannot satisfy the documented one-to-one relationship.
  - The exact internal JSON structure of purses must be confirmed from the data generator before this contract is promoted
    to APPROVED.
