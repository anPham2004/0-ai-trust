kind: DataContract
apiVersion: v3.1.0
id: source.database.energy_accounts
version: 1.0.0
name: energy_accounts
status: draft
domain: ENERGY
description:
  purpose: |
    Source dataset containing customer energy accounts. Each account is linked to a customer and may reference an energy retail plan. The account acts as the parent entity for energy service points and energy invoices.
servers:
- server: source-postgresql
  type: postgresql
  description: PostgreSQL CDC source via Debezium for energy_accounts
  environment: prod
schema:
- name: energy_accounts
  logicalType: object
  physicalType: table
  physicalName: public.energy_accounts
  relationships:
  - type: foreignKey
    from:
    - energy_accounts.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - energy_accounts.planId
    to:
    - energy_plans.planId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: ENA_ACCOUNT_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: energyAccountId must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - energyAccountId
  - id: ENA_ACCOUNT_NUMBER_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: accountNumber must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - accountNumber
  - id: ENA_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      An energy account should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: ENA_PLAN_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      An energy account should identify its retail plan. The physical schema currently permits planId to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - planId
  - id: ENA_CREATION_DATE_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_NOT_IN_FUTURE
      columns:
      - creationDate
    severity: error
    dimension: timeliness
    description: |
      creationDate cannot be later than the pipeline processing date.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: ENA_ACCOUNT_NUMBER_SEQUENCE_RANGE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REGEX_AND_NUMERIC_COMPONENT_RANGE
      parameters:
        column: accountNumber
        regex: ^EA-(\d{6})$
        capture_group: 1
        min: 0
        max: 1999
    severity: warning
    dimension: consistency
    description: |
      At SCALE=1, the source generator creates account numbers from EA-000000 through EA-001999. Values outside this range should be investigated.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: ENA_CHILD_CUSTOMER_CONSISTENCY
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CHILD_REFERENCE_CUSTOMER_CONSISTENCY
      parameters:
        parent_key: energyAccountId
        parent_customer_column: global_id
        child_datasets:
        - dataset: energy_service_points
          child_key: energyAccountId
          child_customer_column: global_id
        - dataset: energy_invoices
          child_key: energyAccountId
          child_customer_column: global_id
        ignore_nulls: true
        comparison_scope: COMPLETE_SNAPSHOT
    severity: error
    dimension: consistency
    description: |
      Child service-point and invoice records must identify the same customer as their parent energy account.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: ENA_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ENA_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: energyAccountId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 55bf44d5-f544-468c-a822-eb5e26bd2924
    quality:
    - id: ENA_ACCOUNT_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: energyAccountId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ENA_ACCOUNT_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: energyAccountId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: energy_account_identifier
  - name: accountNumber
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^EA-\d{6}$
    examples:
    - EA-000042
    quality:
    - id: ENA_ACCOUNT_NUMBER_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: accountNumber must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ENA_ACCOUNT_NUMBER_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^EA-\d{6}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        accountNumber must follow the EA-000000 pattern.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: UTILITY_ACCOUNT_IDENTIFIER
        handling: TOKENISE_OR_MASK
    - property: g3:domainType
      value: energy_account_number
  - name: displayName
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^Energy Account .+$
      maxLength: 200
    examples:
    - Energy Account 42
    quality:
    - id: ENA_DISPLAY_NAME_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: displayName must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ENA_DISPLAY_NAME_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^Energy Account .+$
      mustBe: 0
      severity: warning
      dimension: conformity
      description: |
        displayName should follow the source generator style Energy Account {id}.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: energy_account_display_name
  - name: openStatus
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - OPEN
    quality:
    - id: ENA_OPEN_STATUS_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - OPEN
        - CLOSED
      mustBe: 0
      severity: error
      dimension: conformity
      description: openStatus must be OPEN or CLOSED.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: energy_account_open_status
    - property: g3:accepted
      value:
        values:
        - OPEN
        - CLOSED
  - name: creationDate
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2024-08-19'
    quality:
    - id: ENA_CREATION_DATE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        creationDate must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: date
  - name: planId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^EPLAN-\d{3}$
    examples:
    - EPLAN-007
    quality:
    - id: ENA_PLAN_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^EPLAN-\d{3}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        planId must follow the EPLAN-000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: ENA_PLAN_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: energy_plans
          reference_column: planId
      severity: error
      dimension: consistency
      description: |
        planId must exist in energy_plans.planId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: energy_plan_identifier
customProperties:
- property: g3:source
  value:
    category: DATABASE
    system_type: POSTGRESQL
    source_object: public.energy_accounts
    authoritative: true
- property: g3:ingestion
  value:
    mechanism: DEBEZIUM_CDC
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/cdc/energy_accounts/
      immutable: true
    bronze_target: bronze.cdc_changes
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 2000
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/energy_accounts
- property: g3:alternateKeys
  value:
  - accountNumber
- property: g3:derivedQualityChecks
  value:
  - rule_id: ENA_IS_OPEN_DERIVATION
    type: DERIVED_BOOLEAN
    expression: openStatus = 'OPEN'
    output_field: is_open
    description: |
      Silver may derive a boolean is_open field from openStatus.
  - rule_id: ENA_PLAN_CONTEXT_JOIN
    type: APPROVED_REFERENCE_ENRICHMENT
    reference_dataset: energy_plans
    join:
      source_column: planId
      reference_column: planId
    approved_reference_fields:
    - brand
    - brandName
    - displayName
    - fuelType
    - type
    - customerType
    description: |
      Silver may enrich the account with approved retail-plan context after the plan foreign key has passed validation.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all seven fields defined for energy_accounts.
  - |
    accountNumber is a sensitive utility account identifier. It must be masked, tokenised, or removed before customer-facing or general AI consumption.
  - |
    energy_plans is a catalogue dataset without global_id. Its plan attributes may be joined only after planId passes referential-integrity validation.
  - |
    The account-number sequence range is specific to SCALE=1 and must be parameterised or disabled when a different generation scale is used.
  - |
    The physical dataset does not contain organisationId. Any residential or business classification should be derived from the approved energy plan or another governed source rather than invented in this contract.
  - The source does not include a last-updated timestamp, so this contract cannot define a reliable record-level freshness
    rule beyond CDC ingestion metadata.
