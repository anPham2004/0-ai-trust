kind: DataContract
apiVersion: v3.1.0
id: source.database.energy_invoices
version: 1.0.0
name: energy_invoices
status: draft
domain: ENERGY
description:
  purpose: |
    Source dataset containing CDR EnergyInvoice billing records. Each invoice is linked to an energy account and includes issue and due dates, monetary totals, payment status, balance at issue, referenced service points, billing period, electricity and gas charge details, account-charge totals, and an optional pay-on-time discount.
servers:
- server: source-postgresql
  type: postgresql
  description: PostgreSQL CDC source via Debezium for energy_invoices
  environment: prod
schema:
- name: energy_invoices
  logicalType: object
  physicalType: table
  physicalName: public.energy_invoices
  relationships:
  - type: foreignKey
    from:
    - energy_invoices.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - energy_invoices.energyAccountId
    to:
    - energy_accounts.energyAccountId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: EIV_INVOICE_NUMBER_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: invoiceNumber must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - invoiceNumber
  - id: EIV_ACCOUNT_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      An invoice should identify its energy account. The physical schema currently permits energyAccountId to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - energyAccountId
  - id: EIV_CUSTOMER_LINK_PRESENT
    type: library
    metric: nullValues
    mustBe: 0
    severity: warning
    dimension: completeness
    description: |
      An invoice should identify its customer. The physical schema currently permits global_id to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
    - property: g3:columns
      value:
      - global_id
  - id: EIV_ACCOUNT_CUSTOMER_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: energy_accounts
        source_columns:
        - energyAccountId
        - global_id
        reference_columns:
        - energyAccountId
        - global_id
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      energyAccountId and global_id must refer to the same energy account record.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: EIV_DUE_DATE_FORMULA
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_ADD_DAYS_MATCH
      parameters:
        start_date_column: issueDate
        days: 21
        target_date_column: dueDate
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: dueDate must equal issueDate plus twenty-one days.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: EIV_DUE_DATE_AFTER_ISSUE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_COLUMN_COMPARISON
      parameters:
        left_column: dueDate
        operator: GREATER_THAN
        right_column: issueDate
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: dueDate must be later than issueDate.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: EIV_ISSUE_DATE_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_NOT_IN_FUTURE
      columns:
      - issueDate
    severity: warning
    dimension: timeliness
    description: |
      issueDate should not be later than the pipeline processing date.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: EIV_GST_FORMULA
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: NUMERIC_FORMULA_MATCH
      parameters:
        target_column: gstAmount
        formula: invoiceAmount * 0.10
        parse_as: DECIMAL
        tolerance: 0.01
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      gstAmount must equal ten percent of invoiceAmount within rounding tolerance.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: EIV_CORE_MONETARY_VALUES_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - invoiceAmount
      - gstAmount
      - balanceAtIssue
    severity: warning
    dimension: completeness
    description: |
      An invoice should contain its core monetary values. The physical schema currently permits these fields to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: EIV_PERIOD_DURATION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: JSON_DATE_RANGE_DAYS
      parameters:
        json_column: period
        start_path: $.startDate
        end_path: $.endDate
        min_days: 28
        max_days: 91
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      The billing period must contain between twenty-eight and ninety-one days.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: EIV_PERIOD_END_NOT_AFTER_ISSUE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: JSON_DATE_TO_COLUMN_COMPARISON
      parameters:
        json_column: period
        json_date_path: $.endDate
        operator: LESS_THAN_OR_EQUAL
        date_column: issueDate
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      The billing-period end date should not normally be later than issueDate.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: EIV_SERVICE_POINTS_REFERENCE_VALID
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: JSON_ARRAY_FOREIGN_KEY
      parameters:
        source_column: servicePoints
        reference_dataset: energy_service_points
        accepted_reference_columns:
        - nationalMeteringId
        - servicePointId
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      Every referenced service point must exist in energy_service_points.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: EIV_SERVICE_POINTS_BELONG_TO_ACCOUNT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: JSON_ARRAY_REFERENCE_PARENT_CONSISTENCY
      parameters:
        source_column: servicePoints
        parent_column: energyAccountId
        reference_dataset: energy_service_points
        reference_identifier_columns:
        - nationalMeteringId
        - servicePointId
        reference_parent_column: energyAccountId
        comparison_scope: COMPLETE_SNAPSHOT
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      Every referenced service point must belong to the invoice's energy account.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: EIV_GAS_POPULATION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: POPULATION_RATIO_RANGE
      parameters:
        column: gas
        condition: IS_NOT_NULL
        min_ratio: 0.2
        max_ratio: 0.4
        comparison_scope: COMPLETE_SNAPSHOT
    severity: warning
    dimension: consistency
    description: |
      Gas charge details are generated for approximately thirty percent of invoices; a complete-snapshot ratio outside twenty to forty percent should be investigated.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: EIV_DISCOUNT_POPULATION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: POPULATION_RATIO_RANGE
      parameters:
        column: payOnTimeDiscount
        condition: IS_NOT_NULL
        min_ratio: 0.1
        max_ratio: 0.3
        comparison_scope: COMPLETE_SNAPSHOT
    severity: warning
    dimension: consistency
    description: |
      Pay-on-time discounts are generated for approximately twenty percent of invoices; a complete-snapshot ratio outside ten to thirty percent should be investigated.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: EIV_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: energyAccountId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 55bf44d5-f544-468c-a822-eb5e26bd2924
    quality:
    - id: EIV_ENERGY_ACCOUNT_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        energyAccountId must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_ENERGY_ACCOUNT_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: energy_accounts
          reference_column: energyAccountId
      severity: error
      dimension: consistency
      description: |
        energyAccountId must exist in energy_accounts.energyAccountId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: energy_account_identifier
  - name: invoiceNumber
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      pattern: ^INV-\d{7}$
    examples:
    - INV-0000042
    quality:
    - id: EIV_INVOICE_NUMBER_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: invoiceNumber must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_INVOICE_NUMBER_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^INV-\d{7}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        invoiceNumber must follow the INV-0000000 pattern.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: UTILITY_BILLING_IDENTIFIER
        handling: TOKENISE_OR_MASK
    - property: g3:domainType
      value: energy_invoice_identifier
  - name: issueDate
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2026-06-01'
    quality:
    - id: EIV_ISSUE_DATE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: issueDate must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: BILLING_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: date
  - name: dueDate
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2026-06-22'
    quality:
    - id: EIV_DUE_DATE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: dueDate must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: BILLING_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: date
  - name: invoiceAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '245.80'
    quality:
    - id: EIV_INVOICE_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        invoiceAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_INVOICE_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: invoiceAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: gstAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minimum: 0
    examples:
    - '24.58'
    quality:
    - id: EIV_GST_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        gstAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_GST_AMOUNT_NON_NEGATIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 0
      severity: error
      dimension: conformity
      description: gstAmount must not be negative when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
  - name: paymentStatus
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - PAID
    quality:
    - id: EIV_PAYMENT_STATUS_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - PAID
        - PARTIALLY_PAID
        - NOT_PAID
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        paymentStatus must be one of the supported source values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: PAYMENT_STATUS_INFORMATION
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: energy_invoice_payment_status
    - property: g3:accepted
      value:
        values:
        - PAID
        - PARTIALLY_PAID
        - NOT_PAID
  - name: balanceAtIssue
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      minimum: 0
    examples:
    - '98.40'
    quality:
    - id: EIV_BALANCE_AT_ISSUE_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        balanceAtIssue must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_BALANCE_AT_ISSUE_NON_NEGATIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min: 0
      severity: error
      dimension: conformity
      description: |
        balanceAtIssue must not be negative when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
  - name: servicePoints
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_ARRAY
    examples:
    - '["1234567890"]'
    quality:
    - id: EIV_SERVICE_POINTS_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_ARRAY_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        servicePoints must contain a valid JSON array when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_SERVICE_POINTS_NON_EMPTY
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: JSON_ARRAY_MIN_SIZE_IF_PRESENT
        parameters:
          min_items: 1
      severity: warning
      dimension: conformity
      description: |
        servicePoints should contain at least one referenced service point.
      customProperties:
      - property: g3:action
        value: ALLOW_WITH_WARNING
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: NATIONAL_METERING_IDENTIFIER
        handling: TOKENISE_OR_REDACT
    - property: g3:domainType
      value: cdr_energy_invoice_service_points_json
    - property: g3:accepted
      value:
        reference_dataset: energy_service_points
        exact_item_schema_status: TBD_FROM_GENERATOR_CONFIG
  - name: period
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_OBJECT
    examples:
    - '{"startDate":"2026-04-01","endDate":"2026-05-31"}'
    quality:
    - id: EIV_PERIOD_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_OBJECT_IF_PRESENT
      severity: error
      dimension: conformity
      description: period must contain a valid JSON object when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_PERIOD_REQUIRED_KEYS
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: JSON_REQUIRED_KEYS_IF_PRESENT
        parameters:
          keys:
          - startDate
          - endDate
      severity: error
      dimension: conformity
      description: period must contain startDate and endDate.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: EIV_PERIOD_DATES_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: JSON_DATE_PATHS_IF_PRESENT
        parameters:
          paths:
          - $.startDate
          - $.endDate
      severity: error
      dimension: conformity
      description: |
        period.startDate and period.endDate must be parseable as dates.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: ENERGY_USAGE_PERIOD_INFORMATION
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: cdr_energy_billing_period_json
    - property: g3:accepted
      value:
        required_keys:
        - startDate
        - endDate
        duration_days:
          min: 28
          max: 91
  - name: electricity
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_OBJECT
    examples:
    - '{}'
    quality:
    - id: EIV_ELECTRICITY_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_OBJECT_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        electricity must contain a valid JSON object when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: ENERGY_USAGE_AND_CHARGE_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: cdr_electricity_charges_json
    - property: g3:accepted
      value:
        description: Usage, supply, and network charge breakdown.
        exact_schema_status: TBD_FROM_GENERATOR_CONFIG
  - name: gas
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_OBJECT
    examples:
    - '{}'
    quality:
    - id: EIV_GAS_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_OBJECT_IF_PRESENT
      severity: error
      dimension: conformity
      description: gas must contain a valid JSON object when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: ENERGY_USAGE_AND_CHARGE_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: cdr_gas_charges_json
    - property: g3:accepted
      value:
        population_ratio_approximate: 0.3
        exact_schema_status: TBD_FROM_GENERATOR_CONFIG
  - name: accountCharges
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_OBJECT
    examples:
    - '{}'
    quality:
    - id: EIV_ACCOUNT_CHARGES_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_OBJECT_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        accountCharges must contain a valid JSON object when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: ENERGY_CHARGE_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: cdr_energy_account_charges_json
    - property: g3:accepted
      value:
        description: |
          Total charges before and after tax, discounts, and GST.
        exact_schema_status: TBD_FROM_GENERATOR_CONFIG
  - name: payOnTimeDiscount
    logicalType: string
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: JSON_OBJECT
    examples:
    - '{}'
    quality:
    - id: EIV_PAY_ON_TIME_DISCOUNT_JSON
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: VALID_JSON_OBJECT_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        payOnTimeDiscount must contain a valid JSON object when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: BILLING_DISCOUNT_INFORMATION
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: cdr_pay_on_time_discount_json
    - property: g3:accepted
      value:
        discount_rate_approximate: 0.02
        population_ratio_approximate: 0.2
        exact_schema_status: TBD_FROM_GENERATOR_CONFIG
customProperties:
- property: g3:source
  value:
    category: DATABASE
    system_type: POSTGRESQL
    source_object: public.energy_invoices
    authoritative: true
- property: g3:ingestion
  value:
    mechanism: DEBEZIUM_CDC
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/cdc/energy_invoices/
      immutable: true
    bronze_target: bronze.cdc_changes
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 8000
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/energy_invoices
- property: g3:derivedQualityChecks
  value:
  - rule_id: EIV_OVERDUE_FLAG_DERIVATION
    type: DERIVED_BOOLEAN
    expression: |
      CURRENT_DATE > dueDate AND paymentStatus IN ('PARTIALLY_PAID', 'NOT_PAID')
    output_field: is_overdue
    description: |
      Silver may derive an overdue flag from dueDate and paymentStatus.
  - rule_id: EIV_AMOUNT_BUCKET_DERIVATION
    type: PRIVACY_TRANSFORMATION
    source_fields:
    - invoiceAmount
    - gstAmount
    - balanceAtIssue
    output_fields:
    - invoice_amount_masked
    - gst_amount_masked
    - balance_at_issue_masked
    description: |
      AI-ready outputs must use approved monetary range buckets rather than exact invoice values.
  - rule_id: EIV_USAGE_SUMMARY_DERIVATION
    type: DERIVED_SUMMARY
    source_fields:
    - electricity
    - gas
    - accountCharges
    - payOnTimeDiscount
    output_fields:
    - fuel_types_present
    - has_pay_on_time_discount
    - charge_summary_masked
    description: |
      Silver may derive a restricted non-identifying billing summary after all nested charge objects have passed validation.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all fifteen fields defined for energy_invoices.
  - |
    The source explicitly defines dueDate as issueDate plus twenty-one days, gstAmount as ten percent of invoiceAmount, billing periods of twenty-eight to ninety-one days, gas details on approximately thirty percent of invoices, and pay-on-time discounts on approximately twenty percent of invoices.
  - |
    The exact nested schemas for servicePoints, electricity, gas, accountCharges, and payOnTimeDiscount must be copied from the generator or approved CDR schema before this contract is promoted to APPROVED.
  - |
    invoiceNumber, servicePoints, exact monetary amounts, usage details, payment status, and billing dates expose sensitive utility and financial context and must be masked, generalised, redacted, or access-restricted before AI consumption.
  - |
    Service-point referential rules should run only after a complete energy_service_points snapshot is available. They are not suitable for a partially landed CDC micro-batch.
  - The source schema does not contain a payment date or amount-paid field, so this contract cannot calculate an exact outstanding
    balance or verify that PAID invoices have zero balance.
