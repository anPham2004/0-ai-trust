kind: DataContract
apiVersion: v3.1.0
id: source.database.insurance_policies
version: 1.0.0
name: insurance_policies
status: draft
domain: CUSTOMER_PROFILE
description:
  purpose: |
    Source dataset containing customer insurance policy arrangements across home building, home contents, landlord, car, life, and income protection products. Each record includes policy pricing, cover, excess, dates, lifecycle status, and automatic-renewal preference.
servers:
- server: source-postgresql
  type: postgresql
  host: postgres
  port: 5432
  database: g3_sources
  schema: public
  description: PostgreSQL CDC source via Debezium for insurance_policies
  environment: prod
schema:
- name: insurance_policies
  logicalType: object
  physicalType: table
  physicalName: public.insurance_policies
  relationships:
  - type: foreignKey
    from:
    - insurance_policies.global_id
    to:
    - customers.global_id
    customProperties:
    - property: g3:nullable
      value: true
  - type: foreignKey
    from:
    - insurance_policies.customerId
    to:
    - customers.customerId
    customProperties:
    - property: g3:nullable
      value: true
  quality:
  - id: INP_POLICY_ID_UNIQUE
    type: library
    metric: duplicateValues
    mustBe: 0
    severity: error
    dimension: uniqueness
    description: policyId must be unique across the dataset.
    customProperties:
    - property: g3:action
      value: QUARANTINE
    - property: g3:columns
      value:
      - policyId
  - id: INP_CUSTOMER_LINK_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - global_id
      - customerId
    severity: warning
    dimension: completeness
    description: |
      An insurance policy should identify its customer using both global_id and customerId. The physical schema currently permits null values.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: INP_CUSTOMER_IDENTIFIERS_CONSISTENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: REFERENCE_PAIR_CONSISTENT
      parameters:
        reference_dataset: customers
        source_columns:
        - global_id
        - customerId
        reference_columns:
        - global_id
        - customerId
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: |
      global_id and customerId must refer to the same customer record.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: INP_CORE_MONETARY_VALUES_PRESENT
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: ALL_NOT_NULL
      columns:
      - premiumAmount
      - coverAmount
    severity: warning
    dimension: completeness
    description: |
      A policy should contain premiumAmount and coverAmount. The physical schema currently permits these values to be null.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: INP_END_DATE_FORMULA
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_ADD_DAYS_MATCH
      parameters:
        start_date_column: startDate
        days: 365
        target_date_column: endDate
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: endDate must equal startDate plus 365 days.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: INP_END_DATE_AFTER_START
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_COLUMN_COMPARISON
      parameters:
        left_column: endDate
        operator: GREATER_THAN
        right_column: startDate
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: endDate must be later than startDate.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: INP_START_DATE_NOT_IN_FUTURE
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: DATE_NOT_IN_FUTURE
      columns:
      - startDate
    severity: warning
    dimension: timeliness
    description: |
      startDate should not be later than the pipeline processing date.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: INP_ACTIVE_DATE_CONSISTENCY
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: STATUS_DATE_CONSISTENCY
      parameters:
        status_column: status
        active_status: ACTIVE
        start_date_column: startDate
        end_date_column: endDate
        reference_date: PROCESSING_DATE
        require_reference_within_period_for_active: true
        ignore_nulls: true
    severity: warning
    dimension: consistency
    description: |
      An ACTIVE policy should normally include the processing date within its start and end dates.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: INP_AUTO_RENEWAL_ACTIVE_EXPECTATION
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CONDITIONAL_ACCEPTED_VALUES
      parameters:
        source_column: status
        mappings:
          LAPSED:
          - false
          CANCELLED:
          - false
        target_column: autoRenewal
    severity: warning
    dimension: consistency
    description: |
      LAPSED or CANCELLED policies should normally not remain configured for automatic renewal.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: INP_COVER_ABOVE_EXCESS
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: NUMERIC_COLUMN_COMPARISON
      parameters:
        left_column: coverAmount
        operator: GREATER_THAN
        right_column: excessAmount
        parse_as: DECIMAL
        ignore_nulls: true
    severity: error
    dimension: consistency
    description: coverAmount must be greater than excessAmount.
    customProperties:
    - property: g3:action
      value: QUARANTINE
  - id: INP_POLICY_TYPE_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CATEGORICAL_DISTRIBUTION_TOLERANCE
      parameters:
        column: policyType
        expected_ratios:
          HOME_BUILDING: 0.25
          HOME_CONTENTS: 0.2
          LANDLORD: 0.1
          CAR: 0.25
          LIFE: 0.1
          INCOME_PROTECTION: 0.1
        absolute_tolerance: 0.08
        comparison_scope: COMPLETE_SNAPSHOT
    severity: warning
    dimension: consistency
    description: |
      Policy-type proportions should remain reasonably close to the configured mock-data distribution in a complete snapshot.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: INP_PROVIDER_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CATEGORICAL_DISTRIBUTION_TOLERANCE
      parameters:
        column: provider
        expected_ratios:
          Suncorp: 0.2
          IAG/NRMA: 0.18
          Allianz: 0.15
          QBE: 0.12
          AMP: 0.1
          TAL: 0.08
          MLC: 0.07
          Zurich: 0.05
          BankCorp Insurance: 0.05
        absolute_tolerance: 0.08
        comparison_scope: COMPLETE_SNAPSHOT
    severity: warning
    dimension: consistency
    description: |
      Provider proportions should remain reasonably close to the configured mock-data distribution in a complete snapshot.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  - id: INP_STATUS_DISTRIBUTION_MONITORING
    type: custom
    engine: g3-pipeline
    implementation:
      ruleType: CATEGORICAL_DISTRIBUTION_TOLERANCE
      parameters:
        column: status
        expected_ratios:
          ACTIVE: 0.8
          LAPSED: 0.1
          CANCELLED: 0.05
          CLAIMED: 0.05
        absolute_tolerance: 0.08
        comparison_scope: COMPLETE_SNAPSHOT
    severity: warning
    dimension: consistency
    description: |
      Policy-status proportions should remain reasonably close to the configured mock-data distribution in a complete snapshot.
    customProperties:
    - property: g3:action
      value: ALLOW_WITH_WARNING
  properties:
  - name: global_id
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      format: uuid
    examples:
    - 65df84b8-4274-4dbd-9667-6c9967ae6538
    quality:
    - id: INP_GLOBAL_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: global_id must be a valid UUID when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: INP_GLOBAL_ID_CUSTOMER_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: global_id
      severity: error
      dimension: consistency
      description: |
        global_id must exist in customers.global_id when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: person_identifier
  - name: customerId
    logicalType: string
    physicalType: string
    classification: INTERNAL
    logicalTypeOptions:
      pattern: ^CUST-\d{5}$
    examples:
    - CUST-00042
    quality:
    - id: INP_CUSTOMER_ID_PATTERN
      type: library
      metric: invalidValues
      arguments:
        pattern: ^CUST-\d{5}$
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        customerId must follow the CUST-00000 pattern when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: INP_CUSTOMER_ID_FK
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: FOREIGN_KEY_IF_PRESENT
        parameters:
          reference_dataset: customers
          reference_column: customerId
      severity: error
      dimension: consistency
      description: |
        customerId must exist in customers.customerId when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: NONE
    - property: g3:domainType
      value: customer_identifier
  - name: policyId
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: HIGHLY_CONFIDENTIAL
    logicalTypeOptions:
      format: uuid
    examples:
    - e25d95f8-8ac5-4e80-8196-22fd0789dc86
    quality:
    - id: INP_POLICY_ID_NOT_NULL
      type: library
      metric: nullValues
      mustBe: 0
      severity: error
      dimension: completeness
      description: policyId must always be present.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: INP_POLICY_ID_UUID
      type: library
      metric: invalidValues
      arguments:
        format: UUID
      mustBe: 0
      severity: error
      dimension: conformity
      description: policyId must be a valid UUID.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_POLICY_IDENTIFIER
        handling: TOKENISE_OR_MASK
    - property: g3:domainType
      value: insurance_policy_identifier
  - name: policyType
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - CAR
    quality:
    - id: INP_POLICY_TYPE_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - HOME_BUILDING
        - HOME_CONTENTS
        - LANDLORD
        - CAR
        - LIFE
        - INCOME_PROTECTION
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        policyType must be one of the six supported insurance types.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_PRODUCT_INFORMATION
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: insurance_policy_type
    - property: g3:accepted
      value:
        values:
        - HOME_BUILDING
        - HOME_CONTENTS
        - LANDLORD
        - CAR
        - LIFE
        - INCOME_PROTECTION
  - name: provider
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - Allianz
    quality:
    - id: INP_PROVIDER_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - Suncorp
        - IAG/NRMA
        - Allianz
        - QBE
        - AMP
        - TAL
        - MLC
        - Zurich
        - BankCorp Insurance
      mustBe: 0
      severity: error
      dimension: conformity
      description: provider must be one of the supported source providers.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: CUSTOMER_PROVIDER_RELATIONSHIP
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: insurance_provider
    - property: g3:accepted
      value:
        values:
        - Suncorp
        - IAG/NRMA
        - Allianz
        - QBE
        - AMP
        - TAL
        - MLC
        - Zurich
        - BankCorp Insurance
  - name: premiumAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '1100.00'
    quality:
    - id: INP_PREMIUM_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        premiumAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: INP_PREMIUM_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: premiumAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: premiumFrequency
    logicalType: string
    physicalType: string
    required: true
    classification: CONFIDENTIAL
    examples:
    - MONTHLY
    quality:
    - id: INP_PREMIUM_FREQUENCY_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - MONTHLY
        - ANNUAL
        - QUARTERLY
      mustBe: 0
      severity: error
      dimension: conformity
      description: |
        premiumFrequency must be one of the supported payment frequencies.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: premium_payment_frequency
    - property: g3:accepted
      value:
        values:
        - MONTHLY
        - ANNUAL
        - QUARTERLY
  - name: coverAmount
    logicalType: string
    physicalType: string
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '500000.00'
    quality:
    - id: INP_COVER_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL_IF_PRESENT
      severity: error
      dimension: conformity
      description: |
        coverAmount must be parseable as a decimal amount when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: INP_COVER_AMOUNT_POSITIVE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: RANGE_IF_PRESENT
        parameters:
          min_exclusive: 0
      severity: error
      dimension: conformity
      description: coverAmount must be greater than zero when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_COVER_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        min_exclusive: 0
  - name: excessAmount
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - '500'
    quality:
    - id: INP_EXCESS_AMOUNT_DECIMAL
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DECIMAL
      severity: error
      dimension: conformity
      description: excessAmount must be parseable as a decimal amount.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    - id: INP_EXCESS_AMOUNT_ENUM
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: ACCEPTED_NUMERIC_VALUES
        parameters:
          values:
          - 250
          - 500
          - 750
          - 1000
          parse_as: DECIMAL
      severity: error
      dimension: conformity
      description: |
        excessAmount must equal AUD 250, 500, 750, or 1000.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_FINANCIAL_INFORMATION
        handling: RANGE_BUCKET_OR_REDACT
    - property: g3:domainType
      value: decimal_amount
    - property: g3:accepted
      value:
        currency: AUD
        numeric_values:
        - 250
        - 500
        - 750
        - 1000
  - name: startDate
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2026-03-01'
    quality:
    - id: INP_START_DATE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: startDate must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: date
  - name: endDate
    logicalType: date
    physicalType: string
    classification: CONFIDENTIAL
    logicalTypeOptions:
      format: ISO_8601_DATE
    examples:
    - '2027-03-01'
    quality:
    - id: INP_END_DATE_PARSEABLE
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: PARSEABLE_DATE_IF_PRESENT
      severity: error
      dimension: conformity
      description: endDate must be parseable as a date when supplied.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_ACTIVITY_METADATA
        handling: RESTRICT_OR_GENERALISE
    - property: g3:domainType
      value: date
  - name: status
    logicalType: string
    physicalType: string
    required: true
    classification: HIGHLY_CONFIDENTIAL
    examples:
    - ACTIVE
    quality:
    - id: INP_STATUS_ENUM
      type: library
      metric: invalidValues
      arguments:
        values:
        - ACTIVE
        - LAPSED
        - CANCELLED
        - CLAIMED
      mustBe: 0
      severity: error
      dimension: conformity
      description: status must be one of the supported lifecycle values.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: true
        pii_type: INSURANCE_POLICY_STATUS
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: insurance_policy_status
    - property: g3:accepted
      value:
        values:
        - ACTIVE
        - LAPSED
        - CANCELLED
        - CLAIMED
  - name: autoRenewal
    logicalType: boolean
    physicalType: bool
    required: true
    classification: CONFIDENTIAL
    examples:
    - true
    quality:
    - id: INP_AUTO_RENEWAL_BOOLEAN
      type: custom
      engine: g3-pipeline
      implementation:
        ruleType: BOOLEAN
      severity: error
      dimension: conformity
      description: autoRenewal must be a boolean value.
      customProperties:
      - property: g3:action
        value: QUARANTINE
    customProperties:
    - property: g3:sensitivity
      value:
        is_pii: false
        handling: RESTRICT_ACCESS
    - property: g3:domainType
      value: automatic_renewal_flag
    - property: g3:accepted
      value:
        values:
        - true
        - false
customProperties:
- property: g3:source
  value:
    category: DATABASE
    system_type: POSTGRESQL
    source_object: public.insurance_policies
    authoritative: true
- property: g3:ingestion
  value:
    mechanism: DEBEZIUM_CDC
    transport: APACHE_KAFKA
    landing:
      format: JSONL
      path_template: s3://<bucket>/bronze/landing/cdc/insurance_policies/
      immutable: true
    bronze_target: bronze.cdc_insurance_policies
    cdc:
      supported_operations:
      - SNAPSHOT
      - INSERT
      - UPDATE
      - DELETE
      ordering_metadata:
      - source_lsn
      - kafka_partition
      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 1500
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/insurance_policies
- property: g3:derivedQualityChecks
  value:
  - rule_id: INP_ACTIVE_FLAG_DERIVATION
    type: DERIVED_BOOLEAN
    expression: status = 'ACTIVE'
    output_field: is_active
    description: Silver may derive is_active from status.
  - rule_id: INP_MONETARY_BUCKET_DERIVATION
    type: PRIVACY_TRANSFORMATION
    source_fields:
    - premiumAmount
    - coverAmount
    - excessAmount
    output_fields:
    - premium_amount_masked
    - cover_amount_masked
    - excess_amount_masked
    description: |
      AI-ready outputs must use approved monetary range buckets rather than exact insurance amounts.
  - rule_id: INP_POLICY_SUMMARY_DERIVATION
    type: APPROVED_CONTEXT_PROJECTION
    approved_fields:
    - policyType
    - provider
    - premiumFrequency
    - status
    - autoRenewal
    prohibited_fields:
    - policyId
    - premiumAmount
    - coverAmount
    - excessAmount
    description: |
      A restricted policy summary may be projected after quality validation, while identifiers and exact monetary values remain excluded or masked.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all thirteen fields defined for insurance_policies.
  - |
    The physical source contains no organisationId. Business-policy context must not be inferred without another approved governed source.
  - |
    The physical source contains no claim identifier, claim amount, claim date, claim reason, beneficiary details, insured asset details, or cancellation date. The status value CLAIMED does not provide claim-level information.
  - |
    premiumAmount and coverAmount use policy-type-specific log-normal distributions. Those statistical descriptions are not converted into hard record-level amount ranges because the source does not define exact limits.
  - |
    policyId, policyType, provider, exact monetary amounts, policy dates, and status expose sensitive insurance context and must be tokenised, masked, generalised, redacted, or access-restricted before AI consumption.
  - Distribution-monitoring rules are suitable only for complete snapshots and should not run against small or partially landed
    CDC micro-batches.
