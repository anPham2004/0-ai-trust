      - kafka_offset
- property: g3:lifecycle
  value:
    owner: TBD
    approver: TBD
    effective_from: null
- property: g3:dataset
  value:
    expected_rows_scale_1: 3000
    physical_schema_ref: dev-tools/datagen/output/master-schema.json#/energy_service_points
- property: g3:alternateKeys
  value:
  - nationalMeteringId
- property: g3:derivedQualityChecks
  value:
  - rule_id: ESP_ACTIVE_FLAG_DERIVATION
    type: DERIVED_BOOLEAN
    expression: servicePointStatus = 'ACTIVE'
    output_field: is_active
    description: |
      Silver may derive is_active from servicePointStatus.
  - rule_id: ESP_LOCATION_GENERALISATION
    type: PRIVACY_TRANSFORMATION
    source_field: location
    output_fields:
    - location_state
    - location_postcode_generalised
    prohibited_output:
    - exact_street_address
    - exact_unit_number
    description: |
      AI-ready outputs may retain approved generalised location context but must not expose the full service-point address.
  - rule_id: ESP_METER_SUMMARY_DERIVATION
    type: DERIVED_SUMMARY
    source_field: meters
    output_fields:
    - meter_count
    - meter_manufacturers
    description: |
      Silver may derive a non-identifying meter summary after the nested meter array has passed validation.
- property: g3:notes
  value:
  - |
    This contract follows the authoritative physical source schema and includes all fifteen fields defined for energy_service_points.
  - |
    The exact nested schema for location, relatedParticipants, and meters must be copied from the generator or approved CDR schema before this contract is promoted to APPROVED.
  - |
    The source explicitly documents the required distributionLossFactor keys, related-participant role values, consumer-profile values, meter count, and meter manufacturers. The contract validates only those supported details.
  - |
    Meter type and meter status accepted values are not listed in the source description, so this contract requires those keys but does not invent an accepted-value list.
  - |
    servicePointId, nationalMeteringId, location, consumerProfile, and meters can expose sensitive utility and location context and must be masked, generalised, redacted, or access-restricted before AI consumption.
  - The active-account and timestamp-order checks are proposed business consistency warnings. They should be confirmed with
    the team before the contract is promoted from DRAFT to APPROVED.
